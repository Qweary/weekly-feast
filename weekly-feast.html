<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>weekly-feast</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0f1117;--bg2:#161822;--border:#1e2130;--fg:#e2e8f0;--fg2:#94a3b8;--fg3:#64748b;--fg4:#475569;
--blue:#38bdf8;--green:#34d399;--amber:#fbbf24;--red:#ef4444;
--font:'JetBrains Mono','Fira Code','Source Code Pro','Cascadia Code','Consolas',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px}
input,select,textarea,button{font-family:var(--font)}
a{color:var(--blue);text-decoration:none}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:210px;min-width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0;overflow-y:auto}
#sidebar .logo{padding:0 16px 20px;border-bottom:1px solid var(--border);margin-bottom:8px}
#sidebar .logo h1{font-size:15px;font-weight:700;color:#f1f5f9;letter-spacing:.5px;margin:0}
#sidebar .logo .sub{font-size:10px;color:var(--fg3);margin-top:2px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 16px;border:none;background:transparent;color:var(--fg2);cursor:pointer;font-size:12px;text-align:left;border-left:2px solid transparent;width:100%;font-family:var(--font);min-height:44px}
.nav-btn:hover{background:#1e293b22}
.nav-btn.active{background:#1e293b;color:var(--blue);border-left-color:var(--blue)}
.nav-btn.disabled{color:#334155;cursor:not-allowed}
.nav-btn .icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-btn .soon{font-size:9px;color:var(--fg4);margin-left:auto}
#main{flex:1;overflow-y:auto;padding:24px;-webkit-overflow-scrolling:touch}

/* Cards & Components */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.section-title{margin-bottom:20px}
.section-title h2{font-size:18px;font-weight:700;color:#f1f5f9;margin:0}
.section-title .sub{font-size:11px;color:var(--fg3);margin-top:4px}
.btn{padding:7px 14px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-family:var(--font);color:var(--fg);transition:background .15s;min-height:44px}
.btn:disabled{background:#1e293b!important;color:var(--fg4)!important;cursor:not-allowed}
.btn-default{background:#1e293b}.btn-default:hover:not(:disabled){background:#334155}
.btn-primary{background:#0369a1}.btn-primary:hover:not(:disabled){background:#0284c7}
.btn-danger{background:#991b1b}.btn-danger:hover:not(:disabled){background:#b91c1c}
.btn-success{background:#166534}.btn-success:hover:not(:disabled){background:#15803d}
.inp{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 10px;color:var(--fg);font-size:12px;outline:none;width:100%;min-height:36px}
.inp:focus{border-color:#334155}
select.inp{appearance:auto}
textarea.inp{resize:vertical;line-height:1.6}

/* Grid helpers */
.grid{display:grid;gap:8px}.grid-2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid-shop{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.flex{display:flex}.flex-wrap{flex-wrap:wrap}.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}
.items-center{align-items:center}.justify-between{justify-content:space-between}.flex-1{flex:1}

/* Tags */
.tag{padding:3px 10px;border-radius:12px;font-size:11px;display:inline-flex;align-items:center;gap:6px}
.tag button{background:none;border:none;cursor:pointer;font-size:13px;padding:0;line-height:1}

/* Status badges */
.status-badge{padding:3px 10px;border-radius:12px;border:none;cursor:pointer;font-size:10px;font-family:var(--font);font-weight:600;text-transform:uppercase;letter-spacing:.5px;min-height:28px}

/* Category badges */
.cat-badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}

/* Shopping item row */
.shop-row{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;border-bottom:1px solid var(--border);min-height:44px;transition:opacity .12s,background .12s}
.shop-row:last-child{border-bottom:none}
.shop-row.checked{opacity:.55;background:var(--bg)}
.shop-row.checked .shop-name{text-decoration:line-through}
.shop-row input[type=checkbox]{accent-color:var(--blue);width:18px;height:18px;flex-shrink:0;pointer-events:none}

/* Progress bar */
.progress{display:flex;gap:8px;margin-bottom:20px}
.progress .bar{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s}
.progress .bar.active{background:var(--blue)}

/* Toast */
#toast{position:fixed;top:16px;right:16px;background:#166534;color:#bbf7d0;padding:10px 20px;border-radius:6px;font-size:12px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.4);display:none;max-width:300px}
#toast.show{display:block;animation:fadeInOut 2.5s ease}
@keyframes fadeInOut{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0}}

/* Responsive */
#bottom-nav{display:none}
@media(max-width:640px){
  #sidebar{display:none}
  #main{padding:16px 12px 80px}
  #bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:100;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bnav-btn{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:none;background:transparent;color:var(--fg2);font-size:9px;font-family:var(--font);cursor:pointer;white-space:nowrap}
  .bnav-btn.active{color:var(--blue)}
  .bnav-btn.disabled{color:#334155;cursor:not-allowed}
  .bnav-btn .icon{font-size:16px}
  .section-title h2{font-size:16px}
  .grid-2{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr}
  .grid-shop{grid-template-columns:1fr}
  .btn{width:100%}
  .card{padding:12px}
}

/* Remove button */
.rm-btn{background:none;border:none;color:var(--fg4);cursor:pointer;font-size:16px;padding:4px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;flex-shrink:0}
.rm-btn:hover{color:var(--red);background:#991b1b22}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>
<nav id="bottom-nav"></nav>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// DATA & CONSTANTS
// ═══════════════════════════════════════════════════════════════════════════
const KEYS={pantry:'mp:pantry-v2',preferences:'mp:preferences-v1',household:'mp:household-v1',currentPlan:'mp:current-plan-v1',planHistory:'mp:plan-history-v1',promptTemplate:'mp:prompt-template-v3',anchorRecipes:'mp:anchor-recipes-v1',checkedItems:'mp:checked-items-v1'};

const DEFAULT_PANTRY={tier1:[
{id:"t1-1",name:"All-purpose flour",category:"grain",status:"well-stocked",updatedAt:new Date().toISOString()},
{id:"t1-2",name:"Sugar",category:"sweetener",status:"well-stocked",updatedAt:new Date().toISOString()},
{id:"t1-3",name:"White rice",category:"grain",status:"well-stocked",updatedAt:new Date().toISOString()},
{id:"t1-4",name:"Olive oil",category:"oil",status:"well-stocked",updatedAt:new Date().toISOString()},
{id:"t1-5",name:"Soy sauce",category:"condiment",status:"getting-low",updatedAt:new Date().toISOString()},
{id:"t1-6",name:"Salt",category:"spice",status:"well-stocked",updatedAt:new Date().toISOString()},
{id:"t1-7",name:"Black pepper",category:"spice",status:"well-stocked",updatedAt:new Date().toISOString()},
{id:"t1-8",name:"Garlic powder",category:"spice",status:"well-stocked",updatedAt:new Date().toISOString()},
{id:"t1-9",name:"Cumin",category:"spice",status:"getting-low",updatedAt:new Date().toISOString()},
{id:"t1-10",name:"Vinegar",category:"condiment",status:"well-stocked",updatedAt:new Date().toISOString()}
],tier2:[
{id:"t2-1",name:"Eggs (dozen)",category:"dairy",have:true},
{id:"t2-2",name:"Milk (gallon)",category:"dairy",have:true},
{id:"t2-3",name:"Bread (loaf)",category:"grain",have:false},
{id:"t2-4",name:"Butter",category:"dairy",have:true},
{id:"t2-5",name:"Cheddar cheese",category:"dairy",have:false}
],tier3:[
{id:"t3-1",name:"Chicken thighs",category:"protein",quantity:"about 3 lbs",updatedAt:new Date().toISOString()},
{id:"t3-2",name:"Ground beef",category:"protein",quantity:"about 1 lb",updatedAt:new Date().toISOString()},
{id:"t3-3",name:"Frozen mixed vegetables",category:"frozen",quantity:"half remaining",updatedAt:new Date().toISOString()}
]};

const DEFAULT_PREFERENCES={allergies:[],dislikes:[],positives:["Mexican food","One-pot meals","Seasonal vegetables"]};
const DEFAULT_HOUSEHOLD={size:2,mealStructure:"Simple breakfasts and lunches, larger dinners",starterActive:false,walmartThreshold:"only-major",region:"Seattle, WA",planDays:7};

const WALMART_LABELS={"only-major":"Only for major savings (>20%)","moderate":"Moderate savings okay (10-15%)","include-freely":"Include Walmart freely"};
const WALMART_PROMPT={"only-major":"Only recommend Walmart when savings exceed 20% on enough items to justify a separate trip.","moderate":"Recommend Walmart when savings exceed 10-15% on key items.","include-freely":"Treat Walmart as an equal-priority store."};
const STATUS_COLORS={"well-stocked":"#22c55e","getting-low":"#f59e0b","out":"#ef4444"};
const CATEGORY_LABELS={sale:{color:"#34d399",label:"sale"},staple:{color:"#94a3b8",label:"staple"},restock:{color:"#f59e0b",label:"restock"}};
const STATUS_ORDER=["well-stocked","getting-low","out"];

const NAV_ITEMS=[
{id:"dashboard",label:"Dashboard",icon:"◉"},
{id:"pantry",label:"Pantry",icon:"◫"},
{id:"review",label:"Review",icon:"↻"},
{id:"generate",label:"Prompt",icon:"⟩"},
{id:"import",label:"Import",icon:"⇩"},
{id:"preferences",label:"Prefs",icon:"⚙"},
{id:"consumption",label:"Log",icon:"📊",disabled:true}
];

// Production prompt template
const DEFAULT_PROMPT_TEMPLATE=`You are a budget-conscious meal planning assistant. Your job is to research current grocery deals, find matching recipes, and produce a structured weekly meal plan with a shopping list. You will use web search and web fetch to gather real-time data. Do not guess at prices or recipes — fetch actual current information. Live web search is a prerequisite for this task, not an option: the whole point is real, current ad prices. If web search or fetch is unavailable or disabled in this conversation, do not silently proceed as if the prices were real — state plainly at the very top of your narrative that web search was not available, mark every price in the data block with price_type "estimated" (never "confirmed"), and set metadata.confidence to "low." Any individual price you did not verify with a search or fetch this session must likewise be labeled "estimated"; reserve "confirmed" for prices you actually saw in a current ad or coupon listing.


HOUSEHOLD CONTEXT

Household size: {{HOUSEHOLD_SIZE}} people.
Planning for {{PLAN_DAYS}} days starting {{START_DATE}}.
Region: {{REGION}} (use this for seasonal produce awareness).
Sourdough starter active: {{STARTER_ACTIVE}}.


CURRENT PANTRY STATE

{{PANTRY_STATE}}


DIETARY CONSTRAINTS

Hard exclusions (allergies — never include under any circumstances): {{ALLERGIES}}.
Soft exclusions (dislike — avoid when reasonable, but acceptable if a deal is compelling enough to mention): {{DISLIKES}}.
Positive preferences: {{PREFERENCES}}.


STORE CONFIGURATION

Target stores in priority order: QFC, Kroger, Safeway, Walmart.
QFC and Kroger share the Kroger backend, so their weekly ads often overlap — use this to your advantage by searching for Kroger deals once and applying findings to both QFC and Kroger.
All loyalty pricing and digital coupon pricing is available to the household. Factor those prices into your recommendations.

Walmart threshold: {{WALMART_THRESHOLD}}.


SPECIAL INSTRUCTIONS FOR THIS WEEK

{{SPECIAL_INSTRUCTIONS}}


YOUR RESEARCH TASKS

Important — Research Strategy and Tool Call Budget:
You have a budget of approximately 15-20 total web search and web fetch calls. Plan your research to maximize information per call. Here is the priority order:

Phase 1 (Ad Research — aim for 4-6 total calls):
  Start with one or two broad aggregator searches (e.g., "Kroger QFC Safeway weekly ad deals [region] this week") that are likely to surface deal blog summaries or Flipp-style roundups covering multiple stores at once. If the aggregator results are rich enough, you may not need per-store searches. Only escalate to individual store ad page searches for stores that were not covered by the aggregator results. Do not attempt to fetch interactive circular pages unless the simpler approaches returned nothing usable — these rarely yield good text content. Remember that QFC and Kroger share a backend, so one Kroger ad search often covers both.

Phase 2 (Recipe Research — aim for 6-10 total calls):
  Identify the top 3-4 best sale items from Phase 1 (typically the proteins and high-value produce). Search for recipes featuring those specific items on the preferred recipe sites. You can combine multiple preferred sites into a single search query (e.g., "budget chicken thigh recipe site:gracefullittlehoneybee.com OR site:thepioneerwoman.com"). Only fetch the actual recipe page for recipes you intend to include in the final plan — do not fetch pages for candidates you are just evaluating from search snippets. If the sourdough starter is active, allocate one of your recipe searches to pantrymama.com for a sourdough-based recipe. If the starter is not active, redistribute that search to the other preferred sites.

Phase 3 (Confirmation — aim for 2-4 total calls):
  Fetch the recipe pages for your final selections to confirm ingredient lists and quantities. If you already fetched a page during Phase 2, do not re-fetch it.

If you find yourself approaching 20 calls and still have gaps, stop searching and work with what you have. Note any gaps in your narrative summary. A slightly less optimal plan delivered completely is better than an exhaustive search that fails to produce output.


Preferred Recipe Sites:
  - Graceful Little Honey Bee (gracefullittlehoneybee.com) — budget homestead meals
  - Scratch Pantry (scratchpantry.com) — from-scratch staples
  - Pantry Mama (pantrymama.com) — sourdough and fermentation (search only if starter is active)
  - Pioneer Woman (thepioneerwoman.com) — hearty comfort food

If a preferred site has no good match for a given sale ingredient, search other reputable scratch-cooking sites and note the substitution in your narrative.


STEP 1 — GATHER CURRENT AD DATA

Search for current weekly ad deals from each target store, following the phased strategy above. For each store, note the ad cycle dates (start and end) so the meal plan aligns with currently valid pricing. If you cannot retrieve usable ad data for a store after reasonable effort, note it explicitly in the metadata and fall back to general seasonal pricing estimates for that store, clearly labeling any estimated prices.

If fewer than two stores yield confirmed ad data, state this prominently at the start of your narrative, fall back to seasonal pricing and anchor recipes, and flag the entire plan as lower-confidence.


STEP 2 — FIND MATCHING RECIPES

Based on the top sale proteins and produce from Step 1, search the preferred recipe sites for matching recipes. Prefer recipes where the majority of ingredients are either on sale, already in the pantry, or cheap staples. Fetch the actual recipe page to confirm ingredients and quantities for your final selections — do not rely on search snippet summaries alone for recipes you include in the plan.

When evaluating recipes, scale them to {{HOUSEHOLD_SIZE}} servings. Reflect the scaled quantities in both the ingredient list and cost calculations in the final output.


STEP 3 — BUILD THE MEAL PLAN

Dinners: Select recipes for each planned dinner night (accounting for any skipped nights from special instructions). Maximize ingredient overlap across the week, and enforce it as a hard rule rather than an aspiration: any perishable bought in a bunch or multi-serving format that a single meal cannot finish (a bunch of cilantro or scallions, a head of cabbage, a bag of greens, a tub of sour cream, a block of cheese) MUST be routed to at least two — ideally three — meals scheduled close enough together to use it before it decays (one bunch of cilantro → tacos, a grain bowl, and a soup garnish within four days). Use cascade cooking to build that overlap on purpose: cook a base once and redeploy it across days (a roast chicken → sliced for dinner day 1, shredded into wraps or a salad day 2, the carcass into soup or stock day 3; one pot of grains or one tray of roasted vegetables fanned across several meals as a shared component). Planned leftovers and shared components are a design choice that cuts cost and waste at once — build them in deliberately. Sequence meals by perishability as a descending staircase, not a coarse first-half/second-half split. Place the most perishable ingredients earliest and pin them tightly: Tier-0 items with a 1-2 day refrigerated life (fresh fish and shellfish, fresh ground meat and ground poultry, delicate soft herbs like cilantro and basil, tender salad greens, fresh berries, ripe avocado) MUST be cooked on day 1 or day 2 — this is the first-48 rule: highly perishable meat and produce is cooked or frozen within 48 hours of purchase. Schedule Tier-1 items with a 3-5 day life (large raw cuts of beef and pork, broccoli, asparagus, green beans, mushrooms, bell peppers) on days 2-4. Spread Tier-2 items with a 1-2 week life (carrots, celery, cabbage, citrus, apples, hard cheeses, eggs) across the mid-to-late week. Backfill the last days (day 5 onward) with Tier-3, frozen, and pantry-stable items (potatoes, onions, winter squash, canned and dried goods, anything frozen). Read the finished week top to bottom: perishability should fall, never rise, from the first dinner to the last. Freezer offload is the pressure valve — if the plan or a sale-driven bulk buy brings in more Tier-0 or Tier-1 protein than can be cooked within its refrigerated window (common for a small household buying a family pack), direct the household to portion and freeze the surplus on day 0, the shopping day, dated and rotated first-in-first-out, and pull it to a back-half night. Freezing pauses the decay clock and suits proteins, cooked components, and stock; do not freeze high-water raw produce or tender greens for fresh use. Call out each freeze-on-day-0 action in that day's perishability_note and in the narrative so the household actually freezes it in time. For each dinner, calculate approximate cost per serving using confirmed sale prices where available and estimates where not, and judge value on cost per serving actually eaten rather than sticker or shelf-unit price. When comparing package sizes or a bulk buy, use spoilage-adjusted unit cost: divide the price by the quantity the household will realistically consume before it spoils, not the quantity printed on the label — a larger, cheaper-per-ounce pack is only cheaper if it is fully used, and for a small household a family-size perishable is often more expensive per serving eaten once the spoiled remainder is priced in. When cost and perishability conflict, favor the plan that is fully consumed. When two options cost similarly, favor the one using fresh seasonal produce over processed ingredients, and note this choice. Compute actual calendar dates for each day by counting forward from {{START_DATE}}.

Breakfasts and lunches: Provide simple text suggestions (oatmeal, sandwiches, eggs, leftovers, simple salads) without full recipe treatment. These should be low-effort, pantry-driven meals. Reference specific leftovers by name where applicable (e.g., "leftover beef stew from Day 3").

Pantry consumption check: After drafting the full week's plan, review cumulative ingredient usage against the pantry state. If any pantry item categorized as "well-stocked" or "getting low" would be substantially depleted by the week's meals (e.g., the plan uses rice in 5 of 7 dinners, or multiple recipes draw heavily on the same spice), flag it in the pantry_alerts section of the JSON. This helps the household anticipate restock needs before they run out.

Single-use audit: in the same pass, walk every fresh or perishable ingredient the plan buys and flag any that only one meal uses — especially a Tier-0 or Tier-1 bunch or multi-serving item whose remainder will spoil before a second occasion. Prefer to fix each one in place (add a second meal that uses the remainder, downsize the purchase to the amount actually needed, or substitute a longer-life pantry alternative) rather than leave a stranded remainder. If a single-use perishable purchase is genuinely unavoidable, say so explicitly in the narrative and name what happens to the leftover, so the waste is a visible choice and not an accident.


STEP 4 — GENERATE THE SHOPPING LIST

Consolidate all ingredients across the week's meals. Group by store, with the recommended store for each item based on current pricing. For items not on sale, mark them as "staple — buy at any store" rather than assigning a specific store. If a staple happens to be on sale at a store the household is already visiting, note it as a restock opportunity — especially if the pantry shows it as "getting low." Apply stock-up economics to non-perishable and freezer-stable staples: when a shelf-stable or freezer-stable item is at an unusually low "trough" price (a loss-leader or deep sale well below its normal shelf price), recommend buying deeper than the week needs to ride out until the next such sale — but only up to what the household can store and rotate before it expires, never past its storage or freezer capacity. Do not stock up on Tier-0 or Tier-1 perishables this way unless the surplus is frozen on day 0. Flag any such deeper buy in that item's notes so the household understands it is a deliberate stock-up, not this week's need. Include quantities for everything. Flag any Walmart recommendations with a brief savings justification.


OUTPUT FORMAT

Produce two parts: a machine-readable data block and a human-readable narrative.
The importer scans your entire response for the data block, so ordinary prose,
tool-use notes, or reasoning may appear before, between, or after the two parts.

PART A — THE DATA BLOCK:
Emit the meal plan as a single JSON object wrapped between two sentinel lines. Put
the exact text BEGIN_WEEKLY_FEAST_JSON on its own line immediately before the JSON,
and the exact text END_WEEKLY_FEAST_JSON on its own line immediately after it.
Nothing else goes on those two sentinel lines. Skeleton:

BEGIN_WEEKLY_FEAST_JSON
{ ...the plan object, conforming to the schema below... }
END_WEEKLY_FEAST_JSON

Do not wrap the JSON in Markdown code fences or backticks — the sentinel lines are
the delimiter. The content between the sentinels must be one complete JSON object
conforming to the schema. Emit the whole object in a single uninterrupted block: do
not truncate it and do not split it across multiple sentinel blocks.

Emit the COMPLETE data block BEFORE you write the narrative. If you are running low
on output space, finish the JSON and shorten or omit the narrative — never leave the
JSON cut off. A complete plan with no narrative is a success; a truncated plan is a
failure.

PART B — THE NARRATIVE:
After the data block, write a narrative summary explaining your reasoning: why you
chose these recipes, what deals drove the plan, any tradeoffs between cost and
quality, stores with missing ad data, pantry depletion concerns, and any items
worth stocking up on due to unusually good sales. Separate it from the data block
with a Markdown horizontal rule (---). This section is for the human reader only.

DATA RULES — apply these when building the JSON:
- Every numeric value must be a bare JSON number: 2.85, not "2.85", not $2.85, not
  1,299. No quotes, no currency symbols, no thousands separators. (The importer will
  try to coerce a stray numeric string, but write bare numbers so nothing is lost.)
- Use null (unquoted) for any nullable field that does not apply — never "N/A",
  "none", "-", or an empty string.
- Every day in meal_plan must include a "dinner" OBJECT, even a leftovers or eat-out
  night. For those nights set "name" to a short label (e.g. "Leftovers — Day 3
  stir-fry"), set "ingredients" to [], keep a real "servings" count, and set
  "cost_per_serving", "source_url", "source_site", and the note fields to null.
  Do not make "dinner" a bare string.


JSON SCHEMA

The JSON object between the sentinels must follow this structure. All fields shown
are required unless annotated as nullable. Numbers are bare numbers; nullable fields
use null, not empty strings. The importer will coerce a numeric string, wrap a bare
dinner name into an object, and fill missing optional arrays — but treat that as a
safety net, not a target: emit the schema exactly.

{
  "metadata": {
    "plan_date": "YYYY-MM-DD",
    "plan_days": 7,
    "household_size": 4,
    "stores_searched": ["QFC", "Kroger", "Safeway", "Walmart"],
    "stores_confirmed": ["QFC", "Kroger", "Safeway"],
    "stores_estimated": ["Walmart"],
    "confidence": "normal"
  },
  "meal_plan": [ { "day": 1, "date": "YYYY-MM-DD", "breakfast": "...", "lunch": "...", "dinner": { "name": "...", "source_url": "...", "source_site": "...", "servings": 4, "cost_per_serving": 2.85, "perishability_note": "... or null", "quality_note": "... or null", "ingredients": [ { "item": "...", "quantity": "...", "source": "sale | pantry | staple", "store": "store name or null", "price_estimate": 0.00 } ] } } ],
  "shopping_list": [ { "item": "...", "quantity": "...", "store": "store name or any", "price": 0.00, "price_type": "confirmed | estimated", "category": "sale | staple | restock", "notes": "... or null" } ],
  "pantry_alerts": [ { "item": "...", "concern": "..." } ],
  "cost_summary": { "total_estimated": 0.00, "per_person_per_day": 0.00, "by_store": { "StoreName": 0.00 } }
}

Field notes:
- "metadata.confidence": Use "normal" when at least two stores have confirmed ad data. Use "low" when fewer than two stores have confirmed data.
- "source" in ingredients: "pantry" for items on hand (price_estimate and store should be null), "sale" for items on confirmed or estimated sale, "staple" for items bought at regular price.
- "price_type" in shopping_list: "confirmed" from actual ad/coupon listing, "estimated" from general knowledge.
- "category" in shopping_list: "sale" for deal-driven purchases, "staple" for regular-price necessities, "restock" for items the pantry shows as low or out.
- "pantry_alerts": Include entries only when cumulative weekly usage warrants a heads-up. An empty array is fine if no alerts are needed.

// Coerce anything to a finite number, else null. Handles "$2.85", "1,234.50", "4".

function sliceBalancedObjects(s){

      if(c==='\\'){esc=true;continue}
      if(c===q)inStr=false;

    }
    if(c==='"'||c==="'"){inStr=true;q=c;continue}
    if(c==='{'){if(depth===0)start=i;depth++;}
    else if(c==='}'){if(depth>0){depth--;if(depth===0&&start!==-1){out.push(s.slice(start,i+1));start=-1;}}}

}

    if(c==='"'||c==="'"){inStr=true;q=c;continue}
    if(c==='{')curly++;else if(c==='}')curly--;

// Best-effort JSON repair: unicode quotes, single-quoted strings, comments,
// unquoted keys, trailing commas, python literals. Only invoked after strict fails.
function repairJSON(s){

  function fixStruct(t){

      .replace(/,(\s*[}\]])/g,'$1')                             // trailing commas

      let lit=c;i++;

      out+=lit;continue;
    }

      out+=fixStruct(struct);struct='';
      i++;let buf='';
      while(i<n){const d=s[i];
        if(d==='\\'){buf+=d+(i+1<n?s[i+1]:'');i+=2;continue}
        if(d==="'"){i++;break}
        if(d==='"'){buf+='\\"'}else buf+=d;
        i++;
      }
      out+='"'+buf+'"';continue;
    }
    if(c==='/'&&s[i+1]==='/'){i+=2;while(i<n&&s[i]!=='\n')i++;continue}
    if(c==='/'&&s[i+1]==='*'){i+=2;while(i<n&&!(s[i]==='*'&&s[i+1]==='/'))i++;i+=2;continue}

function parseCandidate(str){

    block=stripFence(block).trim();
    const objs=sliceBalancedObjects(block);
    if(objs.length)for(const o of objs)cands.push(o);
    else if(block)cands.push(block);
  }
  for(const f of extractFenced(text)){
    const objs=sliceBalancedObjects(f);
    if(objs.length)for(const o of objs)cands.push(o);
    else if(f.trim())cands.push(f.trim());
  }
  for(const o of sliceBalancedObjects(text))cands.push(o);
  const seen={},uniq=[];
  for(const c of cands){const k=c.trim();if(k&&!seen[k]){seen[k]=1;uniq.push(k);}}
  return uniq;
}

// Orchestrate extract -> parse -> normalize -> validate. Pure: {ok,plan}|{ok,error}.
function parsePlanResponse(raw){
  const text=(raw==null?'':String(raw)).trim();
  if(!text)return{ok:false,error:MSG_EMPTY};
  const cands=extractPlanJSON(text);
  if(!cands.length)return{ok:false,error:MSG_NO_JSON};
  let parseErr=null,best=null,bestScore=0;
  for(const cand of cands){
    const pc=parseCandidate(cand);
    if(!pc.ok){if(parseErr==null||pc.truncated)parseErr=pc.error;continue}
    const score=planScore(pc.data);
    if(score===0)continue;
    if(score>bestScore){best=pc.data;bestScore=score;}
    if(score>=3)break;
  }
  if(best!=null)return{ok:true,plan:normalizePlan(best)};
  if(parseErr)return{ok:false,error:parseErr};
  return{ok:false,error:MSG_NOT_PLAN};
}

let _pendingUpgradeToast=null;
(function migrateTemplateV3(){
  try{
    const DONE='mp:migrated-template-v3';
    if(localStorage.getItem(DONE))return;
    const V2='mp:prompt-template-v2',V3=KEYS.promptTemplate;
    const oldV2=localStorage.getItem(V2);
    const hasV3=localStorage.getItem(V3)!=null;
    if(oldV2!=null&&!hasV3){
      let parsed;try{parsed=JSON.parse(oldV2)}catch(e){parsed=oldV2}
      const oldText=typeof parsed==='string'?parsed:'';
      if(oldText&&oldText.indexOf(WF_SENTINEL_BEGIN)===-1){
        // stale (pre-sentinel) contract: back it up, adopt the new v3 default
        try{localStorage.setItem('mp:prompt-template-v2-backup',oldV2)}catch(e){}
        _pendingUpgradeToast='Prompt template upgraded to the new import format. Your previous template was backed up.';
      }else if(oldText){
        try{localStorage.setItem(V3,oldV2)}catch(e){} // already sentinel-aware: carry forward
      }
    }
    try{localStorage.removeItem(V2)}catch(e){}
    localStorage.setItem(DONE,'1');
  }catch(e){/* migration is best-effort */}
})();

// Non-cook night classifier — leftovers first (common case), then eat-out, else neutral catch-all.
// Never returns null: every non-cook night gets a glanceable category pill instead of a broken metadata line.
function noCookPill(name){
  const s=(name||'').toLowerCase();
  if(/leftover/.test(s)) return {text:'Leftovers',glyph:'↻'};
  if(/eat[\s-]?out|take[\s-]?out|takeaway|restaurant|dine|dining|order (in|out)|delivery|pizza night/.test(s)) return {text:'Eat out',glyph:'↗'};
  return {text:'No cook',glyph:'○'};
}
function renderMealCards(mp){
  return `<div class="grid grid-3" style="margin-bottom:24px">${mp.map(day=>{
    const d=day.dinner||{};
    // Non-cook night = placeholder dinner shape: no ingredients, no cost, no source.
    const isNoCook=(!d.ingredients||d.ingredients.length===0)&&d.cost_per_serving==null&&d.source_site==null&&d.source_url==null;
    let dinnerBlock;
    if(isNoCook){
      // Non-cook: title in --fg (blue is reserved for real recipe links), category pill replaces the metadata line.
      const p=noCookPill(d.name);
      dinnerBlock=`<div style="font-weight:600;color:var(--fg);font-size:12px">${esc(d.name)}</div>
        <div style="margin-top:2px"><span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;padding:2px 8px;border-radius:10px;background:#94a3b81a;color:var(--fg2)">${p.glyph} ${esc(p.text)}</span></div>`;
    }else{
      // Cook night: unchanged — blue recipe link (if URL) + source · cost · servings metadata line.
      const su=safeUrl(d.source_url);
      const link=su?`<a href="${esc(su)}" target="_blank" rel="noopener">${esc(d.name)} ↗</a>`:esc(d.name);
      dinnerBlock=`<div style="font-weight:600;color:var(--blue);font-size:12px">${link}</div>
        <div style="font-size:10px;color:var(--fg3);margin-top:2px">${esc(d.source_site)} · $${n2(d.cost_per_serving)}/serving · ${d.servings} servings</div>`;
    }
    return `<div class="card" style="padding:14px">
      <div class="flex justify-between" style="margin-bottom:8px"><span style="font-weight:700;color:#f1f5f9">Day ${day.day}</span><span style="font-size:11px;color:var(--fg3)">${esc(day.date)}</span></div>

      <div style="border-top:1px solid var(--border);padding-top:6px">
        ${dinnerBlock}
        ${d.perishability_note?`<div style="font-size:10px;color:var(--amber);margin-top:3px">⏱ ${esc(d.perishability_note)}</div>`:''}
        ${d.quality_note?`<div style="font-size:10px;color:#a78bfa;margin-top:3px">★ ${esc(d.quality_note)}</div>`:''}
      </div></div>`}).join('')}</div>`;

// ─── Prompt Generator ───────────────────────────────────────────────────────
function serializePantry(){
  const p=S.pantry;
  const ws=p.tier1.filter(i=>i.status==='well-stocked').map(i=>i.name).join(', ');
  const gl=p.tier1.filter(i=>i.status==='getting-low').map(i=>i.name).join(', ');
  const out=p.tier1.filter(i=>i.status==='out').map(i=>i.name).join(', ');
  const t3=p.tier3.filter(i=>i.quantity).map(i=>`${i.name} (${i.quantity})`).join(', ');
  const t2=p.tier2.filter(i=>i.have).map(i=>i.name).join(', ');
  let parts=[];
  if(ws)parts.push('Well-stocked: '+ws+'.');if(gl)parts.push('Getting low: '+gl+'.');
  if(out)parts.push('Out: '+out+'.');if(t3)parts.push('Have: '+t3+'.');
  if(t2)parts.push('Weekly items on hand: '+t2+'.');
  return parts.join(' ')||'No pantry items tracked.';
}

function generatePrompt(){
  let prompt=S.promptTemplate;
  const r={'{{HOUSEHOLD_SIZE}}':String(S.household.size),'{{PLAN_DAYS}}':String(S.household.planDays||7),'{{START_DATE}}':S.startDate,'{{REGION}}':S.household.region||'Seattle, WA','{{STARTER_ACTIVE}}':S.household.starterActive?'yes':'no','{{PANTRY_STATE}}':serializePantry(),'{{ALLERGIES}}':S.prefs.allergies.length?S.prefs.allergies.join(', '):'None','{{DISLIKES}}':S.prefs.dislikes.length?S.prefs.dislikes.join(', '):'None','{{PREFERENCES}}':S.prefs.positives.length?S.prefs.positives.join(', '):'None','{{WALMART_THRESHOLD}}':WALMART_PROMPT[S.household.walmartThreshold]||WALMART_PROMPT['only-major'],'{{SPECIAL_INSTRUCTIONS}}':S.specialInstructions.trim()||'None','{{ANCHOR_RECIPES}}':S.anchorRecipes.trim()||'None specified'};
  Object.entries(r).forEach(([k,v])=>{prompt=prompt.replaceAll(k,v)});
  return prompt;
}

// EVENT BINDING & ACTIONS
// ═══════════════════════════════════════════════════════════════════════════
function bindEvents(){
  // Nav buttons (both sidebar and bottom)
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick=()=>{if(!btn.disabled)nav(btn.dataset.nav)};
  });
  // Shopping rows — whole-row tap toggles the item (checkbox is a pointer-events:none state
  // indicator; the ×'s event.stopPropagation suppresses this handler so it removes without toggling).
  // In-place mutation (no full render on toggle) preserves scroll position and keeps checked rows put.
  document.querySelectorAll('.shop-row[data-shoprow]').forEach(row=>{
    const toggle=()=>{
      const gi=row.dataset.shoprow;
      const now=!S.checkedItems[gi];
      S.checkedItems[gi]=now;
      saveCheckedItems();
      row.classList.toggle('checked',now);
      row.setAttribute('aria-checked',now?'true':'false'); // keep SR checked-state in sync
      const cb=row.querySelector('input[type=checkbox]');
      if(cb)cb.checked=now;
      updateShopCounter();
    };
    row.onclick=toggle;
    // Keyboard parity (role=checkbox): Enter/Space toggle. Guard e.target===row so a keypress on
    // the focused × button (which has its own native activation) is not hijacked by the row handler.
    row.onkeydown=e=>{
      if(e.target!==row)return;
      if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();toggle();}
    };
  });
  // Enter keys for preference inputs
  ['new-allergy','new-dislike','new-pref','pantry-name'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.onkeydown=e=>{
      if(e.key==='Enter'){
        if(id==='new-allergy')startAddAllergy();
        else if(id==='new-dislike')addDislike();
        else if(id==='new-pref')addPositivePref();
        else if(id==='pantry-name')addPantryItem();
      }
    };
  });
}

// Export shopping list
function exportShoppingList(){
  const plan=S.currentPlan;if(!plan)return;
  const{shopping_list:sl=[],cost_summary:cs={},metadata:md={}}=plan;
  const byStore={};sl.forEach(item=>{const s=item.store||'Other';if(!byStore[s])byStore[s]=[];byStore[s].push(item)});
  let txt=`Shopping List — Week of ${md.plan_date||todayStr()}\nTotal: $${n2(cs.total_estimated)} ($${n2(cs.per_person_per_day)}/person/day)\n`;
  Object.entries(byStore).forEach(([store,items])=>{
    txt+=`\n── ${store} ──\n`;
    items.forEach(item=>{
      let line=`[ ] ${item.item}`;
      if(item.quantity)line+=` — ${item.quantity}`;
      line+=` — $${n2(item.price)}`;
      if(item.price_type==='estimated')line+=' (est.)';
      if(item.category==='restock')line+=' (restock)';
      if(item.notes)line+=` — ${item.notes}`;
      txt+=line+'\n';
    });
  });
  navigator.clipboard.writeText(txt).then(()=>showToast('Shopping list copied!')).catch(()=>showToast('Copy failed'));
}

// Shopping list item removal/restore
function removeShoppingItem(idx){
  if(!S.currentPlan)return;
  const sl=S.currentPlan.shopping_list;
  if(idx<0||idx>=sl.length)return;
  const item=sl[idx];
  // Track for undo
  S.removedShoppingItems.push({...item});
  // Update cost summary
  const cs=S.currentPlan.cost_summary;
  if(cs&&item.price!=null){
    cs.total_estimated=(cs.total_estimated||0)-item.price;
    if(cs.total_estimated<0)cs.total_estimated=0;
    const days=S.currentPlan.metadata?.plan_days||7;
    const ppl=S.currentPlan.metadata?.household_size||1;
    cs.per_person_per_day=cs.total_estimated/(days*ppl);
    const store=item.store||'Other';
    if(cs.by_store&&cs.by_store[store]!=null){
      cs.by_store[store]-=item.price;
      if(cs.by_store[store]<=0)delete cs.by_store[store];
    }
  }
  // Remove from list and clean up checked state
  sl.splice(idx,1);
  // Rebuild checkedItems with shifted indices
  const newChecked={};
  Object.keys(S.checkedItems).forEach(k=>{
    const ki=parseInt(k);
    if(ki<idx)newChecked[ki]=S.checkedItems[ki];
    else if(ki>idx)newChecked[ki-1]=S.checkedItems[ki];
    // ki===idx is the removed item, skip it
  });
  S.checkedItems=newChecked;
  savePlan();saveCheckedItems();render();
}

function restoreShoppingItem(removedIdx){
  if(removedIdx<0||removedIdx>=S.removedShoppingItems.length)return;
  if(!S.currentPlan)return;
  const item=S.removedShoppingItems.splice(removedIdx,1)[0];
  S.currentPlan.shopping_list.push(item);
  // Restore cost summary
  const cs=S.currentPlan.cost_summary;
  if(cs&&item.price!=null){
    cs.total_estimated=(cs.total_estimated||0)+item.price;
    const days=S.currentPlan.metadata?.plan_days||7;
    const ppl=S.currentPlan.metadata?.household_size||1;
    cs.per_person_per_day=cs.total_estimated/(days*ppl);
    const store=item.store||'Other';
    if(cs.by_store)cs.by_store[store]=(cs.by_store[store]||0)+item.price;
  }
  savePlan();render();
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════

// Data export/import
function exportAllData(){
  const data={
    _format:'meal-planner-backup',_version:1,_exportedAt:new Date().toISOString(),
    pantry:S.pantry,preferences:S.prefs,household:S.household,
    currentPlan:S.currentPlan,planHistory:S.planHistory,
    promptTemplate:S.promptTemplate,anchorRecipes:S.anchorRecipes,
    checkedItems:S.checkedItems
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`weekly-feast-backup-${todayStr()}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup exported!');
}

function importAllData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      // Validate expected keys
      const required=['pantry','preferences','household'];
      const missing=required.filter(k=>!(k in data));
      if(missing.length){showToast('Invalid backup: missing '+missing.join(', '));return}
      if(!confirm('This will replace ALL current data (pantry, preferences, plans, history) with the backup. Continue?'))return;
      // Restore state
      if(data.pantry){S.pantry=data.pantry;savePantry()}
      if(data.preferences){S.prefs=data.preferences;savePrefs()}
      if(data.household){S.household=data.household;saveHousehold()}
      if('currentPlan' in data){S.currentPlan=data.currentPlan;savePlan()}
      if(data.planHistory){S.planHistory=data.planHistory;saveHistory()}
      let _tplUpgraded=false;
      if(typeof data.promptTemplate==='string'){
        // D4 field-level guard: keep a sentinel-aware template as-is; upgrade a stale one.
        if(data.promptTemplate.includes('BEGIN_WEEKLY_FEAST_JSON')){S.promptTemplate=data.promptTemplate;}
        else{S.promptTemplate=DEFAULT_PROMPT_TEMPLATE;_tplUpgraded=true;}
        saveTemplate();
      }
      if('anchorRecipes' in data){S.anchorRecipes=data.anchorRecipes;saveAnchors()}
      if(data.checkedItems){S.checkedItems=data.checkedItems;saveCheckedItems()}
      else{S.checkedItems={};saveCheckedItems()}
      S.removedShoppingItems=[];S.showRemovedItems=false;
      showToast(_tplUpgraded?'Data restored — upgraded an old prompt template to the new import format.':'Data restored from backup!');render();
    }catch(err){showToast('Failed to parse backup file: '+err.message)}
  };
  reader.readAsText(file);
  event.target.value=''; // Reset so same file can be re-selected
}

render();
if(_pendingUpgradeToast){showToast(_pendingUpgradeToast);_pendingUpgradeToast=null;}
</script>
