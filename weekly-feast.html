// ═══════════════════════════════════════════════════════════════════════════
// E2-2 SURFACE — the cross-week WASTE RETROSPECTIVE (the History / consumption view).
// READ-PATH ONLY (Q3/constraint-12): no new KEY, no planHistory shape change,
// no normalizer touch, promptTemplate byte-frozen. Reads S.wasteLog + the resident
// S.planHistory window. Every honest floor from D1–D8 lives in wasteAggregate;
// the render honors A2 (money = 22px/700 --fg glance-HOOK; repeat-offender block
// = first-class co-equal PAYOFF, never a footnote), U1–U6, and C1–C6.
// ═══════════════════════════════════════════════════════════════════════════

// Count of LOGGED weeks in the resident window — the C1 on-ramp gate (N≥2). Cheap;
// reads S.wasteLog presence over resident planHistory dates ONLY (never the dismiss map).
function wasteLoggedCount(){
  const hist=Array.isArray(S.planHistory)?S.planHistory:[];
  let n=0;
  for(const e of hist){ const d=(e&&typeof e.date==='string')?e.date:''; if(d&&S.wasteLog[d]) n++; }
  return n;
}
// Whole-number weeks-ago of the newest logged week (recency disclosure, D1-floor-5).
// null when the date is unparseable. Uses Date.now() (frozen deterministic in the harness).
function wasteWeeksAgo(dateISO){
  if(!dateISO) return null;
  const t=Date.parse(dateISO);
  if(!Number.isFinite(t)) return null;
  const wk=Math.floor((Date.now()-t)/(7*24*3600*1000));
  return wk>=0?wk:null;
}
// Cross-week perishability tier map: merge wasteTierMap (the pwNorm S13 fold) over every
// resident week, newest-first / first-seen-wins (the pwBuildModel L1476 idiom). Feeds the
// repeat-offender FRESH-FIRST ordering (U4) — reusing wasteChips' tier source, not a new one.
function wasteAggTierMap(hist){
  const map={};
  for(let wi=0;wi<hist.length;wi++){
    const tm=wasteTierMap(hist[wi]&&hist[wi].plan);
    for(const k of Object.keys(tm)){ if(!(k in map)) map[k]=tm[k]; }
  }
  return map;
}
// THE AGGREGATE (D1–D6). Iterates RESIDENT planHistory dates and includes a
// wasteLog record iff its date is still resident — auto-bounding to ≤52 weeks and
// excluding orphans WITHOUT destroying them (D6). Reads S.wasteLog ONLY (never the dismiss
// map — N3). THE SACRED INVARIANT: the denominator is LOGGED weeks, never calendar weeks —
// an absent week enters NEITHER numerator NOR denominator (absent-never-0, one level up).
// Zero-waste weeks ARE logged: counted in N, contributing $0 to the numerator (D2). The
// rate is priced-only → a within-window LOWER bound; unpriced tossed items are EVENTS, not
// dollars (D4). `estimated` propagates if any contributing dollar is estimated (D5).
// Repeat offenders fold cross-week by pwNorm over ≥2 DISTINCT logged weeks, unpriced
// included, buy-linkage-independent (D3).
function wasteAggregate(){
  const hist=Array.isArray(S.planHistory)?S.planHistory:[];
  let n=0,weeksWithWaste=0,weeksZero=0,pricedSum=0,pricedCount=0,unpricedCount=0,estimated=false,newestLoggedDate=null;
  const offCount={},offDisplay={},offFirst={};
  for(let wi=0;wi<hist.length;wi++){
    const e=hist[wi];
    const d=(e&&typeof e.date==='string')?e.date:'';
    if(!d) continue;
    const rec=S.wasteLog[d];
    if(!rec) continue;                                  // absent (incl. dismissed) → excluded, NEVER a $0
    n++;
    if(newestLoggedDate===null) newestLoggedDate=d;     // newest-first iteration → first logged = most recent
    if(rec.zeroWaste===true){ weeksZero++; continue; }  // affirmative-zero: logged, $0 to numerator (D2)
    weeksWithWaste++;
    const dl=wasteDollars(rec);
    pricedSum+=dl.sum; pricedCount+=dl.priced; unpricedCount+=dl.unpriced;
    if(dl.estimated) estimated=true;
    const seen={};                                      // count each pwNorm key ONCE per week (distinct-week fold)
    for(const it of (Array.isArray(rec.items)?rec.items:[])){
      const key=pwNorm(it&&it.name);
      if(!key||seen[key]) continue;
      seen[key]=true;
      offCount[key]=(offCount[key]||0)+1;
      if(!(key in offFirst)){ offFirst[key]=wi; offDisplay[key]=String(it&&it.name==null?'':it.name); }
    }
  }
  const tierMap=wasteAggTierMap(hist);
  const offenders=Object.keys(offCount).filter(k=>offCount[k]>=2)
    .map(k=>({key:k,weeks:offCount[k],display:offDisplay[k],first:offFirst[k],tier:(k in tierMap)?tierMap[k]:9}))
    .sort((a,b)=>(a.tier-b.tier)||(a.first-b.first));   // FRESH-FIRST (U4), never count-descending
  return {n,weeksWithWaste,weeksZero,pricedSum,pricedCount,unpricedCount,estimated,newestLoggedDate,offenders};
}

function renderConsumption(){
  const agg=wasteAggregate();
  const header=`<div class="section-title"><h2>Waste history</h2><div class="sub">Your food waste across the weeks you've logged — money you could keep, and items worth buying less of.</div></div>`;
  if(agg.n===0) return header+renderWasteEmpty();
  if(agg.n===1) return header+renderWasteOneWeek(agg);
  if(agg.weeksWithWaste===0) return header+renderWasteAllClean(agg);   // ≥2 logged, ALL affirmative-zero: a genuine
    // zero — but NOT a $0/week hero (that celebrates the clean week → fake-clean reward, WATCH-BQ4/D7). Neutral words.
  return header+renderWasteRate(agg)+renderWasteOffenders(agg);   // A2: hook (rate) then co-equal payoff (offenders)
}
// N=0 empty state (U6 / C4): centered faint 40px/.3 glyph + h2 + one --fg3
// sub, FORWARD-framed, NO rendered zero, NO warning hue, NO capture CTA. The "door back to
// the loop" (C4) is a text-weight nav link (data-nav idiom, keyboard-accessible) — NOT a
// filled/primary button, so it is a route back, not the capture nag U6 forbids.
function renderWasteEmpty(){
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46vh;text-align:center">
    <div style="font-size:40px;margin-bottom:16px;opacity:.3">📊</div>
    <div class="section-title"><h2>Your waste history will appear here</h2>
      <div class="sub">As you close out each week and log what you tossed, this page shows the money you could keep, and the items worth buying less of.</div></div>
    <div style="margin-top:8px"><button data-nav="dashboard" style="background:none;border:none;color:var(--fg3);text-decoration:underline;cursor:pointer;font-size:12px;font-family:var(--font);min-height:44px;padding:4px">Back to this week's plan</button></div>
  </div>`;
}
// N=1 single-week state (D1-floor-3 / C4): show the one week honestly,
// labeled as ONE week — NEVER a "rate"/"average"/"per week". Calm, un-editorialized, no
// trend-dressing; forward-point via the VIEW's behavior, never a household demand.
function renderWasteOneWeek(agg){
  let body;
  if(agg.weeksWithWaste===0){
    body=`You marked nothing wasted the one week you've logged so far.`;
  }else if(agg.pricedCount===0){
    const cnt=agg.unpricedCount;
    body=`In the one week you've logged, you tossed a few things we couldn't price${cnt>0?` (${cnt} item${cnt===1?'':'s'} with no price)`:''}.`;
  }else{
    const whole=Math.round(agg.pricedSum);
    const amt=whole<1?'under $1':'about $'+whole;
    const estWord=agg.estimated?' (partly estimated)':'';
    const unp=agg.unpricedCount>0?`, plus ${agg.unpricedCount} we couldn't price`:'';
    body=`In the one week you've logged, you tossed ${amt}${estWord}${unp}.`;
  }
  return `<div class="card">
    <div style="font-size:13px;color:var(--fg2);line-height:1.6">${body}</div>
    <div style="font-size:11px;color:var(--fg3);margin-top:8px">Once you've logged another week, this page shows your weekly amount and the items worth buying less of.</div>
  </div>`;
}
// N≥2, every logged week an affirmative-zero (D2-ii / D7 / WATCH-BQ4): acknowledge
// NEUTRALLY — never a celebratory $0 hero (that rewards the clean tap → the fake-clean incentive),
// never "perfect"/"zero-waste weeks". No rendered figure at all; calm words + a forward pointer.
function renderWasteAllClean(agg){
  return `<div class="card">
    <div style="font-size:13px;color:var(--fg2);line-height:1.6">You marked nothing wasted across the ${agg.n} weeks you logged.</div>
    <div style="font-size:11px;color:var(--fg3);margin-top:8px">When a week does have something you tossed, your weekly amount and the items worth buying less of show up here.</div>
  </div>`;
}
// The money HOOK (A2 / U1/U2): the per-logged-week absolute-$ RATE as a
// 22px/700 color:var(--fg) figure — the money-hero SCALE with the hue NEUTRALIZED (never
// --blue/--green/--amber/--red; presence via size, neutrality via hue). `/week` is welded to
// the figure (min readable token, U2). N rides as PROVENANCE (13/400 --fg2), an absolute
// basis-count, NEVER a calendar fraction (C3). Rate is priced-only → within-window
// lower bound; unpriced surfaced as a count (D4); `(est.)` rides + figure stays COARSE (D5).
function renderWasteRate(agg){
  const rate=agg.n>0?(agg.pricedSum/agg.n):0;
  const whole=Math.round(rate);
  let figureNum,unit;
  if(agg.pricedCount===0){ figureNum='$—'; unit=''; }              // no priced dollars → honest unknown, never $0 (U5)
  else{
    figureNum=whole<1?'under $1':'$'+whole;                              // coarse whole-$ (D5); never a false $0 for real priced waste
    unit='<span style="font-size:15px;font-weight:700;color:var(--fg)">/week</span>';
  }
  const est=(agg.estimated&&agg.pricedCount>0)?'<span style="font-size:11px;font-weight:400;color:var(--fg);opacity:.85"> (est.)</span>':'';
  const figure=`<span style="font-size:22px;font-weight:700;color:var(--fg)">${figureNum}</span>${unit}${est}`;
  let prov=`across the ${agg.n} weeks you logged`;                       // absolute basis-count, never a calendar fraction (C3)
  if(agg.weeksZero>0) prov+=` · ${agg.weeksWithWaste} with waste, ${agg.weeksZero} you marked nothing wasted`;   // D2 decomposition; neutral naming
  const wk=wasteWeeksAgo(agg.newestLoggedDate);
  const recency=(wk!=null&&wk>=3)?` · most recent: ${wk} weeks ago`:'';  // disclose staleness (D1-floor-5)
  const unp=(agg.unpricedCount>0)?` · + ${agg.unpricedCount} we couldn't price`:'';   // unpriced = events, never dollars (D4)
  const estWord=(agg.estimated&&agg.pricedCount>0)?', partly estimated':'';
  return `<div class="card">
    <div style="font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Money you could keep</div>
    <div style="display:flex;align-items:baseline;gap:5px;flex-wrap:wrap">${figure}</div>
    <div style="font-size:13px;font-weight:400;color:var(--fg2);margin-top:4px;line-height:1.5">${prov}${recency}${unp}${estWord}</div>
  </div>`;
}
// The co-equal PAYOFF (A2 / U4 / C5): repeat-offender items as an
// AGENCY-framed inventory, NOT a scoreboard. Weight on the item NAME (13px --fg); the
// occurrence is a quiet ≤11px --fg3 TRAILING clause, never a right-aligned/bold/colored
// numeral, never a verified exact count; FRESH-FIRST order (already sorted), unranked; a
// small handful, not exhaustive; no valence hue on any row. Its own first-class card —
// never nested under the figure (C2).
function renderWasteOffenders(agg){
  if(!agg.offenders.length) return '';
  const rows=agg.offenders.slice(0,5).map(o=>{
    const clause=o.weeks>=3?'in several of your logged weeks':'in more than one of your logged weeks';   // coarse band, never a verified exact count (D3/C5)
    return `<div style="display:flex;align-items:baseline;gap:8px;padding:5px 0;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--fg)">${esc(o.display)}</span>
      <span style="font-size:11px;color:var(--fg3)">· ${clause}</span>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="section-title" style="margin-bottom:10px"><h2 style="font-size:14px">Worth buying less of</h2><div class="sub">These turned up in your waste more than once — buying a little less could help.</div></div>
    ${rows}
  </div>`;
}

// Non-cook night classifier — leftovers first (common case), then eat-out, else neutral catch-all.
// Never returns null: every non-cook night gets a glanceable category pill instead of a broken metadata line.
function noCookPill(name){
  const s=(name||'').toLowerCase();
  if(/leftover/.test(s)) return {text:'Leftovers',glyph:'↻'};
  if(/eat[\s-]?out|take[\s-]?out|takeaway|restaurant|dine|dining|order (in|out)|delivery|pizza night/.test(s)) return {text:'Eat out',glyph:'↗'};
  return {text:'No cook',glyph:'○'};
}
// REVIEW-B1 + KEY-Q1 COHERENCE GUARD.
// `protein_state` is a MODEL-SUPPLIED label with no validation anywhere in the app. v11 originally
// suppressed the red ⚠ no-date warning on `protein_state==='purchased_frozen'` ALONE — so a SINGLE
// model field-write disarmed the safety net at ANY tier, including a raw chicken at Tier 0 with both
// dates null: v10 WARNED, v11 went SILENT and printed an amber reassurance over it. That is a
// safety net whose off-switch is held by the entity it guards against.
// A purchased-frozen row is only BELIEVED when the model's two assertions CORROBORATE: the label
// AND the tier. An incoherent row (purchased_frozen at Tier 0/1) is a confused model, and the
// household gets the warning — exactly as it did in v10. Monotonicity is now a property of the
// CODE, not a property of the corpus.
function pfCoherent(x){ return !!x && x.protein_state==='purchased_frozen' && x.shelf_life_tier===3; }

// 🔴 RE-GATE / REVIEW-#4 — THE THAW LADDER, AT THE RENDER LAYER.
// My first thaw chip used a FLAT `day+1` lead. No weight. No ladder. Below 4 lb that is correct,
// so all five real runs greened — and heavy-bird is N=0 in the corpus (heaviest pack 3.00 lb), so
// nothing could discriminate it. THE SESSION HELD THAT N=0 SCRUPULOUSLY FOR THE LADDER AND THEN
// BUILT A CHIP ON TOP OF THE LADDER WITHOUT CARRYING IT ACROSS. Driven with a 12 lb turkey on a
// day-6 dinner, the chip fired on day 5 — TWO DAYS LATE — in weight-600 amber, leading the card,
// OUTRANKING AND CONTRADICTING the app's own correct day-3 prose note. A household follows the
// loud thing, finds a solid bird at 5pm, and reaches for the hot tap. That is verbatim the failure
// the ladder exists to prevent, reintroduced by the chip added to prevent it.
// THE TEMPLATE'S OWN RULE: one full day in the refrigerator per 4 lb, rounded up, floor of 1 —
// "a 12 lb frozen turkey comes out THREE DAYS before it and a 16 lb bird FOUR."
function parseWeightLb(q){
  const s=String(q==null?'':q);
  let m=/(\d+(?:\.\d+)?)\s*(?:-|to)\s*(\d+(?:\.\d+)?)\s*(?:lbs?|pounds?)\b/i.exec(s);
  if(m) return Math.max(parseFloat(m[1]),parseFloat(m[2]));   // a range: assume the HEAVY end (longer thaw = safe side)
  m=/(\d+(?:\.\d+)?)\s*(?:lbs?|pounds?)\b/i.exec(s);
  if(m) return parseFloat(m[1]);
  m=/(\d+(?:\.\d+)?)\s*(?:oz|ozs|ounces?)\b/i.exec(s);
  if(m) return parseFloat(m[1])/16;
  return null;                                                 // UNPARSEABLE — and that is NOT "1 day".
}
function thawDaysFor(lb){ return Math.max(1,Math.ceil(lb/4)); }
// The come-out night for a coherent purchased-frozen item, or null if we must NOT assert one.
// FAIL SAFE: with no parseable weight the thaw is UNDECIDABLE, so we render NO imperative and let
// the model's prose note stand. A confident wrong imperative is worse than no imperative — that is
// the entire lesson of the turkey, and the fallback must not quietly re-guess `day+1`.
function comeOutDay(x,dinnerDay){
  const lb=parseWeightLb(x&&x.quantity);
  if(lb==null) return null;
  const d=dinnerDay-thawDaysFor(lb);
  return d>=1?d:null;                                          // no room to thaw ⇒ V16b's problem, not a chip's
}

// 🔴 V16b. THE HOME-FROZEN THAW GAP.
// The come-out chip was gated on pfCoherent() alone — purchased_frozen AND tier 3. A protein the
// household FROZE THEMSELVES is protein_state 'fresh' with freeze_by set, and is therefore excluded
// BY CONSTRUCTION. Driven through the real render path against the five real blind runs: 5 home-frozen
// raw proteins, 0 thaw chips, in 4 of 5 runs — on the app's OWN shipped DEFAULT_PANTRY chicken, on the
// first plan a new household ever generates. N=5 OBSERVED, not mutated.
//   THE APP TOLD THEM TO TAKE THE FISH OUT AND NEVER TOLD THEM TO TAKE THE CHICKEN OUT. SAME FREEZER.
// And it was worse than silence: on the PLATE day the app fired "thaw it in the refrigerator" over a
// frozen brick with dinner scheduled that night — a fridge thaw the app's own ladder prices at a full
// day. The only two ways to obey it by dinner are the counter and hot water: the exact two acts
// V26c-counter exists to prohibit. A confident wrong imperative is worse than no imperative.
//
// 🔴 THE GUARD, AND WHY THE ONE-LINE FIX IS NOT ENOUGH.
// The proposed fix was `if(!pfCoherent(x) && !x.freeze_by) continue;` — one predicate, no guard.
// A home-frozen item is only IN the freezer from its freeze day ONWARD. With no guard, any item whose
// comeOutDay lands ON or BEFORE its freeze_by fires "🧊 TAKE IT OUT TONIGHT" on — or before — the very
// day the shopping note says "freeze it today." Reachable on any home-frozen protein eaten the day
// after the freeze, and on any heavy pack whose ladder reaches back past the freeze day. That is a NEW
// confident wrong imperative: the turkey defect, re-introduced by the fix for the turkey defect.
// FAIL SAFE: if we cannot prove the item is already in the freezer on this day, we render NO imperative.
const ISO_DATE=/^\d{4}-\d{2}-\d{2}$/;
// True only when `cardDate` is strictly AFTER the day the item was told to go into the freezer.
// Unparseable/absent dates are UNDECIDABLE ⇒ false ⇒ no chip. ISO-8601 dates compare correctly as strings.
function inFreezerOn(x,cardDate){
  const fb=String((x&&x.freeze_by)||''), cd=String(cardDate||'');
  if(!ISO_DATE.test(fb)||!ISO_DATE.test(cd)) return false;
  return cd>fb;
}

// 🔴 THE `[0]` BUG. Review #6 forced R3m ("the chip must name EVERY item due out
// tonight — not just the first"). THAT FIX REACHED THE TAKEOUT CHIP AND NOTHING ELSE: cbs[0], fbs[0],
// pf[0] and — inside the RED SAFETY CHANNEL — un[0] each still rendered only the first item.
// Two undated raw proteins on one dinner ⇒ the red names the chicken and SILENTLY DROPS the ground
// beef. The household freezes the chicken, believes the job is done, and the beef sits for seven days.
// That is R3mn's own "false completeness" failure mode, living inside the one channel built to stop it.
//
// I AM OVERTURNING THE HARNESS'S OWN STATED REASONING FOR EXEMPTING THE RED CHIP. R3m's comment
// argued: "the ⚠ is an ALARM — the item name is an EXAMPLE; naming one STILL FIRES IT ⇒ safe."
// That is wrong, because the red chip's TAIL IS AN INSTRUCTION — "cook it within 2 days of shopping,
// or freeze it the day you buy it" — and an instruction that names one of two items is wrong by
// omission. A false ALARM is acceptable; a false INSTRUCTION never is. This chip carries both, so it
// is bound by the stricter rule.
const andList=(a)=>a.join(' and the ');
// Item→date lines that NEVER attribute a date to an item that does not carry it. Collapses to a single
// date only when every item genuinely shares it; otherwise each item keeps its own.
function cookByText(p){
  const ds=[...new Set(p.map(x=>x.d))];
  if(ds.length===1) return `cook the ${andList(p.map(x=>x.i))} by ${ds[0]}`;
  return 'cook '+p.map(x=>`the ${x.i} by ${x.d}`).join(', ');
}
// PARTICIPIAL, not finite: "the chicken thighs — MEANT TO GO in the freezer on DATE", never "…WAS meant".
// Grammatical number cannot be inferred from a food name, and the entry count is not the noun count, so any
// finite verb here ("was"/"were") is a coin-flip on every card. The participle is invariant, it keeps the design's
// load-bearing "meant to go in the freezer on" wording verbatim (it states the PLAN, never an OBSERVATION —
// the property R5 exists to hold), and it cannot disagree with its subject.
function freezeText(p){
  const ds=[...new Set(p.map(x=>x.d))];
  if(ds.length===1) return `the ${andList(p.map(x=>x.i))} — meant to go in the freezer on ${ds[0]}`;
  return p.map((x,i)=>`the ${x.i}${i===0?' — meant to go in the freezer on ':' on '}${x.d}`).join(', ');
}
function renderMealCards(mp){
  return `<div class="grid grid-3" style="margin-bottom:24px">${mp.map(day=>{
    const d=day.dinner||{};
    // Non-cook night = placeholder dinner shape: no ingredients, no cost, no source.
    const isNoCook=(!d.ingredients||d.ingredients.length===0)&&d.cost_per_serving==null&&d.source_site==null&&d.source_url==null;
    let dinnerBlock;
    if(isNoCook){
      // Non-cook: title in --fg (blue is reserved for real recipe links), category pill replaces the metadata line.
      const p=noCookPill(d.name);
      dinnerBlock=`<div style="font-weight:600;color:var(--fg);font-size:12px">${esc(d.name)}</div>
        <div style="margin-top:2px"><span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;padding:2px 8px;border-radius:10px;background:#94a3b81a;color:var(--fg2)">${p.glyph} ${esc(p.text)}</span></div>`;
    }else{
      // Cook night: unchanged — blue recipe link (if URL) + source · cost · servings metadata line.
      const su=safeUrl(d.source_url);
      const link=su?`<a href="${esc(su)}" target="_blank" rel="noopener">${esc(d.name)} ↗</a>`:esc(d.name);
      dinnerBlock=`<div style="font-weight:600;color:var(--blue);font-size:12px">${link}</div>
        <div style="font-size:10px;color:var(--fg3);margin-top:2px">${esc(d.source_site)} · $${n2(d.cost_per_serving)}/serving · ${d.servings} servings</div>`;
    }
    return `<div class="card" style="padding:14px">
      <div class="flex justify-between" style="margin-bottom:8px"><span style="font-weight:700;color:#f1f5f9">Day ${day.day}</span><span style="font-size:11px;color:var(--fg3)">${esc(day.date)}</span></div>
      <div style="font-size:11px;color:var(--fg2);margin-bottom:3px"><span style="color:var(--fg3)">B:</span> ${esc(day.breakfast)}</div>
      <div style="font-size:11px;color:var(--fg2);margin-bottom:6px"><span style="color:var(--fg3)">L:</span> ${esc(day.lunch)}</div>
      <div style="border-top:1px solid var(--border);padding-top:6px">
        ${dinnerBlock}
        ${/* DESIGN-L4. THE THAW-DAY CHIP. Across all 35 day-cards of the five live runs, ZERO chips
              rendered on a thaw day: the one day the household must physically DO something was a
              PROSE-ONLY surface — the imperative buried at sentence 1-2 of a 400-970 char 10px amber
              paragraph. The 🧊 chips fired only on the EATING day, where "keep it frozen until its
              thaw day, then thaw" describes two actions already in the past. This chip is DERIVED
              (no new model field): if TOMORROW's dinner carries a coherent purchased-frozen protein,
              tonight is the come-out night. It leads the card and it is weight-600, because it is
              the only thing on this card that is an ACTION and not a NARRATION. */''}
        ${(()=>{const due=[],hf=[];for(const z of mp){if(!z||z.day<=day.day)continue;for(const x of (((z.dinner&&z.dinner.ingredients)||[]))){if(!x)continue;const isPF=pfCoherent(x);const isHF=!isPF&&!!x.freeze_by;if(!isPF&&!isHF)continue;if(comeOutDay(x,z.day)!==day.day)continue;if(isHF&&!inFreezerOn(x,day.date))continue;(isPF?due:hf).push(x.item);}}if(!due.length&&!hf.length)return'';
          /* A PURCHASED-frozen pack's freezer state is a property of the PRODUCT — the app may assert it.
             A HOME-frozen one is a HOUSEHOLD ACT the app only ever INSTRUCTED, and THE APP CANNOT SEE THE
             FREEZER (IQ-0256). So the home-frozen items — and ONLY those — carry a conditional qualifier.
             NO PRONOUN, AND NO PARENTHETICAL. Grammatical number CANNOT be inferred from a food name:
             "chicken thighs" is plural, "ground beef" is a mass noun, and the count of ARRAY ENTRIES is not
             the count of the NOUN — my first draft emitted "if the chicken thighs went in the freezer, move
             IT". A parenthetical qualifier was no better: the model's own item names already END in one
             ("chicken thighs (frozen on the shopping day)"), so it rendered a double-paren. The qualifier is
             therefore a comma-clause on the noun phrase — correct for one item or many, count or mass — and
             the PF-only string stays BYTE-IDENTICAL to the copy R3m/R3u/R3h already gate. */
          const obj = (due.length&&hf.length) ? `the ${esc(andList(due))}, and the ${esc(andList(hf))} if frozen as planned,`
                    : due.length              ? `the ${esc(andList(due))}`
                    :                           `the ${esc(andList(hf))}, if frozen as planned,`;
          return `<div style="font-size:11px;font-weight:600;color:var(--amber);margin-top:3px">🧊 TAKE IT OUT TONIGHT — move ${obj} to the REFRIGERATOR to thaw. Never on the counter, never in hot water.</div>`;})()}
        ${d.perishability_note?`<div style="font-size:10px;color:var(--amber);margin-top:3px">⏱ ${esc(d.perishability_note)}</div>`:''}
        ${/* 🔴 P1. WAS 10px `--fg3` = 3.71:1 (I recomputed it: #64748b on #161822), BELOW the
              4.5:1 WCAG 2.1 AA 1.4.3 floor. This chip carries the FRESH-protein pathogen deadline — 11 raw
              rows across the five real runs, against the frozen fish's 5 — and it was rendered MORE FAINTLY
              THAN THE PROSE THAT DESCRIBES IT (amber, 10.59:1), and in the SAME 10px `--fg3` as the price
              line beside it. The deadline for raw chicken and the cost-per-serving were the same colour and
              the same size. It is the IDENTICAL defect a reviewer found in the shopping list, which S33 fixed
              there (`.shop-note` → 11px `--fg2`, 6.89:1) AND LEFT STANDING HERE — the fix went to the aisle
              and not to the kitchen. Now 11px `--fg2` = 6.89:1 (recomputed): clears AA and AAA.
              And it named NO ITEM AT ALL: one card in run A carries THREE items with a cook_by and rendered
              a single bare date. It now names every item it speaks for. */''}
        ${(()=>{const cbs=(d.ingredients||[]).filter(x=>x&&x.cook_by).map(x=>({i:x.item,d:x.cook_by})).sort((a,b)=>String(a.d)<String(b.d)?-1:String(a.d)>String(b.d)?1:0);return cbs.length?`<div style="font-size:11px;color:var(--fg2);margin-top:3px">🍳 ${esc(cookByText(cbs))}</div>`:'';})()}
        ${/* 🔴 RE-GATE / DESIGN-L3(a), RULED BLOCKING. THE APP MUST NOT ASSERT A PHYSICAL
              EVENT IT CANNOT OBSERVE. This chip previously read "🧊 from freezer (frozen 2026-07-13)"
              — stating a past event as ACCOMPLISHED FACT, WITH A DATE — derived from nothing but a
              PLAN-TIME INSTRUCTION. `freeze_by` is what the model TOLD the household to do on shopping
              day; the app has no evidence they did it. And `freeze_by` simultaneously suppresses the red
              no-date gate — so a plan whose freeze instruction never landed BOTH silences the alarm AND
              prints a confirmation, to exactly the household that erred. DESIGN NOTE: "they didn't open the app
              to check their memory; they opened it because it IS their memory."
              Copy below is the design's own wording, verbatim from the L3 fix option (a). */''}
        ${/* 🔴 THE UN-OBEYABLE IMPERATIVE IS REMOVED FROM THE PLATE DAY.
              This chip fires on the day the item is EATEN, and it used to say "If it did — thaw it in the
              refrigerator, never on the counter." A refrigerator thaw costs a full day by the app's own
              ladder (thawDaysFor(3)=1). Issued at 5pm over a frozen brick with dinner scheduled TONIGHT, the
              only two ways to comply by dinner are the counter and hot water — THE EXACT TWO ACTS THE SAME
              SENTENCE PROHIBITS. The app handed the household an instruction it was too late to obey, and the
              compliant response to it was the hazard.
              The thaw imperative now lives on the COME-OUT day (the chip above), where it CAN be obeyed. What
              remains here is what this chip is actually for: a retrospective audit + the do-not-cook, in the design's
              L3(a) register — it states the PLAN, never an OBSERVATION, because THE APP CANNOT SEE THE FREEZER.
              🔴 KNOWN GAP, NAMED NOT BURIED: a household that froze the item but MISSED the come-out chip
              still has a frozen brick at 5pm, and this chip now gives them a PROHIBITION with no alternative.
              The safe same-day options (cold-water thaw, cook-from-frozen) are FOOD-SAFETY DOCTRINE — the
              authority, not mine — and I will not invent a kill step on a surface the operator's household
              eats from. Flagged for food-safety + review. Removing a false instruction is strictly safer than
              keeping it; filling the hole it leaves requires an authority I do not have. */''}
        ${(()=>{const fbs=(d.ingredients||[]).filter(x=>x&&x.freeze_by).map(x=>({i:x.item,d:x.freeze_by})).sort((a,b)=>String(a.d)<String(b.d)?-1:String(a.d)>String(b.d)?1:0);if(!fbs.length)return'';const pl=fbs.length>1,subj=pl?'they':'it',obj=pl?'them':'it',is=pl?'are':'is';return `<div style="font-size:11px;font-weight:600;color:var(--amber);margin-top:3px">🧊 ${esc(freezeText(fbs))}. If ${subj} never went in the freezer and sat out, do not cook ${obj}. If ${subj} did and ${is} still frozen at dinner, thaw ${obj} fast in COLD water — sealed in a leak-proof bag, fully submerged, with fresh cold water every 30 minutes (about 30 minutes per pound) — then cook ${obj} right away, and don't refreeze ${obj} uncooked. Never thaw on the counter or in warm or hot water.</div>`;})()}
        ${(()=>{const pf=(d.ingredients||[]).filter(pfCoherent).map(x=>x.item);const pl=pf.length>1;return pf.length?`<div style="font-size:10px;color:var(--amber);margin-top:3px">🧊 bought frozen (${esc(pf.join(', '))}) — keep ${pl?'them':'it'} frozen until ${pl?'their':'its'} thaw day, then thaw in the refrigerator, never on the counter. Once thawed ${pl?'they keep':'it keeps'} 1–2 days.</div>`:'';})()}
        ${(()=>{const un=(d.ingredients||[]).filter(x=>x&&!x.cook_by&&!x.freeze_by&&!pfCoherent(x)&&(x.protein_state==='fresh'||x.shelf_life_tier===0||x.shelf_life_tier===1)).map(x=>x.item);const pl=un.length>1;return un.length?`<div style="font-size:10px;color:var(--red);margin-top:3px">⚠ no cook-by or freeze-by date on ${pl?'highly perishable items':'a highly perishable item'} (${esc(un.join(', '))}) — cook ${pl?'them':'it'} within 2 days of shopping, or freeze ${pl?'them':'it'} the day you buy ${pl?'them':'it'}</div>`:'';})()}
        ${d.quality_note?`<div style="font-size:10px;color:#a78bfa;margin-top:3px">★ ${esc(d.quality_note)}</div>`:''}
      </div></div>`}).join('')}</div>`;
}

    ${items.map(item=>{
      const ci=CATEGORY_LABELS[item.category]||CATEGORY_LABELS.staple;
      const chk=S.checkedItems[item._gi];

        <span class="shop-price" style="font-size:11px;color:${item.price_type==='confirmed'?'var(--green)':'var(--amber)'};min-width:60px;text-align:right">$${n2(item.price)}${item.price_type==='estimated'?'<span style="font-size:9px;opacity:.8"> (est.)</span>':''}</span>
        <button class="rm-btn" onclick="event.stopPropagation();removeShoppingItem(${item._gi})" title="Remove item">×</button>

    }
    h+=`</div>`;
  }
  return h;
}

// ─── Pantry ─────────────────────────────────────────────────────────────────
// Shared numeric-disclosure row for all three tiers. Collapsed = quiet chip; open = amount inputs.
// blank ⇒ delete key ⇒ absent (never 0). tier2 emits stopPropagation so editing a number can't flip `have`.
function pantryNumRow(tier,i){
  if(tier==='tier2' && !i.have) return '';                       // amount only meaningful when 'have'
  const hasNum=(typeof i.onHand==='number')||(tier==='tier1'&&typeof i.par==='number');
  const open=hasNum||S.pantryNumOpen[i.id];
  const stop=tier==='tier2'?'event.stopPropagation();':'';        // tier2 card is click-to-toggle
  if(!open){
    const label=tier==='tier3'?'+ exact amount':'+ amount';
    return `<div style="margin-top:6px" ${tier==='tier2'?'onclick="event.stopPropagation()"':''}>`
      +`<button onclick="${stop}togglePantryNum('${i.id}')" style="background:transparent;border:none;`
      +`color:var(--fg4);font-size:10px;cursor:pointer;padding:2px 0;min-height:28px;font-family:var(--font)">${label}</button></div>`;
  }
  const numField=(field,val,lab,tip)=>`<div style="display:flex;flex-direction:column;gap:2px">`
    +`<label title="${tip||''}" style="font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:.4px">${lab}</label>`
    +`<input class="inp" inputmode="decimal" aria-label="${lab}" value="${typeof val==='number'?val:''}" placeholder="—" `
    +`style="width:72px" oninput="updatePantryNum('${tier}','${i.id}','${field}',this.value)"></div>`;
  let fields=numField('onHand',i.onHand,'on hand','');
  if(tier==='tier1') fields+=numField('par',i.par,'par','minimum to keep stocked');
  fields+=`<div style="display:flex;flex-direction:column;gap:2px">`
    +`<label style="font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:.4px">unit</label>`
    +`<input class="inp" list="wf-units" aria-label="unit" value="${esc(i.unit||'')}" placeholder="unit" `
    +`style="width:92px" oninput="updatePantryUnit('${tier}','${i.id}',this.value)"></div>`;
  // collapse control only while open-but-empty; once data exists the row stays put (never hide live data)
  const collapse=!hasNum?`<button onclick="${stop}togglePantryNum('${i.id}')" style="background:transparent;`
    +`border:none;color:var(--fg4);font-size:10px;cursor:pointer;align-self:flex-end;min-height:28px;`
    +`padding:2px 4px;font-family:var(--font)">hide</button>`:'';
  return `<div class="flex flex-wrap gap-8" ${tier==='tier2'?'onclick="event.stopPropagation()"':''} `
    +`style="margin-top:6px;align-items:flex-end">${fields}${collapse}</div>`;
}
function renderPantry(){
  const p=S.pantry,tab=S.pantryTab;
  const counts={tier1:p.tier1.length,tier2:p.tier2.length,tier3:p.tier3.length};
  let h=`<div class="section-title"><h2>Pantry Inventory</h2><div class="sub">Manage your kitchen inventory across three tracking tiers</div></div>`;
  h+=`<div class="flex gap-4" style="margin-bottom:16px;overflow-x:auto">${['tier1','tier2','tier3'].map(t=>`<button class="btn ${tab===t?'btn-primary':'btn-default'}" onclick="S.pantryTab='${t}';render()" style="width:auto;white-space:nowrap;font-size:12px;min-height:36px">Tier ${t[4]} (${counts[t]})</button>`).join('')}</div>`;
  // Shared unit suggestions for every numeric-row unit input (native datalist — degrades to free-text).
  h+=`<datalist id="wf-units"><option value="lb"><option value="oz"><option value="count"><option value="each"><option value="bottle"><option value="jar"><option value="can"><option value="box"><option value="bag"><option value="gallon"><option value="quart"><option value="cup"><option value="dozen"><option value="bunch"><option value="loaf"><option value="block"><option value="container"><option value="pack"></datalist>`;
  h+=`<div class="card flex gap-8 items-center flex-wrap"><input class="inp" id="pantry-name" placeholder="Item name" style="flex:2;min-width:140px"><input class="inp" id="pantry-cat" placeholder="Category (optional)" style="flex:1;min-width:100px"><button class="btn btn-primary" onclick="addPantryItem()" style="width:auto">Add</button></div>`;
  // Per-tier "amounts are optional" helper line — once, under the add-item card, reinforces blank-is-absent.
  const helper={tier1:'Amounts are optional — leave a field blank to plan by status alone.',tier2:'Amounts are optional — leave a field blank to plan by have / need alone.',tier3:'Amounts are optional — leave a field blank to plan by the rough note alone.'};
  h+=`<div style="font-size:10px;color:var(--fg3);margin:2px 0 12px">${helper[tab]}</div>`;
  if(tab==='tier1'){
    h+=`<div class="grid grid-2">${p.tier1.map(i=>`<div class="card" style="padding:10px 14px"><div class="flex items-center gap-10"><div style="flex:1"><div style="font-weight:600;font-size:12px">${esc(i.name)}</div><div style="font-size:10px;color:var(--fg3)">${esc(i.category)}</div></div><button class="status-badge" style="background:${STATUS_COLORS[i.status]}22;color:${STATUS_COLORS[i.status]}" onclick="cycleStatus('${i.id}')">${i.status}</button><button class="rm-btn" onclick="removePantryItem('tier1','${i.id}')">×</button></div>${pantryNumRow('tier1',i)}</div>`).join('')}</div>`;
  }else if(tab==='tier2'){
    h+=`<div class="grid grid-2">${p.tier2.map(i=>`<div class="card" style="padding:10px 14px;cursor:pointer" onclick="toggleTier2('${i.id}')"><div class="flex items-center gap-10"><input type="checkbox" ${i.have?'checked':''} style="accent-color:var(--blue);width:18px;height:18px;pointer-events:none"><div style="flex:1"><div style="font-weight:600;font-size:12px;opacity:${i.have?1:.6}">${esc(i.name)}</div><div style="font-size:10px;color:var(--fg3)">${esc(i.category)}</div></div><span style="font-size:10px;color:${i.have?'var(--green)':'var(--fg3)'}">${i.have?'have':'need'}</span><button class="rm-btn" onclick="event.stopPropagation();removePantryItem('tier2','${i.id}')">×</button></div>${pantryNumRow('tier2',i)}</div>`).join('')}</div>`;
  }else{
    h+=p.tier3.map(i=>{
      const authoritative=typeof i.onHand==='number';
      return `<div class="card" style="padding:10px 14px">
    <div class="flex items-center gap-12 flex-wrap">
      <div style="flex:1;min-width:120px">
        <div style="font-weight:600;font-size:12px">${esc(i.name)}${authoritative?' <span style="font-size:9px;color:var(--green);border:1px solid var(--green);border-radius:8px;padding:1px 6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.4px">exact</span>':''}</div>
        <div style="font-size:10px;color:var(--fg3)">${esc(i.category)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;${authoritative?'opacity:.6':''}">
        ${authoritative?'<label style="font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:.4px">note</label>':''}
        <input class="inp" value="${esc(i.quantity)}" placeholder="${authoritative?'estimate note':'e.g., about 2 lbs'}" style="width:180px;max-width:100%" oninput="updateTier3Qty('${i.id}',this.value)">
      </div>
      <button class="rm-btn" onclick="removePantryItem('tier3','${i.id}')">×</button>
    </div>
    ${pantryNumRow('tier3',i)}
    ${authoritative?'<div style="font-size:9px;color:var(--fg3);margin-top:3px">Exact amount is used for the shopping list; the note is just a reminder.</div>':''}
  </div>`;
    }).join('');
  }
  return h;
}

// ─── Weekly Review ──────────────────────────────────────────────────────────
function renderReview(){
  const step=S.reviewStep,p=S.pantry;
  let h=`<div class="section-title"><h2>Weekly Review</h2><div class="sub">Update your pantry state before generating this week's prompt — about 2 minutes of your active time. (Claude then runs its own web searches to build the plan, which takes several minutes; your hands-on part is just this pantry update and pasting the reply back.)</div></div>`;
  h+=`<div class="progress">${[0,1,2].map(i=>`<div class="bar ${i<=step?'active':''}"></div>`).join('')}</div>`;
  h+=`<div class="card">`;
  if(step===0){
    h+=`<div style="font-weight:700;font-size:14px;color:#f1f5f9;margin-bottom:4px">Step 1: Bulk Items (Tier 3)</div><div style="font-size:11px;color:var(--fg3);margin-bottom:14px">How much do you have left of each bulk item?</div>`;
    if(!p.tier3.length) h+=`<div style="color:var(--fg3);padding:20px">No bulk items tracked.</div>`;
    else h+=p.tier3.map(i=>`<div class="card flex items-center gap-12 flex-wrap"><div style="min-width:130px"><div style="font-weight:600;font-size:12px">${esc(i.name)}</div><div style="font-size:10px;color:var(--fg3)">was: ${esc(i.quantity||'?')}</div></div><div class="flex gap-4 flex-wrap">${['barely-touched','used-half','used-most','gone'].map(pr=>`<button class="btn btn-default" onclick="quickAdjust('${i.id}','${pr}')" style="width:auto;font-size:10px;padding:4px 8px;min-height:32px">${pr.replace('-',' ')}</button>`).join('')}</div><input class="inp" value="${esc(i.quantity)}" placeholder="Custom" style="width:150px;max-width:100%" oninput="updateTier3Qty('${i.id}',this.value)"></div>`).join('');
  }else if(step===1){
    h+=`<div style="font-weight:700;font-size:14px;color:#f1f5f9;margin-bottom:4px">Step 2: Staples Getting Low (Tier 1)</div><div style="font-size:11px;color:var(--fg3);margin-bottom:14px">Did you restock any of these?</div>`;
    const low=p.tier1.filter(i=>i.status==='getting-low'||i.status==='out');
    if(!low.length) h+=`<div style="color:var(--fg3)">All staples are well-stocked. Nothing to review here.</div>`;
    else h+=`<div class="grid grid-2">${low.map(i=>`<div class="card flex items-center gap-10"><div style="flex:1"><div style="font-weight:600;font-size:12px">${esc(i.name)}</div><div style="font-size:10px;color:${STATUS_COLORS[i.status]}">${i.status}</div></div><button class="btn btn-success" onclick="restockItem('${i.id}')" style="width:auto;font-size:10px">Restocked</button></div>`).join('')}</div>`;
  }else{
    h+=`<div style="font-weight:700;font-size:14px;color:#f1f5f9;margin-bottom:4px">Step 3: Weekly Items (Tier 2)</div><div style="font-size:11px;color:var(--fg3);margin-bottom:14px">Check off what you currently have.</div>`;
    h+=`<button class="btn btn-default" onclick="resetTier2()" style="margin-bottom:12px;font-size:10px;width:auto">Reset All to "Don't Have"</button>`;
    h+=`<div class="grid grid-2">${p.tier2.map(i=>`<div class="card flex items-center gap-10" style="padding:8px 14px;cursor:pointer" onclick="toggleTier2('${i.id}')"><input type="checkbox" ${i.have?'checked':''} style="accent-color:var(--blue);width:18px;height:18px;pointer-events:none"><span style="font-size:12px;color:${i.have?'var(--fg)':'var(--fg3)'}">${esc(i.name)}</span></div>`).join('')}</div>`;
  }
  h+=`</div>`;
  h+=`<div class="flex justify-between" style="margin-top:16px;flex-wrap:wrap;gap:8px"><button class="btn btn-default" ${step===0?'disabled':''} onclick="S.reviewStep--;render()" style="width:auto">← Previous</button>`;
  if(step<2) h+=`<button class="btn btn-primary" onclick="S.reviewStep++;render()" style="width:auto">Next →</button>`;
  else h+=`<button class="btn btn-success" onclick="S.reviewStep=0;showToast('Review complete!');nav('generate')" style="width:auto">Complete & Generate Prompt →</button>`;
  h+=`</div>`;
  return h;
}

// ─── Prompt Generator ───────────────────────────────────────────────────────
function serializePantry(){
  const p=S.pantry;
  const fmtQty=(n,u)=>`${(+n).toString()}${u?(' '+u):''}`; // "5 lb", "0.5 bottle", "6"
  const lines=[];

  // ── STAPLES (Tier-1): par-gated ──
  const t1=[];
  for(const i of p.tier1){
    if(typeof i.onHand==='number'){
      let s=`- ${i.name} — on hand: ${fmtQty(i.onHand,i.unit)}`;
      if(typeof i.par==='number') s+=`, par: ${fmtQty(i.par,i.unit)}`;
      s+=` [${i.status}]`;
      t1.push(s);
    } else {
      // qualitative fallback — no number known
      t1.push(`- ${i.name} — ${i.status} (quantity not tracked)`);
    }
  }
  if(t1.length){lines.push('STAPLES (always-stocked; buy only to restore par or when out):');lines.push(...t1);lines.push('');}

  // ── PROTEINS & FROZEN (Tier-3): consume within horizon ──
  const t3=[];
  for(const i of p.tier3){
    let s;
    if(typeof i.onHand==='number'){ s=`- ${i.name} — on hand: ${fmtQty(i.onHand,i.unit)}`; }
    else if(i.quantity){ s=`- ${i.name} — on hand: ${i.quantity} (estimate)`; }
    else { continue; } // nothing known -> omit
    if(i.openedAt){ s+=` [opened/aging — use or freeze first]`; }
    t3.push(s);
  }
  if(t3.length){lines.push('PROTEINS & FROZEN (rotating; plan to consume within the horizon):');lines.push(...t3);lines.push('');}

  // ── FRIDGE BASICS (Tier-2): binary have, with optional numbers ──
  const haveNum=[], havePlain=[], need=[];
  for(const i of p.tier2){
    if(i.have){
      if(typeof i.onHand==='number') haveNum.push(`- ${i.name} — on hand: ${fmtQty(i.onHand,i.unit)}${i.openedAt?' [opened — use first]':''}`);
      else havePlain.push(i.name);
    } else need.push(i.name);
  }
  if(haveNum.length||havePlain.length||need.length){
    lines.push('FRIDGE BASICS:');
    if(haveNum.length) lines.push(...haveNum);
    if(havePlain.length) lines.push(`- Have (quantity not tracked, assume adequate for the week unless a recipe needs a large amount): ${havePlain.join(', ')}`);
    if(need.length) lines.push(`- NOT on hand (buy if a recipe needs it): ${need.join(', ')}`);
  }

  const body=lines.join('\n').trim();
  return body||'No pantry items tracked.';
}

// E2-3 FEED-BACK serializer. Reads S.wasteLog + the resident
// S.planHistory window via the EXISTING E2-2 aggregate — no new projection, no write-path;
// promptTemplate is the ONLY new state. Returns the direction-safe recurring-waste OBSERVATION
// block, or '' when the inclusion floor is unmet (≥2 logged weeks AND ≥1 repeat offender);
// the slot then vanishes cleanly at the call site. A CONSIDERATION, never a quantitative command
// (NET-BIAS-UNDETERMINED). Consumes wasteAggregate().offenders (fresh-first, ≥2 distinct logged
// weeks) + .n; re-derives NOTHING (BQ-E23-REFOLD); reads NO dollar field (BQ-E23-NODOLLAR).
function wasteFeedbackBlock(){
  const n=wasteLoggedCount();
  const agg=wasteAggregate();
  if(n<2||!agg.offenders||agg.offenders.length===0) return '';
  const lines=agg.offenders.slice(0,5).map(o=>{
    // {display} inserted RAW (plain-text prompt, not HTML — no esc()); strip {{/}} as
    // defense-in-depth against a waste item literally named as a template token (BQ-E23-SLOTINJECT).
    const name=String(o&&o.display==null?'':o.display).replace(/\{\{|\}\}/g,'');
    return `- ${name}: recorded in the waste log in at least ${o.weeks} of the ${agg.n} weeks logged`;
  }).join('\n');
  return `RECURRING WASTE — ITEMS THIS HOUSEHOLD HAS LOGGED TOSSING BEFORE

In the weeks this household has recorded what they threw away, a few items have turned up in the waste log more than once:

${lines}

Treat this as a consideration, not an instruction. It is a record of what was logged, not a measurement of how much is actually wasted — a household logs some weeks and not others, so this list may over- or under-state the real pattern, and it says nothing about the weeks that were not logged. Weigh it against freshness, price, seasonality, variety, and whatever the household plans to cook this week.

Where an item above recurs, consider whether a smaller quantity, a different pack size, a longer-life substitute, or routing it across more meals would fit the week better. Do NOT simply cut these items, do NOT drop one the household clearly wants, and do NOT pass up a genuinely strong deal on one — running short is worse than a little surplus of a cheap perishable. If you do size an amount down because of this history, keep the change small and reversible and say so briefly in that item's note (for example: "1 bunch, not 2 — spinach has recurred in your waste log; buy more any week you'll use it"), so the household can override it.`;
}

function generatePrompt(){
  let prompt=S.promptTemplate;
  const r={'{{HOUSEHOLD_SIZE}}':String(S.household.size),'{{PLAN_DAYS}}':String(S.household.planDays||7),'{{START_DATE}}':S.startDate,'{{REGION}}':S.household.region||'Your city, ST','{{STARTER_ACTIVE}}':S.household.starterActive?'yes':'no','{{PANTRY_STATE}}':serializePantry(),'{{ALLERGIES}}':S.prefs.allergies.length?S.prefs.allergies.join(', '):'None','{{DISLIKES}}':S.prefs.dislikes.length?S.prefs.dislikes.join(', '):'None','{{PREFERENCES}}':S.prefs.positives.length?S.prefs.positives.join(', '):'None','{{STORES}}':storesList(S.household).join(', ')||'Store A, Store B, Store C','{{WALMART_BLOCK}}':hasWalmartStore(S.household)?'Walmart threshold: '+(WALMART_PROMPT[S.household.walmartThreshold]||WALMART_PROMPT['only-major'])+'.':'','{{SPECIAL_INSTRUCTIONS}}':S.specialInstructions.trim()||'None','{{ANCHOR_RECIPES}}':S.anchorRecipes.trim()||'None specified'};
  Object.entries(r).forEach(([k,v])=>{prompt=prompt.replaceAll(k,v)});
  // E2-3 — WASTE_FEEDBACK is whole-line, clean-vanish (NOT in r, so an empty value cannot leave a
  // stray blank line). Run LAST so an empty floor scrubs the slot + its trailing newline (leaving the
  // canonical two-blank section separator), and so a waste-item value cannot re-expand a {{...}} token
  // (BQ-E23-SLOTINJECT insert-last guard). Present → block + one trailing newline.
  const wf=wasteFeedbackBlock();
  prompt=prompt.replace(/\{\{WASTE_FEEDBACK\}\}\n?/, wf?wf+'\n':'');
  return prompt;
}

// EVENT BINDING & ACTIONS
// ═══════════════════════════════════════════════════════════════════════════
function bindEvents(){
  // Nav buttons (both sidebar and bottom)
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick=()=>{if(!btn.disabled)nav(btn.dataset.nav)};
  });
  // Shopping rows — whole-row tap toggles the item (checkbox is a pointer-events:none state
  // indicator; the ×'s event.stopPropagation suppresses this handler so it removes without toggling).
  // In-place mutation (no full render on toggle) preserves scroll position and keeps checked rows put.
  document.querySelectorAll('.shop-row[data-shoprow]').forEach(row=>{
    const toggle=()=>{
      const gi=row.dataset.shoprow;
      const now=!S.checkedItems[gi];
      S.checkedItems[gi]=now;
      saveCheckedItems();
      row.classList.toggle('checked',now);
      row.setAttribute('aria-checked',now?'true':'false'); // keep SR checked-state in sync
      const cb=row.querySelector('input[type=checkbox]');
      if(cb)cb.checked=now;
      updateShopCounter();
    };
    row.onclick=toggle;
    // Keyboard parity (role=checkbox): Enter/Space toggle. Guard e.target===row so a keypress on
    // the focused × button (which has its own native activation) is not hijacked by the row handler.
    row.onkeydown=e=>{
      if(e.target!==row)return;
      if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();toggle();}
    };
  });
  // "Why this plan" disclosure (role=button): Enter/Space toggle — keyboard parity with shop rows.
  const wph=document.getElementById('whyplan-header');
  if(wph)wph.onkeydown=e=>{if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();S.whyPlanOpen=!S.whyPlanOpen;render();}};
  // Enter keys for preference inputs
  ['new-allergy','new-dislike','new-pref','pantry-name'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.onkeydown=e=>{
      if(e.key==='Enter'){
        if(id==='new-allergy')startAddAllergy();
        else if(id==='new-dislike')addDislike();
        else if(id==='new-pref')addPositivePref();
        else if(id==='pantry-name')addPantryItem();
      }
    };
  });
}

// Pantry actions
function addPantryItem(){
  const nameEl=document.getElementById('pantry-name'),catEl=document.getElementById('pantry-cat');
  const name=nameEl?.value?.trim(),cat=catEl?.value?.trim()||'other';
  if(!name)return;
  const tier=S.pantryTab,id=tier.slice(0,2)+'-'+genId();
  if(tier==='tier1')S.pantry.tier1.push({id,name,category:cat,status:'well-stocked',updatedAt:new Date().toISOString()});
  else if(tier==='tier2')S.pantry.tier2.push({id,name,category:cat,have:false});
  else S.pantry.tier3.push({id,name,category:cat,quantity:'',updatedAt:new Date().toISOString()});
  savePantry();showToast('Added "'+name+'"');render();
}
function removePantryItem(tier,id){S.pantry[tier]=S.pantry[tier].filter(i=>i.id!==id);savePantry();render()}
function cycleStatus(id){
  S.pantry.tier1=S.pantry.tier1.map(i=>{if(i.id!==id)return i;const idx=STATUS_ORDER.indexOf(i.status);return{...i,status:STATUS_ORDER[(idx+1)%3],updatedAt:new Date().toISOString()}});
  savePantry();render();
}
function toggleTier2(id){
  S.pantry.tier2=S.pantry.tier2.map(i=>i.id===id?{...i,have:!i.have}:i);
  savePantry();render();
}
function updateTier3Qty(id,val){
  S.pantry.tier3=S.pantry.tier3.map(i=>i.id===id?{...i,quantity:val,updatedAt:new Date().toISOString()}:i);
  savePantry();
}

// Numeric on-hand / par. oninput → mutate in place → save, NO render (focus-safe).
// blank / non-finite / negative  ⇒  DELETE the field  ⇒  serializes as ABSENT, never 0.
function updatePantryNum(tier,id,field,value){        // field ∈ {'onHand','par'}
  const t=String(value).trim();
  S.pantry[tier]=S.pantry[tier].map(i=>{
    if(i.id!==id) return i;
    const next={...i,updatedAt:new Date().toISOString()};
    if(t===''){ delete next[field]; }                 // ← blank ⇒ absent (THE contract)
    else { const num=parseFloat(t);
           if(Number.isFinite(num)&&num>=0) next[field]=num; else delete next[field]; }
    return next;
  });
  savePantry();                                       // NO render
}

// Shared unit string. Empty ⇒ delete. NO render.
function updatePantryUnit(tier,id,value){
  const t=String(value).trim();
  S.pantry[tier]=S.pantry[tier].map(i=>{
    if(i.id!==id) return i;
    const next={...i,updatedAt:new Date().toISOString()};
    if(t==='') delete next.unit; else next.unit=t;
    return next;
  });
  savePantry();                                       // NO render
}

// Disclosure toggle — a deliberate click, so render() is fine here.
function togglePantryNum(id){ S.pantryNumOpen[id]=!S.pantryNumOpen[id]; render(); }

// BUG FIX: quickAdjust — use `in` operator instead of || to handle empty string for "gone"
function quickAdjust(id,preset){
  const map={'barely-touched':'almost full','used-half':'about half remaining','used-most':'almost gone','gone':'none left'};
  const newQty=preset in map?map[preset]:null;
  if(newQty===null)return;
  S.pantry.tier3=S.pantry.tier3.map(i=>i.id===id?{...i,quantity:newQty,updatedAt:new Date().toISOString()}:i);
  savePantry();render();
}

// Review actions
function resetTier2(){S.pantry.tier2=S.pantry.tier2.map(i=>({...i,have:false}));savePantry();showToast("Weekly items reset");render()}
function restockItem(id){S.pantry.tier1=S.pantry.tier1.map(i=>i.id===id?{...i,status:'well-stocked',updatedAt:new Date().toISOString()}:i);savePantry();render()}

// Robust clipboard write. On file:// (Firefox/mobile) navigator.clipboard is undefined and
// navigator.clipboard.writeText would throw synchronously past any .catch — guard it, and fall
// back to the legacy execCommand path. Returns a Promise<boolean> that never throws.
function _execCopy(str){try{const ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.top='0';ta.style.left='-9999px';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);return !!ok}catch(e){return false}}
function copyText(str){return new Promise(resolve=>{try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(str).then(()=>resolve(true)).catch(()=>resolve(_execCopy(str)))}else{resolve(_execCopy(str))}}catch(e){resolve(_execCopy(str))}})}

// Prompt actions
function copyPrompt(){
  const prompt=generatePrompt();
  // On success set the session copy flag and re-render so Surface 1 step-1 flips to "Copied ✓".
  copyText(prompt).then(ok=>{if(ok){S.promptCopied=true;showToast('Prompt copied to clipboard!');render();}else showToast('Copy failed — select and copy manually');});
}

// Onboarding explainer visibility (P0-2). Dismiss writes the persistent mp:onboarded-v1
// flag so the first-run explainer never auto-shows again; "How this works" flips the
// transient S.showOnboarding to re-open it regardless of that persistent flag.
function dismissOnboarding(){S.showOnboarding=false;save(KEYS.onboarded,true);render();}
function showOnboarding(){S.showOnboarding=true;render();}

// Import actions
function loadMock(){S.importRaw=JSON.stringify(MOCK_PLAN,null,2);S.importError=null;S.importParsed=null;saveImportRaw();render()}
function parseImport(){
  S.confirmImport=false; // P2-3: a fresh parse re-arms the two-step confirm (transient, not persisted)
  const res=parsePlanResponse(S.importRaw);
  if(res.ok){S.importParsed=res.plan;S.importError=null;}
  else{S.importParsed=null;S.importError=res.error;}

}
function doImport(){
  if(!S.importParsed)return;
  const plan=S.importParsed;
  if(!Array.isArray(plan.pantry_alerts))plan.pantry_alerts=[];
  S.currentPlan={...plan,importedAt:new Date().toISOString()};
  S.planHistory=[{date:new Date().toISOString(),plan},...S.planHistory].slice(0,52);
  S.checkedItems={};S.removedShoppingItems=[];S.showRemovedItems=false;S.importRaw='';S.importError=null;S.importParsed=null;
  savePlan();saveHistory();saveCheckedItems();saveRemovedItems();saveImportRaw();showToast('Meal plan imported!');nav('dashboard');
}

// Preference actions

function confirmAllergy(){if(!S.confirmAllergy)return;S.prefs.allergies.push(S.confirmAllergy);S.confirmAllergy=null;savePrefs();showToast('Allergy added');render()}

// Export shopping list
function exportShoppingList(){
  const plan=S.currentPlan;if(!plan)return;
  const{shopping_list:sl=[],cost_summary:cs={},metadata:md={}}=plan;
  const byStore={};sl.forEach(item=>{const s=item.store||'Other';if(!byStore[s])byStore[s]=[];byStore[s].push(item)});
  let txt=`Shopping List — Week of ${md.plan_date||todayStr()}\nTotal: $${n2(cs.total_estimated)} ($${n2(cs.per_person_per_day)}/person/day)\n`;
  Object.entries(byStore).forEach(([store,items])=>{
    txt+=`\n── ${store} ──\n`;
    items.forEach(item=>{
      let line=`[ ] ${item.item}`;
      if(item.quantity)line+=` — ${item.quantity}`;
      line+=` — $${n2(item.price)}`;
      if(item.price_type==='estimated')line+=' (est.)';
      if(item.category==='restock')line+=' (restock)';
      if(item.notes)line+=` — ${item.notes}`;
      txt+=line+'\n';
    });
  });
  copyText(txt).then(ok=>showToast(ok?'Shopping list copied!':'Copy failed — select and copy manually'));
}

// Shopping list item removal/restore
function removeShoppingItem(idx){
  if(!S.currentPlan)return;
  const sl=S.currentPlan.shopping_list;
  if(idx<0||idx>=sl.length)return;
  const item=sl[idx];
  // Track for undo
  S.removedShoppingItems.push({...item});
  // Update cost summary
  const cs=S.currentPlan.cost_summary;
  if(cs&&item.price!=null){
    cs.total_estimated=(cs.total_estimated||0)-item.price;
    if(cs.total_estimated<0)cs.total_estimated=0;
    const days=S.currentPlan.metadata?.plan_days||7;
    const ppl=S.currentPlan.metadata?.household_size||1;
    cs.per_person_per_day=cs.total_estimated/(days*ppl);
    const store=item.store||'Other';
    if(cs.by_store&&cs.by_store[store]!=null){
      cs.by_store[store]-=item.price;
      if(cs.by_store[store]<=0)delete cs.by_store[store];
    }
  }
  // Remove from list and clean up checked state
  sl.splice(idx,1);
  // Rebuild checkedItems with shifted indices
  const newChecked={};
  Object.keys(S.checkedItems).forEach(k=>{
    const ki=parseInt(k);
    if(ki<idx)newChecked[ki]=S.checkedItems[ki];
    else if(ki>idx)newChecked[ki-1]=S.checkedItems[ki];
    // ki===idx is the removed item, skip it
  });
  S.checkedItems=newChecked;
  savePlan();saveCheckedItems();saveRemovedItems();render();
}

function restoreShoppingItem(removedIdx){
  if(removedIdx<0||removedIdx>=S.removedShoppingItems.length)return;
  if(!S.currentPlan)return;
  const item=S.removedShoppingItems.splice(removedIdx,1)[0];
  S.currentPlan.shopping_list.push(item);
  // Restore cost summary
  const cs=S.currentPlan.cost_summary;
  if(cs&&item.price!=null){
    cs.total_estimated=(cs.total_estimated||0)+item.price;
    const days=S.currentPlan.metadata?.plan_days||7;
    const ppl=S.currentPlan.metadata?.household_size||1;
    cs.per_person_per_day=cs.total_estimated/(days*ppl);
    const store=item.store||'Other';
    if(cs.by_store)cs.by_store[store]=(cs.by_store[store]||0)+item.price;
  }
  savePlan();saveRemovedItems();render();
}

// Data export/import
function exportAllData(){
  const data={
    _format:'meal-planner-backup',_version:1,_exportedAt:new Date().toISOString(),
    pantry:S.pantry,preferences:S.prefs,household:S.household,
    currentPlan:S.currentPlan,planHistory:S.planHistory,
    promptTemplate:S.promptTemplate,anchorRecipes:S.anchorRecipes,
    checkedItems:S.checkedItems,
    wasteLog:S.wasteLog   // E2-1 (N4): enumerated explicitly → MUST be here or a restore silently destroys it.
                          // wasteDismissed is deliberately OMITTED (UI-suppression, not household data — Q4).
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`weekly-feast-backup-${todayStr()}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup exported!');
}

function importAllData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      // Validate expected keys
      const required=['pantry','preferences','household'];
      const missing=required.filter(k=>!(k in data));
      if(missing.length){showToast('Invalid backup: missing '+missing.join(', '));return}
      if(!confirm('This will replace ALL current data (pantry, preferences, plans, history) with the backup. Continue?'))return;
      // Restore state
      if(data.pantry){S.pantry=normalizePantry(data.pantry);savePantry()}
      if(data.preferences){S.prefs=data.preferences;savePrefs()}
      if(data.household){S.household=data.household;saveHousehold()}
      if('currentPlan' in data){S.currentPlan=data.currentPlan;savePlan()}
      if(data.planHistory){S.planHistory=data.planHistory;saveHistory()}
      let _tplUpgraded=false;
      if(typeof data.promptTemplate==='string'){
        // D4 field-level guard: keep a sentinel-aware template as-is; upgrade a stale one.
        if(data.promptTemplate.includes('BEGIN_WEEKLY_FEAST_JSON')){S.promptTemplate=data.promptTemplate;}
        else{S.promptTemplate=DEFAULT_PROMPT_TEMPLATE;_tplUpgraded=true;}
        saveTemplate();
      }
      if('anchorRecipes' in data){S.anchorRecipes=data.anchorRecipes;saveAnchors()}
      if(data.checkedItems){S.checkedItems=data.checkedItems;saveCheckedItems()}
      else{S.checkedItems={};saveCheckedItems()}
      // E2-1 (N4): guarded, NON-destructive restore — DEPARTS from checkedItems, FOLLOWS
      // planHistory. NO destructive else: a pre-E2 backup legitimately lacks wasteLog; clearing it
      // would silently destroy irreplaceable longitudinal waste history. Absent-in-backup ⇒ PRESERVE.
      if(data.wasteLog&&typeof data.wasteLog==='object'){S.wasteLog=normalizeWasteLog(data.wasteLog);saveWasteLog()}
      S.removedShoppingItems=[];S.showRemovedItems=false;saveRemovedItems();
      showToast(_tplUpgraded?'Data restored — upgraded an old prompt template to the new import format.':'Data restored from backup!');render();
    }catch(err){showToast('Failed to parse backup file: '+err.message)}
  };
  reader.readAsText(file);
  event.target.value=''; // Reset so same file can be re-selected
}

render();
if(_pendingUpgradeToast){showToast(_pendingUpgradeToast);_pendingUpgradeToast=null;}
