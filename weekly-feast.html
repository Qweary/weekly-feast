<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>weekly-feast</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0f1117;--bg2:#161822;--border:#1e2130;--fg:#e2e8f0;--fg2:#94a3b8;--fg3:#64748b;--fg4:#475569;
--blue:#38bdf8;--green:#34d399;--amber:#fbbf24;--red:#ef4444;
--font:'JetBrains Mono','Fira Code','Source Code Pro','Cascadia Code','Consolas',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px}
input,select,textarea,button{font-family:var(--font)}
a{color:var(--blue);text-decoration:none}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:210px;min-width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0;overflow-y:auto}
#sidebar .logo{padding:0 16px 20px;border-bottom:1px solid var(--border);margin-bottom:8px}
#sidebar .logo h1{font-size:15px;font-weight:700;color:#f1f5f9;letter-spacing:.5px;margin:0}
#sidebar .logo .sub{font-size:10px;color:var(--fg3);margin-top:2px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 16px;border:none;background:transparent;color:var(--fg2);cursor:pointer;font-size:12px;text-align:left;border-left:2px solid transparent;width:100%;font-family:var(--font);min-height:44px}
.nav-btn:hover{background:#1e293b22}
.nav-btn.active{background:#1e293b;color:var(--blue);border-left-color:var(--blue)}
.nav-btn.disabled{color:#334155;cursor:not-allowed}
.nav-btn .icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-btn .soon{font-size:9px;color:var(--fg4);margin-left:auto}
#main{flex:1;overflow-y:auto;padding:24px;-webkit-overflow-scrolling:touch}

/* Cards & Components */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.section-title{margin-bottom:20px}
.section-title h2{font-size:18px;font-weight:700;color:#f1f5f9;margin:0}
.section-title .sub{font-size:11px;color:var(--fg3);margin-top:4px}
.btn{padding:7px 14px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-family:var(--font);color:var(--fg);transition:background .15s;min-height:44px}
.btn:disabled{background:#1e293b!important;color:var(--fg4)!important;cursor:not-allowed}
.btn-default{background:#1e293b}.btn-default:hover:not(:disabled){background:#334155}
.btn-primary{background:#0369a1}.btn-primary:hover:not(:disabled){background:#0284c7}
.btn-danger{background:#991b1b}.btn-danger:hover:not(:disabled){background:#b91c1c}
.btn-success{background:#166534}.btn-success:hover:not(:disabled){background:#15803d}
.inp{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 10px;color:var(--fg);font-size:12px;outline:none;width:100%;min-height:36px}
.inp:focus{border-color:#334155}
select.inp{appearance:auto}
textarea.inp{resize:vertical;line-height:1.6}

/* Grid helpers */
.grid{display:grid;gap:8px}.grid-2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid-shop{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.flex{display:flex}.flex-wrap{flex-wrap:wrap}.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}
.items-center{align-items:center}.justify-between{justify-content:space-between}.flex-1{flex:1}

/* Tags */
.tag{padding:3px 10px;border-radius:12px;font-size:11px;display:inline-flex;align-items:center;gap:6px}
.tag button{background:none;border:none;cursor:pointer;font-size:13px;padding:0;line-height:1}

/* Status badges */
.status-badge{padding:3px 10px;border-radius:12px;border:none;cursor:pointer;font-size:10px;font-family:var(--font);font-weight:600;text-transform:uppercase;letter-spacing:.5px;min-height:28px}

/* Category badges */
.cat-badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}

/* Shopping item row */
.shop-row{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;border-bottom:1px solid var(--border);min-height:44px;transition:opacity .12s,background .12s}
.shop-row:last-child{border-bottom:none}
.shop-row.checked{opacity:.55;background:var(--bg)}
.shop-row.checked .shop-name{text-decoration:line-through}
.shop-row input[type=checkbox]{accent-color:var(--blue);width:18px;height:18px;flex-shrink:0;pointer-events:none}

/* Progress bar */
.progress{display:flex;gap:8px;margin-bottom:20px}
.progress .bar{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s}
.progress .bar.active{background:var(--blue)}

/* Toast */
#toast{position:fixed;top:16px;right:16px;background:#166534;color:#bbf7d0;padding:10px 20px;border-radius:6px;font-size:12px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.4);display:none;max-width:300px}
#toast.show{display:block;animation:fadeInOut 2.5s ease}
@keyframes fadeInOut{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0}}

/* Responsive */
#bottom-nav{display:none}
@media(max-width:640px){
  #sidebar{display:none}
  #main{padding:16px 12px 80px}
  #bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:100;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bnav-btn{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:none;background:transparent;color:var(--fg2);font-size:9px;font-family:var(--font);cursor:pointer;white-space:nowrap}
  .bnav-btn.active{color:var(--blue)}
  .bnav-btn.disabled{color:#334155;cursor:not-allowed}
  .bnav-btn .icon{font-size:16px}
  .section-title h2{font-size:16px}
  .grid-2{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr}
  .grid-shop{grid-template-columns:1fr}
  .btn{width:100%}
  .card{padding:12px}
}

/* Remove button */
.rm-btn{background:none;border:none;color:var(--fg4);cursor:pointer;font-size:16px;padding:4px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;flex-shrink:0}
.rm-btn:hover{color:var(--red);background:#991b1b22}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// DATA & CONSTANTS
// ═══════════════════════════════════════════════════════════════════════════
const KEYS={pantry:'mp:pantry-v2',preferences:'mp:preferences-v1',household:'mp:household-v1',currentPlan:'mp:current-plan-v1',planHistory:'mp:plan-history-v1',promptTemplate:'mp:prompt-template-v7',anchorRecipes:'mp:anchor-recipes-v1',checkedItems:'mp:checked-items-v1',onboarded:'mp:onboarded-v1',specialInstructions:'mp:special-instructions',startDate:'mp:start-date',importRaw:'mp:import-raw',removedShoppingItems:'mp:removed-shopping-items'};

const DEFAULT_PANTRY={tier1:[
{id:"t1-1",name:"All-purpose flour",category:"grain",status:"well-stocked",onHand:4,unit:"lb",par:2,updatedAt:new Date().toISOString()},
{id:"t1-2",name:"Sugar",category:"sweetener",status:"well-stocked",onHand:3,unit:"lb",par:1,updatedAt:new Date().toISOString()},

{id:"t1-10",name:"Vinegar",category:"condiment",status:"well-stocked",updatedAt:new Date().toISOString()}
],tier2:[
{id:"t2-1",name:"Eggs (dozen)",category:"dairy",have:true,onHand:6,unit:"count",openedAt:null},
{id:"t2-2",name:"Milk (gallon)",category:"dairy",have:true},
{id:"t2-3",name:"Bread (loaf)",category:"grain",have:false},
{id:"t2-4",name:"Butter",category:"dairy",have:true},
{id:"t2-5",name:"Cheddar cheese",category:"dairy",have:false}
],tier3:[
{id:"t3-1",name:"Chicken thighs",category:"protein",quantity:"about 3 lbs",onHand:3,unit:"lb",openedAt:null,updatedAt:new Date().toISOString()},
{id:"t3-2",name:"Ground beef",category:"protein",quantity:"about 1 lb",onHand:1,unit:"lb",openedAt:null,updatedAt:new Date().toISOString()},
{id:"t3-3",name:"Frozen mixed vegetables",category:"frozen",quantity:"half remaining",onHand:0.5,unit:"bag",openedAt:null,updatedAt:new Date().toISOString()}
]};

const DEFAULT_PREFERENCES={allergies:[],dislikes:[],positives:["Mexican food","One-pot meals","Seasonal vegetables"]};
const DEFAULT_HOUSEHOLD={size:2,mealStructure:"Simple breakfasts and lunches, larger dinners",starterActive:false,walmartThreshold:"only-major",region:"Seattle, WA",planDays:7,stores:"QFC, Kroger, Safeway, Walmart"};

const WALMART_LABELS={"only-major":"Only for major savings (>20%)","moderate":"Moderate savings okay (10-15%)","include-freely":"Include Walmart freely"};
const WALMART_PROMPT={"only-major":"Only recommend Walmart when savings exceed 20% on enough items to justify a separate trip.","moderate":"Recommend Walmart when savings exceed 10-15% on key items.","include-freely":"Treat Walmart as an equal-priority store."};
const STATUS_COLORS={"well-stocked":"#22c55e","getting-low":"#f59e0b","out":"#ef4444"};
const CATEGORY_LABELS={sale:{color:"#34d399",label:"sale"},staple:{color:"#94a3b8",label:"staple"},restock:{color:"#f59e0b",label:"restock"}};
const STATUS_ORDER=["well-stocked","getting-low","out"];

const NAV_ITEMS=[
{id:"dashboard",label:"Dashboard",icon:"◉"},
{id:"pantry",label:"Pantry",icon:"◫"},
{id:"review",label:"Review",icon:"↻"},
{id:"generate",label:"Prompt",icon:"⟩"},
{id:"import",label:"Import",icon:"⇩"},
{id:"preferences",label:"Prefs",icon:"⚙"},
{id:"pricewatch",label:"Prices",icon:"⇅"},
{id:"consumption",label:"Log",icon:"📊",disabled:true}
];

// Production prompt template
const DEFAULT_PROMPT_TEMPLATE=`You are a budget-conscious meal planning assistant. Your job is to research current grocery deals, find matching recipes, and produce a structured weekly meal plan with a shopping list. You will use web search and web fetch to gather real-time data. Do not guess at prices or recipes — fetch actual current information. Live web search is a prerequisite for this task, not an option: the whole point is real, current ad prices. If web search or fetch is unavailable or disabled in this conversation, do not silently proceed as if the prices were real — state plainly at the very top of your narrative that web search was not available, mark every price in the data block with price_type "estimated" (never "confirmed"), and set metadata.confidence to "low." Any individual price you did not verify with a search or fetch this session must likewise be labeled "estimated"; reserve "confirmed" for prices you actually saw in a current ad or coupon listing.


HOUSEHOLD CONTEXT

Household size: {{HOUSEHOLD_SIZE}} people.
Planning for {{PLAN_DAYS}} days starting {{START_DATE}}.
Region: {{REGION}} (use this for seasonal produce awareness).
Sourdough starter active: {{STARTER_ACTIVE}}.


CURRENT PANTRY STATE

The block below is the household's starting inventory. Treat "on hand: N unit" as the exact quantity
already owned and subtract it from recipe demand before buying (STEP 4). "par: N unit" on a staple is
the minimum to keep stocked — reorder that staple only if the week would drop it below par. Lines that
say "quantity not tracked" have no number: reason about them qualitatively from their status, and do not
assume a numeric quantity. Items opened/aging or shown under a "use first" flag should be scheduled into
the earliest meals.

{{PANTRY_STATE}}


DIETARY CONSTRAINTS

Hard exclusions (allergies — never include under any circumstances): {{ALLERGIES}}.
Soft exclusions (dislike — avoid when reasonable, but acceptable if a deal is compelling enough to mention): {{DISLIKES}}.
Positive preferences: {{PREFERENCES}}.


STORE CONFIGURATION

Target stores in priority order: {{STORES}}.
Many regional grocery chains share a corporate parent and a loyalty/ad backend (for example
QFC and Kroger both run on the Kroger backend, as do other Kroger-family banners like King
Soopers, Fred Meyer, and Ralphs), so their weekly ads overlap heavily. When two of the stores
above share such a backend, search that backend's ad once and apply the findings to both — it
saves search calls and surfaces the same deals.
All loyalty pricing and digital coupon pricing is available to the household. Factor those prices into your recommendations.

{{WALMART_BLOCK}}


SPECIAL INSTRUCTIONS FOR THIS WEEK

{{SPECIAL_INSTRUCTIONS}}


YOUR RESEARCH TASKS

Important — Research Strategy and Tool Call Budget:
You have a budget of approximately 15-20 total web search and web fetch calls. Plan your research to maximize information per call. Here is the priority order:

Phase 1 (Ad Research — aim for 4-6 total calls):
  Start with one or two broad aggregator searches (e.g., "Kroger QFC Safeway weekly ad deals [region] this week") that are likely to surface deal blog summaries or Flipp-style roundups covering multiple stores at once. If the aggregator results are rich enough, you may not need per-store searches. Only escalate to individual store ad page searches for stores that were not covered by the aggregator results. Do not attempt to fetch interactive circular pages unless the simpler approaches returned nothing usable — these rarely yield good text content. Remember that QFC and Kroger share a backend, so one Kroger ad search often covers both.

Phase 2 (Recipe Research — aim for 6-10 total calls):
  Identify the top 3-4 best sale items from Phase 1 (typically the proteins and high-value produce). Search for recipes featuring those specific items on the preferred recipe sites. You can combine multiple preferred sites into a single search query (e.g., "budget chicken thigh recipe site:gracefullittlehoneybee.com OR site:thepioneerwoman.com"). Only fetch the actual recipe page for recipes you intend to include in the final plan — do not fetch pages for candidates you are just evaluating from search snippets. If the sourdough starter is active, allocate one of your recipe searches to pantrymama.com for a sourdough-based recipe. If the starter is not active, redistribute that search to the other preferred sites.

Phase 3 (Confirmation — aim for 2-4 total calls):
  Fetch the recipe pages for your final selections to confirm ingredient lists and quantities. If you already fetched a page during Phase 2, do not re-fetch it.

If you find yourself approaching 20 calls and still have gaps, stop searching and work with what you have. Note any gaps in your narrative summary. A slightly less optimal plan delivered completely is better than an exhaustive search that fails to produce output.


Preferred Recipe Sites:
  - Graceful Little Honey Bee (gracefullittlehoneybee.com) — budget homestead meals
  - Scratch Pantry (scratchpantry.com) — from-scratch staples
  - Pantry Mama (pantrymama.com) — sourdough and fermentation (search only if starter is active)
  - Pioneer Woman (thepioneerwoman.com) — hearty comfort food

If a preferred site has no good match for a given sale ingredient, search other reputable scratch-cooking sites and note the substitution in your narrative.


STEP 1 — GATHER CURRENT AD DATA

Search for current weekly ad deals from each target store, following the phased strategy above. For each store, note the ad cycle dates (start and end) so the meal plan aligns with currently valid pricing. If you cannot retrieve usable ad data for a store after reasonable effort, note it explicitly in the metadata and fall back to general seasonal pricing estimates for that store, clearly labeling any estimated prices.

If fewer than two stores yield confirmed ad data, state this prominently at the start of your narrative, fall back to seasonal pricing and anchor recipes, and flag the entire plan as lower-confidence.


STEP 2 — FIND MATCHING RECIPES

Based on the top sale proteins and produce from Step 1, search the preferred recipe sites for matching recipes. Prefer recipes where the majority of ingredients are either on sale, already in the pantry, or cheap staples. Fetch the actual recipe page to confirm ingredients and quantities for your final selections — do not rely on search snippet summaries alone for recipes you include in the plan.

When evaluating recipes, scale them to {{HOUSEHOLD_SIZE}} servings. Reflect the scaled quantities in both the ingredient list and cost calculations in the final output.


STEP 3 — BUILD THE MEAL PLAN

Dinners: Select recipes for each planned dinner night (accounting for any skipped nights from special instructions). Maximize ingredient overlap across the week, and enforce it as a hard rule rather than an aspiration: any perishable bought in a bunch or multi-serving format that a single meal cannot finish (a bunch of cilantro or scallions, a head of cabbage, a bag of greens, a tub of sour cream, a block of cheese) MUST be routed to at least two — ideally three — meals scheduled close enough together to use it before it decays (one bunch of cilantro → tacos, a grain bowl, and a soup garnish within four days). Use cascade cooking to build that overlap on purpose: cook a base once and redeploy it across days (a roast chicken → sliced for dinner day 1, shredded into wraps or a salad day 2, the carcass into soup or stock day 3; one pot of grains or one tray of roasted vegetables fanned across several meals as a shared component). Planned leftovers and shared components are a design choice that cuts cost and waste at once — build them in deliberately. Sequence meals by perishability as a descending staircase, not a coarse first-half/second-half split. Place the most perishable ingredients earliest and pin them tightly: Tier-0 items with a 1-2 day refrigerated life (fresh fish and shellfish, fresh ground meat and ground poultry, delicate soft herbs like cilantro and basil, tender salad greens, fresh berries, ripe avocado) MUST be cooked on day 1 or day 2 — this is the first-48 rule: highly perishable meat and produce is cooked or frozen within 48 hours of purchase. Schedule Tier-1 items with a 3-5 day life (large raw cuts of beef and pork, broccoli, asparagus, green beans, mushrooms, bell peppers) on days 2-4. Spread Tier-2 items with a 1-2 week life (carrots, celery, cabbage, citrus, apples, hard cheeses, eggs) across the mid-to-late week. Backfill the last days (day 5 onward) with Tier-3, frozen, and pantry-stable items (potatoes, onions, winter squash, canned and dried goods, anything frozen). Read the finished week top to bottom: perishability should fall, never rise, from the first dinner to the last. Freezer offload is the pressure valve — if the plan or a sale-driven bulk buy brings in more Tier-0 or Tier-1 protein than can be cooked within its refrigerated window (common for a small household buying a family pack), direct the household to portion and freeze the surplus on day 0, the shopping day, dated and rotated first-in-first-out, and pull it to a back-half night. Freezing pauses the decay clock and suits proteins, cooked components, and stock; do not freeze high-water raw produce or tender greens for fresh use. Call out each freeze-on-day-0 action in that day's perishability_note and in the narrative so the household actually freezes it in time. For each dinner, calculate approximate cost per serving using confirmed sale prices where available and estimates where not, and judge value on cost per serving actually eaten rather than sticker or shelf-unit price. When comparing package sizes or a bulk buy, use spoilage-adjusted unit cost: divide the price by the quantity the household will realistically consume before it spoils, not the quantity printed on the label — a larger, cheaper-per-ounce pack is only cheaper if it is fully used, and for a small household a family-size perishable is often more expensive per serving eaten once the spoiled remainder is priced in. When cost and perishability conflict, favor the plan that is fully consumed. When two options cost similarly, favor the one using fresh seasonal produce over processed ingredients, and note this choice. Compute actual calendar dates for each day by counting forward from {{START_DATE}}.

For each ingredient, also record its shelf-life tier and, for any Tier-0 or Tier-1 perishable, the
date by which it must be cooked or frozen: shelf_life_tier is 0 (fish/shellfish, ground meat/poultry,
soft herbs, tender greens, berries, ripe avocado — 1-2 days), 1 (large raw beef/pork cuts, broccoli,
asparagus, green beans, mushrooms, bell peppers, cooked leftovers — 3-5 days), 2 (carrots, celery,
cabbage, citrus, apples, hard cheese, eggs — 1-2 weeks), or 3 (onions, potatoes, winter squash, canned,
dried grains/pasta/legumes, oils, anything frozen — weeks to months). Set cook_by (Tier-0/1) or
freeze_by (if it will be frozen on day 0) to the actual calendar date; leave both null for Tier-2/3
shelf-stable items. These tiers follow USDA FSIS / FoodSafety.gov cold-storage guidance — do not invent
shorter or longer windows.

Breakfasts and lunches: Provide simple text suggestions (oatmeal, sandwiches, eggs, leftovers, simple salads) without full recipe treatment. These should be low-effort, pantry-driven meals. Reference specific leftovers by name where applicable (e.g., "leftover beef stew from Day 3").

Pantry consumption check: After drafting the full week's plan, review cumulative ingredient usage against the pantry state. If any pantry item categorized as "well-stocked" or "getting low" would be substantially depleted by the week's meals (e.g., the plan uses rice in 5 of 7 dinners, or multiple recipes draw heavily on the same spice), flag it in the pantry_alerts section of the JSON. This helps the household anticipate restock needs before they run out.

Single-use audit: in the same pass, walk every fresh or perishable ingredient the plan buys and flag any that only one meal uses — especially a Tier-0 or Tier-1 bunch or multi-serving item whose remainder will spoil before a second occasion. Prefer to fix each one in place (add a second meal that uses the remainder, downsize the purchase to the amount actually needed, or substitute a longer-life pantry alternative) rather than leave a stranded remainder. If a single-use perishable purchase is genuinely unavoidable, say so explicitly in the narrative and name what happens to the leftover, so the waste is a visible choice and not an accident.


STEP 3.5 — WEEKLY NUTRITION BALANCE (apply while placing the STEP 3 meals, before the shopping list)

Nutrition here is a WEEKLY variety constraint layered on top of the cost- and perishability-optimized
plan you just built — not a new primary objective, and not a per-meal rule. A carb-heavy lunch or a
single-vegetable dinner is fine as long as the WEEK balances. Do NOT re-open the sale-anchored,
depletion-reconciled plan and make it more expensive to chase a nutrition number. Instead, as you settle
which recipes fill each still-open night, steer those choices so that ACROSS THE WEEK the plan lands
these targets:

1. Protein rotation — use at least THREE distinct protein sources across the week (for example poultry, a
   bean/lentil dinner, eggs, canned or fresh fish, limited red meat). Do not use the same protein every
   night.
2. Seafood — aim for about TWO seafood servings across the week. Canned tuna or salmon and frozen fish
   count and are budget-friendly ways to hit this.
3. Vegetable variety — draw produce from at least THREE of the five MyPlate vegetable subgroups across the
   week: dark-green; red/orange; beans/peas/lentils; starchy; other. Do not lean on a single subgroup
   (e.g. all potatoes/corn).
4. Produce volume — across the week on average, produce (vegetables + fruit) should fill about half the
   plate. This is MyPlate's plate frame extended to the week, not a per-meal rule.
5. Whole grains — make at least some of the week's grains whole (brown rice, whole-wheat pasta, oats).

Reconcile against cost — do NOT fight it. Nutrition variety and cheap eating pull the SAME direction far
more often than they conflict: the cheapest proteins per gram (dried and canned legumes, eggs, canned
fish, chicken thighs) are also the ones that ADD rotation. So reach variety by moving DOWN the protein
cost ladder, not up it. Prefer budget-neutral swaps — when two candidate dinners cost about the same per
serving, choose the one that adds a missing protein source, vegetable subgroup, or a seafood/whole-grain
serving. Only when a genuine conflict remains — the only affordable sale protein is a single item, seafood
is not on sale and buying it would break the household budget, or the week's affordable produce is one
subgroup — does cost win. When cost wins, you FLAG the shortfall (below); you do NOT silently pass it off
as balanced, and you do NOT blow the budget to erase it.

Flag-on-shortfall self-check — REQUIRED before you emit the JSON. Tally the plan you actually built (not
what you intended) and fill nutrition_summary from the real week:
- protein_sources: the distinct protein sources actually used.
- veg_subgroups: the MyPlate vegetable subgroups actually represented.
- seafood_servings: the actual number of seafood servings.
- produce_half_plate: true ONLY if produce really fills about half the plate across the week; else false.
- shortfalls: for EVERY target (1–5) the finished plan does NOT meet, add ONE honest entry that names the
  gap AND the cost/availability reason it could not be met this week. Examples: "Protein monotony —
  chicken is the only protein source; it was the week's sale anchor and no comparably priced second
  protein was available to rotate in." / "Vegetable subgroups — only starchy represented; the affordable
  produce this week was potatoes and corn." / "No seafood — none was on sale and fresh fish would break
  the budget." / "Produce under half-plate — the budget went to protein and staples." If the plan meets
  every target, shortfalls is an empty array []. Do NOT omit a real shortfall to make the plan look
  balanced — an honestly flagged shortfall is the correct output; a silently monotone week is the defect.
- notes: brief positive commentary if useful (for example a legume-plus-grain vegetarian night that also
  cut cost), or null.

This is general healthy-eating guidance for weekly variety, not medical nutrition therapy. A diagnosed
condition, a therapeutic or clinical diet, or allergy management with anaphylaxis risk requires a
Registered Dietitian — do not present this pass as clinical dieting.


STEP 4 — GENERATE THE SHOPPING LIST (DEPLETION-RECONCILED)

Do NOT list the raw sum of the recipe ingredients. The shopping list is the POSITIVE REMAINDER after
subtracting what the household already owns. For every ingredient the week's meals require, compute:

    to_buy = max(0, total_demand_across_all_meals − on_hand_from_the_pantry_state)

Use the CURRENT PANTRY STATE block above as your starting inventory. Run this reconciliation pass:

1. Build the demand table. Sum each ingredient's quantity across every meal that uses it (convert to a
   common unit per ingredient — e.g. total pounds of chicken thighs across all dinners).

2. Debit against on-hand in consumption order. Walk the meals in day order and subtract each
   ingredient's demand from a running on-hand balance. This surfaces CONFLICTS: if two meals both draw
   on the same limited on-hand quantity and the running balance would go negative, the shortfall is
   exactly what must be bought. Assign the purchased top-up to the later meal and note the competition.

3. Emit only positive remainders. If on_hand >= total_demand for an item, it does NOT go on the
   shopping list at all (it is fully covered by the pantry) — mark it source "pantry" wherever a recipe
   uses it. Only when to_buy > 0 does the item appear on the shopping_list, with quantity = to_buy.

4. STAPLES are par-gated, not demand-gated. For any item under "STAPLES" in the pantry state that has a
   "par:" value: do NOT buy it just because a recipe uses it. Project its end-of-horizon balance
   (on_hand − demand). Buy it ONLY IF that projected balance would fall below par (or the item is shown
   as "out"). When you do, set its shopping_list "category" to "restock", buy enough to return to par,
   and say so in "notes". A staple whose projected balance stays at or above par stays OFF the list.

5. Qualitative-only items (pantry lines that say "quantity not tracked"): you do not have a number to
   subtract. Treat "well-stocked" as "assume enough for the week — do not buy unless a recipe needs an
   unusually large amount"; treat "getting-low" or "out" as buy/restock candidates. Never invent a
   numeric on-hand for these — reason qualitatively and note the assumption.

Then group the resulting buy list by store with the recommended store per item (existing rules below
still apply): items not on sale are "staple — buy at any store"; a staple on sale at a store you are
already visiting is a "restock" opportunity, especially if the pantry shows it low. Apply stock-up
economics to non-perishable and freezer-stable staples: at an unusually low trough price, buy deeper
than the week needs — but only up to what the household can store and rotate before expiry, and never
for Tier-0/Tier-1 perishables unless the surplus is frozen on day 0. Flag any such deeper buy in that
item's notes as a deliberate stock-up. Include quantities for everything. Flag any Walmart
recommendation with a brief savings justification.

Reconciliation self-check before you emit the JSON: (a) no item appears on the shopping_list whose
on_hand already covered its demand; (b) no staple appears unless its projected balance fell below par
or it was out; (c) every meal that used a fully-covered ingredient marked that ingredient's "source"
as "pantry"; (d) any two meals that competed for the same last on-hand portion are reflected — the
loser's shortfall is the bought quantity and it is noted.

const WF_SENTINEL_BEGIN='BEGIN_WEEKLY_FEAST_JSON';
const WF_SENTINEL_END='END_WEEKLY_FEAST_JSON';

const MSG_NO_JSON='No meal-plan JSON found. Paste the full response — the importer looks for a block wrapped in BEGIN_WEEKLY_FEAST_JSON / END_WEEKLY_FEAST_JSON, a fenced code block, or a bare JSON object.';

// Coerce anything to a finite number, else null. Handles "$2.85", "1,234.50", "4".
function toNum(v){
  if(typeof v==='number')return isFinite(v)?v:null;
  if(typeof v!=='string')return null;
  const t=v.replace(/[^0-9.+-]/g,'');
  if(t===''||/^[+\-.]+$/.test(t))return null;
  const n=parseFloat(t);
  return isFinite(n)?n:null;
}

// Return each TOP-LEVEL balanced {...} substring, ignoring braces inside strings.
function sliceBalancedObjects(s){
  const out=[];let depth=0,start=-1,inStr=false,q='',esc=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(inStr){
      if(esc){esc=false;continue}
      if(c==='\\'){esc=true;continue}
      if(c===q)inStr=false;
      continue;
    }
    if(c==='"'||c==="'"){inStr=true;q=c;continue}
    if(c==='{'){if(depth===0)start=i;depth++;}
    else if(c==='}'){if(depth>0){depth--;if(depth===0&&start!==-1){out.push(s.slice(start,i+1));start=-1;}}}
  }
  return out;
}

// True if the string ends with unclosed strings/braces/brackets (i.e. truncated).
function isTruncated(s){
  let inStr=false,q='',esc=false,curly=0,square=0;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(inStr){
      if(esc){esc=false;continue}
      if(c==='\\'){esc=true;continue}
      if(c===q)inStr=false;
      continue;
    }
    if(c==='"'||c==="'"){inStr=true;q=c;continue}
    if(c==='{')curly++;else if(c==='}')curly--;
    else if(c==='[')square++;else if(c===']')square--;

  return curly>0||square>0||inStr;
}

function extractFenced(text){
  const out=[];const re=/```(?:json|JSON)?[ \t]*\r?\n?([\s\S]*?)```/g;let m;
  while((m=re.exec(text))!==null){const s=(m[1]||'').trim();if(s)out.push(s);}
  return out;
}
function stripFence(block){
  const m=block.match(/```(?:json|JSON)?[ \t]*\r?\n?([\s\S]*?)```/);
  return m?m[1]:block;
}

// Best-effort JSON repair: unicode quotes, single-quoted strings, comments,
// unquoted keys, trailing commas, python literals. Only invoked after strict fails.
function repairJSON(s){
  s=s.replace(/[“”„‟″]/g,'"')
     .replace(/[‘’‚′]/g,"'")
     .replace(/[﻿​]/g,'');
  // Structural fixes (bare-key quoting, trailing-comma strip, python literals) apply
  // ONLY to text OUTSIDE double-quoted string literals, so a value like "None Pizza
  // with Left Beef" or "A True crowd-pleaser" is never silently rewritten.
  function fixStruct(t){
    return t
      .replace(/([{,]\s*)([A-Za-z_$][\w$]*)(\s*:)/g,'$1"$2"$3') // quote bare keys
      .replace(/,(\s*[}\]])/g,'$1')                             // trailing commas
      .replace(/\bNone\b/g,'null').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false');
  }
  let out='';let struct='';let i=0;const n=s.length;
  while(i<n){
    const c=s[i];
    if(c==='"'){ // copy a double-quoted string verbatim; flush structural text before it
      out+=fixStruct(struct);struct='';
      let lit=c;i++;
      while(i<n){const d=s[i];lit+=d;i++;if(d==='\\'){if(i<n){lit+=s[i];i++;}continue}if(d==='"')break;}
      out+=lit;continue;
    }
    if(c==="'"){ // convert single-quoted string to a double-quoted string literal
      out+=fixStruct(struct);struct='';
      i++;let buf='';
      while(i<n){const d=s[i];
        if(d==='\\'){buf+=d+(i+1<n?s[i+1]:'');i+=2;continue}
        if(d==="'"){i++;break}
        if(d==='"'){buf+='\\"'}else buf+=d;
        i++;
      }
      out+='"'+buf+'"';continue;
    }
    if(c==='/'&&s[i+1]==='/'){i+=2;while(i<n&&s[i]!=='\n')i++;continue}
    if(c==='/'&&s[i+1]==='*'){i+=2;while(i<n&&!(s[i]==='*'&&s[i+1]==='/'))i++;i+=2;continue}
    struct+=c;i++;
  }
  out+=fixStruct(struct);
  return out;
}

// Strict parse, else detect truncation (fatal), else repair-then-parse.
function parseCandidate(str){
  const s=(str==null?'':String(str)).trim();
  if(!s)return{ok:false,error:MSG_NOT_PLAN};
  try{return{ok:true,data:JSON.parse(s),repaired:false}}catch(e0){}
  if(isTruncated(s))return{ok:false,error:MSG_TRUNCATED,truncated:true};
  const fixed=repairJSON(s);
  try{return{ok:true,data:JSON.parse(fixed),repaired:true}}catch(e1){
    if(isTruncated(fixed))return{ok:false,error:MSG_TRUNCATED,truncated:true};
    return{ok:false,error:'Could not parse the meal-plan JSON, even after cleanup: '+e1.message};
  }
}

// How plan-like is a parsed object (0 = narrative noise, 3 = full plan)?
function planScore(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return 0;

// Ordered extraction chain -> array of candidate JSON strings (priority order).
function extractPlanJSON(raw){
  const text=(raw==null?'':String(raw));
  const cands=[];
  const bi=text.indexOf(WF_SENTINEL_BEGIN);
  if(bi!==-1){
    const after=bi+WF_SENTINEL_BEGIN.length;
    const ei=text.indexOf(WF_SENTINEL_END,after);
    let block=(ei!==-1?text.slice(after,ei):text.slice(after));
    block=stripFence(block).trim();
    const objs=sliceBalancedObjects(block);
    if(objs.length)for(const o of objs)cands.push(o);
    else if(block)cands.push(block);
  }
  for(const f of extractFenced(text)){
    const objs=sliceBalancedObjects(f);
    if(objs.length)for(const o of objs)cands.push(o);
    else if(f.trim())cands.push(f.trim());
  }
  for(const o of sliceBalancedObjects(text))cands.push(o);
  const seen={},uniq=[];
  for(const c of cands){const k=c.trim();if(k&&!seen[k]){seen[k]=1;uniq.push(k);}}
  return uniq;
}

// Capture the post-sentinel "why this plan" narrative as a SEPARATE, READ-ONLY pass over the
// raw text. Domain invariant: this must NOT touch extraction — it never feeds sliceBalancedObjects
// / planScore and never alters extractPlanJSON candidates or parsePlanResponse selection. Only
// captures when BOTH sentinels are present (the fallback whole-text path has no clean narrative
// boundary, so we capture nothing rather than guess). Returns string | null (never "").
function captureWhyPlan(raw){
  const text=(raw==null?'':String(raw));
  const bi=text.indexOf(WF_SENTINEL_BEGIN);
  if(bi===-1)return null;
  const ei=text.indexOf(WF_SENTINEL_END,bi+WF_SENTINEL_BEGIN.length);
  if(ei===-1)return null;
  let s=text.slice(ei+WF_SENTINEL_END.length).trim();
  if(!s)return null;
  // Strip, conservatively (a stray rule surviving is cosmetic; eating a real paragraph is not):
  // 1) a single leading horizontal rule (---, ***, ___) on its own line.
  s=s.replace(/^(?:-{3,}|\*{3,}|_{3,})[ \t]*(?:\r?\n|$)/,'').replace(/^\s+/,'');
  // 2) a single leading "why this plan"/"why this week"-style heading line (only if the WHOLE
  //    leading line is that title — never a mid-body line, never a heading carrying real content).
  s=s.replace(/^[ \t]*#{0,6}[ \t]*(?:\*\*|__)?[ \t]*why this (?:plan|week)[ \t]*(?:\*\*|__)?[ \t]*:?[ \t]*(?:\r?\n|$)/i,'').replace(/^\s+/,'');
  s=s.trim();
  return s?s:null;
}

// Orchestrate extract -> parse -> normalize -> validate. Pure: {ok,plan}|{ok,error}.
function parsePlanResponse(raw){
  const text=(raw==null?'':String(raw)).trim();
  if(!text)return{ok:false,error:MSG_EMPTY};
  const cands=extractPlanJSON(text);
  if(!cands.length)return{ok:false,error:MSG_NO_JSON};
  let parseErr=null,best=null,bestScore=0;
  for(const cand of cands){
    const pc=parseCandidate(cand);
    if(!pc.ok){if(parseErr==null||pc.truncated)parseErr=pc.error;continue}
    const score=planScore(pc.data);
    if(score===0)continue;
    if(score>bestScore){best=pc.data;bestScore=score;}
    if(score>=3)break;
  }
  if(best!=null)return{ok:true,plan:{...normalizePlan(best),why_plan:captureWhyPlan(text)}};
  if(parseErr)return{ok:false,error:parseErr};
  return{ok:false,error:MSG_NOT_PLAN};
}

// Same contract as migrateTemplateV6: exact-equality test against the pristine v6 default via djb2.
// A non-customizing user (stored v6 === pristine v6 default) is force-upgraded to the v7 STORE
// CONFIGURATION default ({{STORES}} + generalized backend hint + {{WALMART_BLOCK}}); a user who
// hand-edited their template is carried forward untouched under the new key and can re-pull via the
// editor. The hash test can only ever false-PRESERVE (a drifted/edited template is kept), never
// false-REPLACE. Chains after the v5→v6 guard above (which removed the v5 key first).
const PREV_TEMPLATE_V6_HASH=1247868438; // djb2 of the pristine v6 DEFAULT_PROMPT_TEMPLATE (pre-store-config)
(function migrateTemplateV7(){
  try{
    const DONE='mp:migrated-template-v7';
    if(localStorage.getItem(DONE))return;
    const V6='mp:prompt-template-v6',V7=KEYS.promptTemplate;
    const oldV6=localStorage.getItem(V6);
    const hasV7=localStorage.getItem(V7)!=null;
    if(oldV6!=null&&!hasV7){
      let parsed;try{parsed=JSON.parse(oldV6)}catch(e){parsed=oldV6}
      const oldText=typeof parsed==='string'?parsed:'';
      if(oldText&&_djb2(oldText)===PREV_TEMPLATE_V6_HASH){
        // pristine v6 default: adopt the new v7 configurable-store default (no user edits to preserve)
        _pendingUpgradeToast='Prompt template upgraded — your store list is now configurable in Preferences.';
      }else if(oldText){
        // hand-edited: carry the user's template forward under the new key, untouched
        try{localStorage.setItem(V7,JSON.stringify(oldText))}catch(e){}
      }
    }
    try{localStorage.removeItem(V6)}catch(e){}
    localStorage.setItem(DONE,'1');
  }catch(e){/* migration is best-effort */}
})();

// ═══════════════════════════════════════════════════════════════════════════
// PRICE WATCH (PRISM-08) — read-only projection over S.planHistory
// ═══════════════════════════════════════════════════════════════════════════
// A pure reader: computes a fresh in-memory band/trend model from the household's
// OWN confirmed prices each call and returns an HTML string. ZERO writes — never
// mutates S.*, localStorage, or checkedItems (no new KEYS entry, no template/key
// bump). The sparse-history floor holds on its own: 0 / 1-2 weeks / <3-confirmed /
// all-estimated / mixed-vintage (pre-shelf_life_tier) / malformed history all render
// gracefully, never throw, never render min==max as a trend. Band math + stock-up
// gate per Becquerel (median=lower-of-two, pooled cross-store band with store-on-low,
// tier-3-only stock-up, most-recent non-null tier join); latest-vs-typical delta
// colours per Lens's dead-band thresholds. Every pasted item/store name goes through
// esc() before insertion (names are untrusted pasted-Claude JSON).
function pwNorm(s){return String(s==null?'':s).trim().toLowerCase();}

// Lower-of-two median (Becquerel 1b: a real observed price, deterministic, safe delta
// direction). Odd count → the single central value.
function pwMedian(nums){
  const a=nums.slice().sort((x,y)=>x-y);const n=a.length;
  if(n===0)return null;
  return (n%2===1)?a[(n-1)/2]:a[n/2-1];
}

// Latest-vs-typical delta → {color,caret,phrase,mag} (Lens §4c dead-band, first-match
// order). Direction is carried by the caret AND the phrase, never colour alone. Green
// is rationed to the exact recorded floor; the ±2% dead-band only softens neutral/amber.
function pwDelta(latest,min,max,median){
  const pctBelow=Math.round(100*(median-latest)/median);
  const pctAbove=Math.round(100*(latest-median)/median);
  if(max-min<=0.005) return {color:'var(--fg)',caret:'–',phrase:'steady — no change yet',mag:''};
  if(latest<=min+0.005) return {color:'var(--green)',caret:'▾',phrase:'your lowest recorded price',mag:(pctBelow>=1?`(${pctBelow}% below typical)`:'')};
  if(latest>median*1.02) return {color:'var(--amber)',caret:'▴',phrase:'above your typical',mag:`(${pctAbove}% above typical)`};
  if(latest<median*0.98) return {color:'var(--fg)',caret:'▾',phrase:'below your typical',mag:`(${pctBelow}% below typical)`};
  return {color:'var(--fg)',caret:'–',phrase:'right around your typical',mag:''};
}

// Stock-up gate (Becquerel Ruling 3, verbatim): fire iff at the recorded floor AND
// provably shelf-stable (tier===3). meals_spanned/category NEVER enter the gate;
// unknown/absent tier → suppress (the Number.isInteger guard).
function pwStockUp(latest,min,tier){return (latest<=min+0.005)&&Number.isInteger(tier)&&tier===3;}

// Build the read-only model from S.planHistory (newest-first; index 0 = most recent).
// Returns {weeksRecorded, ranked:[…≥3 confirmed weeks, sorted best-deal-first],
// building:[…1-2 confirmed weeks]}. Every field read is guarded — old vintages lack
// meals_spanned / shelf_life_tier / metadata, and pasted history may be malformed.
function pwBuildModel(){
  const hist=Array.isArray(S.planHistory)?S.planHistory:[];
  // Shelf-life-tier join: MOST-RECENT non-null wins (newest-first iteration → first
  // seen is freshest; captures a later tier correction, ignores stale/null vintages).
  const tierMap={};
  for(let wi=0;wi<hist.length;wi++){
    const e=hist[wi];
    const mp=(e&&e.plan&&Array.isArray(e.plan.meal_plan))?e.plan.meal_plan:[];
    for(const day of mp){
      const ings=(day&&day.dinner&&Array.isArray(day.dinner.ingredients))?day.dinner.ingredients:[];
      for(const ing of ings){
        if(!ing||typeof ing!=='object')continue;
        const t=ing.shelf_life_tier;
        if(Number.isInteger(t)&&t>=0&&t<=3){const k=pwNorm(ing.item);if(k&&!(k in tierMap))tierMap[k]=t;}
      }
    }
  }
  // Flatten confirmed observations (drop estimated/null-price entirely), group by norm name.
  const groups={};
  for(let wi=0;wi<hist.length;wi++){
    const e=hist[wi];
    const sl=(e&&e.plan&&Array.isArray(e.plan.shopping_list))?e.plan.shopping_list:[];
    for(const it of sl){
      if(!it||typeof it!=='object')continue;
      const price=toNum(it.price);
      // Geiger F6: drop non-positive prices — a stray -/0 in a hand-edited or corrupted
      // backup is a data error, not a real trough; it must never render a negative-dollar
      // band or a false "your lowest recorded price."
      if(price==null||!Number.isFinite(price)||price<=0||it.price_type!=='confirmed')continue;
      const key=pwNorm(it.item);if(!key)continue;
      let g=groups[key];
      if(!g){g=groups[key]={key,points:[],weeks:new Set(),display:String(it.item==null?'':it.item),displayWi:wi};}
      g.points.push({price,wi,store:(it.store!=null?String(it.store):'')});
      g.weeks.add(wi);
      if(wi<g.displayWi){g.displayWi=wi;g.display=String(it.item==null?'':it.item);} // freshest label wins
    }
  }
  const ranked=[],building=[];
  for(const key of Object.keys(groups)){
    const g=groups[key];
    const prices=g.points.map(p=>p.price);
    const weeks=g.weeks.size;
    if(weeks>=3){
      const min=Math.min(...prices),max=Math.max(...prices),median=pwMedian(prices);
      const smWi=g.displayWi; // smallest (newest) week index in the group
      const latest=Math.min(...g.points.filter(p=>p.wi===smWi).map(p=>p.price)); // best price that week
      let lowStore='',lowWi=Infinity;
      for(const p of g.points){if(p.price===min&&p.wi<lowWi){lowWi=p.wi;lowStore=p.store;}} // most-recent low's store
      const tier=tierMap[key];
      const delta=pwDelta(latest,min,max,median);
      ranked.push({key,display:g.display,weeks,min,max,median,latest,lowStore,tier,delta,
        signal:(median-latest)/median,
        fireStockUp:pwStockUp(latest,min,tier) && (max-min>0.005),
        freshNote:(latest<=min+0.005)&&Number.isInteger(tier)&&tier<3&&(max-min>0.005)});
    }else{ // 1-2 confirmed weeks — building history: NEVER a band/colour/trend
      building.push({key,display:g.display,weeks,min:Math.min(...prices),max:Math.max(...prices)});
    }
  }
  ranked.sort((a,b)=>(b.signal-a.signal)||(b.weeks-a.weeks)||(a.display<b.display?-1:a.display>b.display?1:0));
  building.sort((a,b)=>(b.weeks-a.weeks)||(a.display<b.display?-1:a.display>b.display?1:0));
  return {weeksRecorded:hist.length,ranked,building};
}

// One muted building-history row (1-2 weeks; never a band, colour, or stock-up note).
function pwBuildingRow(b){
  if(b.weeks===1) return `<div style="font-size:12px;color:var(--fg3);padding:4px 0"><span style="color:var(--fg2)">${esc(b.display)}</span> · first recorded price $${n2(b.min)}</div>`;
  return `<div style="font-size:12px;color:var(--fg3);padding:4px 0"><span style="color:var(--fg2)">${esc(b.display)}</span> · $${n2(b.min)}–$${n2(b.max)} over 2 weeks · not enough for a trend yet</div>`;
}

// One ranked watch card (§4b-4e). No coloured border, ever; colour appears only on the
// delta line and the band-bar dot (which reuses the same delta colour so they agree).
function pwCard(m){
  const d=m.delta;
  const bandBar=(m.max>m.min)
    ? `<div style="position:relative;height:4px;border-radius:2px;background:var(--border);max-width:220px;margin-top:8px"><div style="position:absolute;top:-2px;width:8px;height:8px;border-radius:50%;background:${d.color};left:${Math.round(((m.latest-m.min)/(m.max-m.min))*100)}%;transform:translateX(-50%)"></div></div>`
    : '';
  let note='';
  if(m.fireStockUp){
    note=`<div style="font-size:11px;line-height:1.5;color:var(--fg2);margin-top:8px"><span style="color:var(--green)">●</span> Cheapest you've recorded — stock up if it keeps.</div>`;
  }else if(m.freshNote){
    note=`<div style="font-size:11px;color:var(--fg3);margin-top:8px">Good week to buy it fresh.</div>`;
  }
  return `<div class="card" style="padding:14px;max-width:640px">
    <div class="flex justify-between items-center">
      <span style="font-weight:600;color:var(--fg);font-size:13px">${esc(m.display)}</span>
      <span style="font-size:11px;color:var(--fg3);white-space:nowrap">${m.weeks} weeks</span>
    </div>
    <div style="margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
      <span style="font-size:16px;font-weight:700;color:${d.color}">${d.caret} $${n2(m.latest)}</span>
      <span style="font-size:12px;color:${d.color}">${d.phrase}</span>
      ${d.mag&&m.weeks>=5?`<span style="font-size:11px;color:var(--fg3)">${d.mag}</span>`:''}
    </div>
    <div style="font-size:11px;color:var(--fg3);margin-top:8px">low $${n2(m.min)}${m.lowStore?` <span style="color:var(--fg4)">(${esc(m.lowStore)})</span>`:''} · typ $${n2(m.median)} · high $${n2(m.max)}</div>
    ${bandBar}
    ${note}
  </div>`;
}

// The Price Watch view (States A/B/D). Always renders the header first, then branches;
// wrapped by render()'s try/catch, but the sparse floor holds on its own (§6 AC-13).
function renderPriceWatch(){
  const weeks=Array.isArray(S.planHistory)?S.planHistory.length:0;
  const s=weeks===1?'':'s';
  // Re-openable "How this works" explainer (via reentryBtn's showOnboarding()) renders
  // in-context on the Prices tab, mirroring renderDashboard's placement (after the header,
  // before content). Pure static copy — no S/localStorage write from this render path.
  const exp=S.showOnboarding?renderOnboardingExplainer():'';
  // State A — 0 entries: full empty state mirroring the dashboard no-plan idiom.
  if(weeks===0){
    return `<div class="section-title flex justify-between items-center flex-wrap gap-8"><div><h2>Price Watch</h2><div class="sub">Your price record is empty.</div></div>${reentryBtn()}</div>${exp}
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46vh;text-align:center">
      <div style="font-size:48px;margin-bottom:16px;opacity:.3">⇅</div>
      <div class="section-title"><h2>No price history yet</h2>
        <div class="sub">Price trends appear once you've imported a few weeks — each item needs a confirmed price in at least 3 different weeks. Import this week's plan to start your price record.</div></div>
      <div class="flex gap-10" style="flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary" data-nav="review">Start Weekly Review</button>
        <button class="btn btn-default" onclick="loadMock();nav('import')">Load Sample Plan</button>
      </div>
    </div>`;
  }
  const model=pwBuildModel();
  const header=`<div class="section-title flex justify-between items-center flex-wrap gap-8"><div><h2>Price Watch</h2><div class="sub">Trends from your household's own confirmed prices · ${weeks} week${s} recorded</div></div>${reentryBtn()}</div>`;
  // State B — history exists but no item has ≥3 confirmed weeks yet.
  if(model.ranked.length===0){
    // Lens F3: floor-framed (not the stale "3-4 weeks in" calendar promise), plus a live
    // accrual hint derived from the item closest to the 3-week floor (building is sorted
    // weeks-desc). Guard: no confirmed observations yet (building empty) → floor line only.
    const top=model.building[0];
    const hint=top?` You're closest on <b style="color:var(--fg)">${esc(top.display)}</b> — ${top.weeks}/3 weeks.`:'';
    const panel=`<div class="card"><div style="font-size:12px;color:var(--fg2);line-height:1.6">You've imported <b style="color:var(--fg)">${weeks}</b> week${s} so far. A price trend and any stock-up hint appear once an item has a confirmed price in <b style="color:var(--fg)">3 different weeks</b>.${hint}</div></div>`;
    const rows=model.building.length?`<div class="card">${model.building.map(pwBuildingRow).join('')}</div>`:'';
    return header+exp+panel+rows;
  }
  // State D — populated: quiet legend, ranked cards, then any building-history tail.
  const legend=`<div style="font-size:10px;color:var(--fg3);margin:-8px 0 16px;display:flex;gap:14px;flex-wrap:wrap"><span style="color:var(--green)">▾ at/below your low</span><span>▾ below typical</span><span style="color:var(--amber)">▴ above typical</span></div>`;
  const cards=model.ranked.map(pwCard).join('');
  const buildingBlock=model.building.length
    ? `<div class="section-title" style="margin-top:20px"><h2 style="font-size:14px">Building your record</h2><div class="sub">Items with fewer than 3 confirmed weeks — no trend yet.</div></div><div class="card">${model.building.map(pwBuildingRow).join('')}</div>`
    : '';
  return header+exp+legend+cards+buildingBlock;
}

// Error boundary: one malformed field in state/plan must not brick the whole app.
// On any exception in a screen renderer, show an in-UI recovery panel (never a white
// screen) that explains the data couldn't be rendered and offers the scoped reset.
function render(){
  try{
    renderNav();
    const main=document.getElementById('main');
    switch(S.screen){
      case 'dashboard':main.innerHTML=renderDashboard();break;
      case 'pantry':main.innerHTML=renderPantry();break;
      case 'review':main.innerHTML=renderReview();break;
      case 'generate':main.innerHTML=renderGenerate();break;
      case 'import':main.innerHTML=renderImport();break;
      case 'preferences':main.innerHTML=renderPreferences();break;
      case 'pricewatch':main.innerHTML=renderPriceWatch();break;
      case 'consumption':main.innerHTML='<div style="color:var(--fg4);padding:40px;text-align:center">Consumption Log — Coming in Phase 3</div>';break;
    }
    bindEvents();
  }catch(err){
    try{console.error('render failed',err);}catch(e){}
    renderRecoveryPanel(err);
  }
}

// In-UI recovery panel shown when a screen renderer throws. Reuses the app's amber ⚠
// idiom. Offers the scoped "Reset app data" as the escape hatch. Built with plain DOM
// writes (not the failing renderers) so it can't itself throw on the same bad state.
function renderRecoveryPanel(err){
  const main=document.getElementById('main');
  if(!main)return;
  const msg=(err&&err.message)?String(err.message):'unknown error';
  main.innerHTML=`<div class="card" style="border-color:#92400e;background:#1c1206;max-width:560px;margin:24px auto">
    <div class="flex gap-10" style="align-items:flex-start">
      <span style="font-size:20px;flex-shrink:0">⚠</span>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:700;color:var(--amber);margin-bottom:6px">This screen couldn't be displayed</div>
        <div style="font-size:12px;color:#fde68a;line-height:1.6;margin-bottom:10px">Some of your saved data looks malformed, so this view failed to render. Your other data is untouched. Try switching to another screen, or reset this app's data to clear the bad state (this only clears weekly-feast's own storage).</div>
        <div style="font-size:10px;color:var(--fg3);margin-bottom:14px;word-break:break-word">Details: ${esc(msg)}</div>
        <div class="flex gap-8 flex-wrap">
          <button class="btn btn-default" onclick="S.screen='dashboard';render()" style="width:auto">Go to Dashboard</button>
          <button class="btn btn-danger" onclick="resetAppData()" style="width:auto">Reset app data</button>
        </div>
      </div>
    </div></div>`;
  try{renderNav();}catch(e){}
}

// Scoped hard reset: clear ONLY this app's mp:* localStorage keys and reload. Behind a
// confirm(). Keeps unrelated localStorage (other apps on file://) intact.
function resetAppData(){
  if(!confirm('Reset weekly-feast? This permanently clears ALL of this app\'s data (pantry, preferences, plans, history, template) from this browser. Other sites are unaffected. This cannot be undone — export a backup first if you want to keep your data.'))return;
  try{
    const kill=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('mp:')===0)kill.push(k);}
    kill.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  }catch(e){}
  try{location.reload();}catch(e){}
}

}

// ─── Onboarding / next-step shared components (P0-2 · loop discoverability) ──
// Step-number badge shared by the Generate next-step panel (Surface 1) and the
// dashboard explainer (Surface 2), so the two surfaces read as one system. Mirrors
// the .progress .bar active/inactive logic: pending = blue number, done = green ✓.
// aria-hidden — the step state is also carried in the adjacent copy, so the badge

function stepBadge(label,done){

    : `<span aria-hidden="true" style="${base};background:#1e293b;color:var(--blue)">${label}</span>`;
}

// SURFACE 1 — persistent next-step panel, rendered ALWAYS on the Generate screen
// below the prompt card. Step 1's badge is the only stateful one: it flips to green ✓
// once S.promptCopied is set (in copyPrompt). Steps 2–3 stay pending blue.
function renderNextStepPanel(){
  const copied=!!S.promptCopied;
  const step1sub=copied?"Copied ✓ — it's on your clipboard.":"The full prompt is ready — hit Copy to Clipboard.";
  return `<div class="card" style="border-color:#0369a133">

// ─── Dashboard ──────────────────────────────────────────────────────────────
function renderDashboard(){
  const plan=S.currentPlan;
  if(!plan){
    // Explainer auto-shows on first run (mp:onboarded-v1 unset); "How this works" forces it via S.showOnboarding.
    const showExp=S.showOnboarding||!load(KEYS.onboarded,false);
    let h=`<div class="section-title flex justify-between items-center flex-wrap gap-8" style="margin-bottom:12px"><div style="font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px">Dashboard</div>${reentryBtn()}</div>`;
    if(showExp)h+=renderOnboardingExplainer();
    h+=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46vh;text-align:center">
      <div style="font-size:48px;margin-bottom:16px;opacity:.3">◉</div>
      <div class="section-title"><h2>No Meal Plan Yet</h2><div class="sub">Start by reviewing your pantry and generating a prompt for Claude.</div></div>
      <div class="flex gap-10" style="flex-wrap:wrap;justify-content:center"><button class="btn btn-primary" data-nav="review">Start Weekly Review</button><button class="btn btn-default" onclick="loadMock();nav('import')">Load Sample Plan</button></div></div>`;
    return h;
  }
  const{meal_plan:mp=[],shopping_list:sl=[],cost_summary:cs={},metadata:md={},pantry_alerts:pa=[],nutrition_summary:ns=null}=plan;
  const byStore={};sl.forEach((item,i)=>{const s=item.store||'Other';if(!byStore[s])byStore[s]=[];byStore[s].push({...item,_gi:i})});
  const cc=Object.values(S.checkedItems).filter(Boolean).length;
  const conf=md.stores_confirmed||[],est=md.stores_estimated||[];

  let h=`<div class="section-title flex justify-between items-center flex-wrap gap-8"><div><h2>This Week's Meal Plan</h2><div class="sub">Plan for ${esc(md.plan_date||'this week')} · ${md.household_size||'?'} people · ${md.plan_days||7} days</div></div>${reentryBtn()}</div>`;
  // Re-openable explainer (via "How this works") also surfaces on the populated dashboard.
  if(S.showOnboarding)h+=renderOnboardingExplainer();

  // Low confidence
  if(md.confidence==='low') h+=`<div class="card" style="border-color:#92400e;background:#1c1206"><div class="flex gap-10" style="align-items:flex-start"><span style="font-size:18px">⚠</span><div><div style="font-size:12px;font-weight:700;color:var(--amber);margin-bottom:4px">LOW CONFIDENCE PLAN</div><div style="font-size:11px;color:#fde68a;line-height:1.5">This plan relies heavily on estimated pricing because current ad data was limited. Verify prices before shopping.</div></div></div></div>`;

  // Pantry alerts
  if(pa.length) h+=`<div class="card" style="border-color:#854d0e;background:#1a1506"><div style="font-size:11px;font-weight:600;color:var(--amber);margin-bottom:8px">⚠ PANTRY ALERTS</div>${pa.map(a=>`<div class="flex gap-8" style="font-size:12px;margin-bottom:6px;line-height:1.5"><span style="color:#f59e0b;font-weight:700;white-space:nowrap;flex-shrink:0">${esc(a.item)}:</span><span style="color:#fde68a">${esc(a.concern)}</span></div>`).join('')}</div>`;

  // Cost summary
  h+=`<div class="card flex gap-24 items-center flex-wrap">
    <div><div style="font-size:10px;color:var(--fg3);text-transform:uppercase">Total Estimated</div><div style="font-size:22px;font-weight:700;color:var(--blue)">$${n2(cs.total_estimated)}</div></div>
    <div><div style="font-size:10px;color:var(--fg3);text-transform:uppercase">Per Person / Day</div><div style="font-size:22px;font-weight:700;color:var(--green)">$${n2(cs.per_person_per_day)}</div></div>
    ${cs.by_store?Object.entries(cs.by_store).map(([s,a])=>`<div><div style="font-size:10px;color:var(--fg3)">${esc(s)}</div><div style="font-size:14px;font-weight:600;color:var(--fg2)">$${n2(a)}</div></div>`).join(''):''}
    ${(conf.length||est.length)?`<div style="width:100%;padding-top:6px;border-top:1px solid var(--border);font-size:10px;color:var(--fg3)">${conf.length?'Confirmed: '+esc(conf.join(', ')):''}${conf.length&&est.length?' · ':''}${est.length?'<span style="color:var(--amber)">Estimated: '+esc(est.join(', '))+'</span>':''}</div>`:''}
  </div>`;

  // Weekly nutrition — plain informational line (MyPlate weekly frame). Minimal by
  // design: a designed affect-bearing quality strip is a deferred, Marshaling-gated item.
  if(ns){
    const bits=[];
    if(Array.isArray(ns.protein_sources)&&ns.protein_sources.length)bits.push('Proteins: '+esc(ns.protein_sources.join(', ')));
    if(Array.isArray(ns.veg_subgroups)&&ns.veg_subgroups.length)bits.push('Veg groups: '+esc(ns.veg_subgroups.join(', ')));
    if(ns.seafood_servings!=null)bits.push('Seafood: '+esc(String(ns.seafood_servings))+'/wk');
    bits.push('Produce ~half the plate: '+(ns.produce_half_plate?'yes':'no'));
    const sf=Array.isArray(ns.shortfalls)?ns.shortfalls.filter(x=>x!=null&&String(x).trim()):[];
    const sfHtml=sf.length?`<div style="color:var(--amber);font-weight:600;margin-top:6px">⚠ Nutrition shortfalls this week:</div>${sf.map(x=>`<div style="color:#fde68a;margin-top:2px">• ${esc(String(x))}</div>`).join('')}`:'';
    h+=`<div class="card" style="padding:12px 16px"><div style="font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Weekly nutrition (MyPlate frame — general guidance)</div><div style="font-size:11px;color:var(--fg2);line-height:1.6">${bits.join(' · ')}${sfHtml}${ns.notes?`<div style="color:var(--fg3);margin-top:3px">${esc(ns.notes)}</div>`:''}</div></div>`;
  }

  // Shopping list first on both mobile and desktop — it's the active working area
  h+=renderShoppingSection(sl,byStore,cc);
  h+=renderMealCards(mp);
  // Reflective epilogue — the "why" you read after the "what". Last on the populated dashboard.
  h+=renderWhyPlanCard(plan);
  return h;
}

// "Why this plan" — a quiet, neutral, collapsed-by-default disclosure card carrying Claude's
// post-sentinel narrative (S.whyPlanOpen, ephemeral). Neutral border (no state color); reads
// plan.why_plan directly (NOT the 1136 destructure). Absent narrative → no card at all.
// XSS: the narrative is pasted, untrusted text — esc() every segment BEFORE any <br>/paragraph
// HTML conversion; no Markdown, no raw HTML injection (same as every other free-text field).
function renderWhyPlanCard(plan){
  if(!plan.why_plan)return '';
  const text=String(plan.why_plan);
  const open=!!S.whyPlanOpen;
  const chev=open?'▾':'▸';
  // Teaser: first non-empty line (or first ~90 chars) — a taste, not the whole thing.
  const firstLine=(text.split(/\r?\n/).find(l=>l.trim())||'').trim();
  const teaser=firstLine.length>90?firstLine.slice(0,90).replace(/\s+$/,'')+'…':firstLine;
  const teaserHtml=open?'':`<span style="color:var(--fg3);font-size:11px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(teaser)}</span>`;
  let body='';
  if(open){
    const paras=text.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
    const inner=paras.map((p,idx)=>`<p style="color:var(--fg2);font-size:12px;line-height:1.6;margin-bottom:${idx===paras.length-1?'0':'8px'}">${esc(p).replace(/\r?\n/g,'<br>')}</p>`).join('');
    body=`<div style="max-width:640px;margin-top:10px">${inner}</div>`;
  }
  return `<div class="card" style="border-color:var(--border)">
    <div id="whyplan-header" role="button" tabindex="0" aria-expanded="${open?'true':'false'}" onclick="S.whyPlanOpen=!S.whyPlanOpen;render()" style="display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer">
      <span style="color:var(--fg3);font-size:12px;flex-shrink:0">${chev}</span>
      <span style="color:var(--fg2);font-size:12px;font-weight:600;flex-shrink:0">Why this plan</span>
      ${teaserHtml}
    </div>
    ${body}
  </div>`;
}

// Non-cook night classifier — leftovers first (common case), then eat-out, else neutral catch-all.
// Never returns null: every non-cook night gets a glanceable category pill instead of a broken metadata line.
function noCookPill(name){
  const s=(name||'').toLowerCase();
  if(/leftover/.test(s)) return {text:'Leftovers',glyph:'↻'};
  if(/eat[\s-]?out|take[\s-]?out|takeaway|restaurant|dine|dining|order (in|out)|delivery|pizza night/.test(s)) return {text:'Eat out',glyph:'↗'};
  return {text:'No cook',glyph:'○'};
}
function renderMealCards(mp){
  return `<div class="grid grid-3" style="margin-bottom:24px">${mp.map(day=>{
    const d=day.dinner||{};
    // Non-cook night = placeholder dinner shape: no ingredients, no cost, no source.
    const isNoCook=(!d.ingredients||d.ingredients.length===0)&&d.cost_per_serving==null&&d.source_site==null&&d.source_url==null;
    let dinnerBlock;
    if(isNoCook){
      // Non-cook: title in --fg (blue is reserved for real recipe links), category pill replaces the metadata line.
      const p=noCookPill(d.name);
      dinnerBlock=`<div style="font-weight:600;color:var(--fg);font-size:12px">${esc(d.name)}</div>
        <div style="margin-top:2px"><span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;padding:2px 8px;border-radius:10px;background:#94a3b81a;color:var(--fg2)">${p.glyph} ${esc(p.text)}</span></div>`;
    }else{
      // Cook night: unchanged — blue recipe link (if URL) + source · cost · servings metadata line.
      const su=safeUrl(d.source_url);
      const link=su?`<a href="${esc(su)}" target="_blank" rel="noopener">${esc(d.name)} ↗</a>`:esc(d.name);
      dinnerBlock=`<div style="font-weight:600;color:var(--blue);font-size:12px">${link}</div>
        <div style="font-size:10px;color:var(--fg3);margin-top:2px">${esc(d.source_site)} · $${n2(d.cost_per_serving)}/serving · ${d.servings} servings</div>`;
    }
    return `<div class="card" style="padding:14px">
      <div class="flex justify-between" style="margin-bottom:8px"><span style="font-weight:700;color:#f1f5f9">Day ${day.day}</span><span style="font-size:11px;color:var(--fg3)">${esc(day.date)}</span></div>
      <div style="font-size:11px;color:var(--fg2);margin-bottom:3px"><span style="color:var(--fg3)">B:</span> ${esc(day.breakfast)}</div>
      <div style="font-size:11px;color:var(--fg2);margin-bottom:6px"><span style="color:var(--fg3)">L:</span> ${esc(day.lunch)}</div>
      <div style="border-top:1px solid var(--border);padding-top:6px">
        ${dinnerBlock}
        ${d.perishability_note?`<div style="font-size:10px;color:var(--amber);margin-top:3px">⏱ ${esc(d.perishability_note)}</div>`:''}
        ${(()=>{const cbs=(d.ingredients||[]).map(x=>x&&x.cook_by).filter(Boolean).sort();return cbs.length?`<div style="font-size:10px;color:var(--fg3);margin-top:3px">🍳 cook by ${esc(cbs[0])}</div>`:'';})()}
        ${d.quality_note?`<div style="font-size:10px;color:#a78bfa;margin-top:3px">★ ${esc(d.quality_note)}</div>`:''}
      </div></div>`}).join('')}</div>`;
}

// ─── Pantry ─────────────────────────────────────────────────────────────────
// Shared numeric-disclosure row for all three tiers. Collapsed = quiet chip; open = amount inputs.
// blank ⇒ delete key ⇒ absent (never 0). tier2 emits stopPropagation so editing a number can't flip `have`.
function pantryNumRow(tier,i){
  if(tier==='tier2' && !i.have) return '';                       // amount only meaningful when 'have'
  const hasNum=(typeof i.onHand==='number')||(tier==='tier1'&&typeof i.par==='number');
  const open=hasNum||S.pantryNumOpen[i.id];
  const stop=tier==='tier2'?'event.stopPropagation();':'';        // tier2 card is click-to-toggle
  if(!open){
    const label=tier==='tier3'?'+ exact amount':'+ amount';
    return `<div style="margin-top:6px" ${tier==='tier2'?'onclick="event.stopPropagation()"':''}>`
      +`<button onclick="${stop}togglePantryNum('${i.id}')" style="background:transparent;border:none;`
      +`color:var(--fg4);font-size:10px;cursor:pointer;padding:2px 0;min-height:28px;font-family:var(--font)">${label}</button></div>`;
  }
  const numField=(field,val,lab,tip)=>`<div style="display:flex;flex-direction:column;gap:2px">`
    +`<label title="${tip||''}" style="font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:.4px">${lab}</label>`
    +`<input class="inp" inputmode="decimal" aria-label="${lab}" value="${typeof val==='number'?val:''}" placeholder="—" `
    +`style="width:72px" oninput="updatePantryNum('${tier}','${i.id}','${field}',this.value)"></div>`;
  let fields=numField('onHand',i.onHand,'on hand','');
  if(tier==='tier1') fields+=numField('par',i.par,'par','minimum to keep stocked');
  fields+=`<div style="display:flex;flex-direction:column;gap:2px">`
    +`<label style="font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:.4px">unit</label>`
    +`<input class="inp" list="wf-units" aria-label="unit" value="${esc(i.unit||'')}" placeholder="unit" `
    +`style="width:92px" oninput="updatePantryUnit('${tier}','${i.id}',this.value)"></div>`;
  // collapse control only while open-but-empty; once data exists the row stays put (never hide live data)
  const collapse=!hasNum?`<button onclick="${stop}togglePantryNum('${i.id}')" style="background:transparent;`
    +`border:none;color:var(--fg4);font-size:10px;cursor:pointer;align-self:flex-end;min-height:28px;`
    +`padding:2px 4px;font-family:var(--font)">hide</button>`:'';
  return `<div class="flex flex-wrap gap-8" ${tier==='tier2'?'onclick="event.stopPropagation()"':''} `
    +`style="margin-top:6px;align-items:flex-end">${fields}${collapse}</div>`;
}
function renderPantry(){
  const p=S.pantry,tab=S.pantryTab;
  const counts={tier1:p.tier1.length,tier2:p.tier2.length,tier3:p.tier3.length};
  let h=`<div class="section-title"><h2>Pantry Inventory</h2><div class="sub">Manage your kitchen inventory across three tracking tiers</div></div>`;
  h+=`<div class="flex gap-4" style="margin-bottom:16px;overflow-x:auto">${['tier1','tier2','tier3'].map(t=>`<button class="btn ${tab===t?'btn-primary':'btn-default'}" onclick="S.pantryTab='${t}';render()" style="width:auto;white-space:nowrap;font-size:12px;min-height:36px">Tier ${t[4]} (${counts[t]})</button>`).join('')}</div>`;
  // Shared unit suggestions for every numeric-row unit input (native datalist — degrades to free-text).
  h+=`<datalist id="wf-units"><option value="lb"><option value="oz"><option value="count"><option value="each"><option value="bottle"><option value="jar"><option value="can"><option value="box"><option value="bag"><option value="gallon"><option value="quart"><option value="cup"><option value="dozen"><option value="bunch"><option value="loaf"><option value="block"><option value="container"><option value="pack"></datalist>`;
  h+=`<div class="card flex gap-8 items-center flex-wrap"><input class="inp" id="pantry-name" placeholder="Item name" style="flex:2;min-width:140px"><input class="inp" id="pantry-cat" placeholder="Category (optional)" style="flex:1;min-width:100px"><button class="btn btn-primary" onclick="addPantryItem()" style="width:auto">Add</button></div>`;
  // Per-tier "amounts are optional" helper line — once, under the add-item card, reinforces blank-is-absent.
  const helper={tier1:'Amounts are optional — leave a field blank to plan by status alone.',tier2:'Amounts are optional — leave a field blank to plan by have / need alone.',tier3:'Amounts are optional — leave a field blank to plan by the rough note alone.'};

    else h+=`<div class="grid grid-2">${low.map(i=>`<div class="card flex items-center gap-10"><div style="flex:1"><div style="font-weight:600;font-size:12px">${esc(i.name)}</div><div style="font-size:10px;color:${STATUS_COLORS[i.status]}">${i.status}</div></div><button class="btn btn-success" onclick="restockItem('${i.id}')" style="width:auto;font-size:10px">Restocked</button></div>`).join('')}</div>`;
  }else{
    h+=`<div style="font-weight:700;font-size:14px;color:#f1f5f9;margin-bottom:4px">Step 3: Weekly Items (Tier 2)</div><div style="font-size:11px;color:var(--fg3);margin-bottom:14px">Check off what you currently have.</div>`;
    h+=`<button class="btn btn-default" onclick="resetTier2()" style="margin-bottom:12px;font-size:10px;width:auto">Reset All to "Don't Have"</button>`;
    h+=`<div class="grid grid-2">${p.tier2.map(i=>`<div class="card flex items-center gap-10" style="padding:8px 14px;cursor:pointer" onclick="toggleTier2('${i.id}')"><input type="checkbox" ${i.have?'checked':''} style="accent-color:var(--blue);width:18px;height:18px;pointer-events:none"><span style="font-size:12px;color:${i.have?'var(--fg)':'var(--fg3)'}">${esc(i.name)}</span></div>`).join('')}</div>`;
  }
  h+=`</div>`;
  h+=`<div class="flex justify-between" style="margin-top:16px;flex-wrap:wrap;gap:8px"><button class="btn btn-default" ${step===0?'disabled':''} onclick="S.reviewStep--;render()" style="width:auto">← Previous</button>`;
