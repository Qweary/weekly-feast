// ═══════════════════════════════════════════════════════════════════════════
// PRICE WATCH — read-only projection over S.planHistory
// ═══════════════════════════════════════════════════════════════════════════
// A pure reader: computes a fresh in-memory band/trend model from the household's
// OWN confirmed prices each call and returns an HTML string. ZERO writes — never
// mutates S.*, localStorage, or checkedItems (no new KEYS entry, no template/key
// bump). The sparse-history floor holds on its own: 0 / 1-2 weeks / <3-confirmed /
// all-estimated / mixed-vintage (pre-shelf_life_tier) / malformed history all render
// gracefully, never throw, never render min==max as a trend. Band math + stock-up
// gate (median=lower-of-two, pooled cross-store band with store-on-low,
// tier-3-only stock-up, most-recent non-null tier join); latest-vs-typical delta
// colours per the dead-band thresholds. Every pasted item/store name goes through
// esc() before insertion (names are untrusted pasted-Claude JSON).
// Mass/plural-invariant grocery nouns that slip past the ss/us/is guards and must
// NOT singularize (would false-merge onto a different item). Intentionally tight;
// extend by one line when a real field collision is observed. (E1-S3)
const PW_PLURAL_STOP = new Set(['greens','molasses']);

// Regular English -is plurals to RECOVER (kiwi→kiwis): a tiny, closed, preserve-biased
// allowlist that OVERRIDES the blanket is$ singularize-block for PROVEN regular plurals of
// an -i-ending singular, so the same good spelled kiwi/kiwis pools into ONE honest band.
// No orthographic regex separates kiwis (k-i-w-i-s) from basis (b-a-s-i-s) — BOTH end in "is",
// and kiwis' pre-"is" char 'w' is a consonant just like basis' 's'/iris' 'r' — so [^aeiou]is$
// would still block kiwis (fails its own canonical case). The discriminator MUST be lexical.
// The blanket is$ block STAYS the default: basis/iris/axis/analysis/crisis and every UNKNOWN
// -is word remain SPLIT (the invariant's under-merge-on-doubt side). Only a word listed here
// recovers → this set can NEVER false-merge an unknown -is word by construction. Ships with ONE
// entry; extend by one vetted line only when a real regular -is plural is seen fragmenting in the
// field, never a guess (padding = the over-merge risk). Hard-coded code allowlist like
// PW_PAREN_NOISE/PW_LEADING_CANON — NOT a persisted/user-editable map. (DC-3 / E1-S3-N1)
const PW_IS_RECOVER = new Set(['kiwis']);

// Trailing-paren NOISE tokens: pure packaging-FORM descriptors that name how the
// identical good is bundled, carrying no variety/grade/provenance/prep/price-regime
// signal. These are the ONLY non-size parens pwNorm strips; every other paren
// (variety/cut/grade/provenance/prep, organic/fresh price-regime markers, and any
// UNRECOGNIZED token) is PRESERVED as identity — the invariant's under-merge-on-doubt
// side. Intentionally tiny + preserve-biased; extend by one line when a real benign
// descriptor is observed harmlessly fragmenting in the field. (DC-1)
const PW_PAREN_NOISE = new Set(['loose','bagged','bag']);

// Leading-descriptor canon (DC-2): a tiny, closed, PAIR-SPECIFIC allowlist of redundant
// LEADING modifiers that merely restate a default identity (yellow IS the default storage
// onion; bare "onion" means yellow onion) → collapse to the canonical base so the same good
// spelled long or short pools into ONE honest price band. PHRASE-qualified, NOT a bare-token
// drop: "yellow" is redundant noise on onion but IDENTITY on squash/pepper/corn, so each
// entry is a full proven <phrase → base> pair. Preserve-by-default (the invariant's
// under-merge-on-doubt side); the burden of proof is on ADDING a line, each clearing
// "does the bare name already mean exactly this, with no price-regime shift?". Ships with
// ONE entry; extend by one vetted line, never a guess (padding = the over-merge risk).
// This is a hard-coded code allowlist (like PW_PAREN_NOISE/PW_PLURAL_STOP), NOT a persisted
// or user-editable alias map — no reload-surviving state, no djb2/schema. (DC-2)
const PW_LEADING_CANON = new Map([['yellow onion', 'onion']]);

// DC-4 / S4-N1: UNAMBIGUOUS shelf-stable FORM words (USDA-FSIS shelf-stable =
// moisture-removed OR hermetically sealed). Ambiguous preservation (smoked/cured/pickled/
// fermented) is EXCLUDED — those span refrigerated grocery forms. Growth bar (WATCH): an added
// word must denote shelf-stable with NO refrigerated grocery form.
const PW_KEEPS_FORM = new Set(['canned','tinned','dried','dry','dehydrated','powdered','instant','jarred','bottled']);
// Inherently-shelf-stable pantry STAPLE base-nouns (bare noun ⟹ shelf-stable with certainty).
// Stored in pwNorm-CANONICAL (singularized) form. Seeded with EXACTLY the S13 designated-close
// set (Rice/Flour/Sugar/Pasta/Oats). Growth bar (WATCH DC-4-N1): the bare grocery noun must never
// denote a fresh/perishable item — a mis-add RE-OPENS S4-N1, so add only on observed fragmentation.
const PW_KEEPS_STAPLE = new Set(['rice','flour','sugar','pasta','oat']);

// E1-S5 store-aware typical thresholds (F4). A "structural store gap" is a
// PERSISTENT price difference between stores (a store effect), not week-to-week noise:
// real staple price gaps across store types (warehouse/discount vs conventional) run
// ~10-30% and persist; within-store non-sale noise is a few %. STORE_GAP_PCT separates them.
const PW_STORE_MIN_N   = 2;      // min own NON-SALE points for a store to count as a "pattern"
const PW_STORE_GAP_PCT = 0.08;   // between-store typical spread (÷ pooled median) that is structural
const PW_STOCKUP_DEPTH = 0.18;   // min discount below typical for the stock-up IMPERATIVE (F3a)
const PW_FREEZE_DEPTH  = 0.30;   // min discount below typical for the BUY-AND-FREEZE imperative (F3c) — its OWN constant, > PW_STOCKUP_DEPTH

// E1-S8 reader outlier/sanity clamp (F2 8a). A confirmed price more than a
// factor of 5 off its item's OWN robust median is a data-entry error (extra-digit / missing-
// decimal), not a real shelf event — a real single-item price lives within ~[0.25x,3x] of its
// typical, a decimal-slip is ~10x. 5 sits in the gap (2x log-margin each edge); §1.2 grounding.
const PW_OUTLIER_HI = 5;      // confirmed price > 5x own robust median ⇒ data-entry error (extra digit); F2 §1.2
const PW_OUTLIER_LO = 0.2;    // NON-SALE confirmed price < 1/5 own robust median ⇒ data-entry error (missing decimal); §1.2

// Name-fold (E1-S3): trim+lowercase, then (A) FACET-AWARE trailing-paren handling (DC-1) —
// default PRESERVE the paren as identity (apple (gala) ≠ apple (fuji)), stripping ONLY a
// size / known pure-form noise / empty paren onto the head; then (B) singularize-lite —
// drop ONE trailing 's' from the LAST token, guarded so it never false-merges (greens↛green,
// molasses↛molasse, chicken breast≠chicken thigh, two different tuna(…) SIZES stay distinct);
// then (C) leading-modifier phrase-canon (DC-2, PW_LEADING_CANON) — collapse an allowlisted
// redundant leading modifier onto its canonical base ("yellow onion"→"onion"). Feeds BOTH the
// Price-Watch grouping key and the recipe tier-join key. Size parens are KEPT on purpose —
// that leaves the tuna cross-list reconciliation to S4 (its [PENDING-E1] guard stays pending).
// Read-path only; no schema.
function pwNorm(s){
  let x = String(s==null?'':s).trim().toLowerCase();
  if(!x) return x;
  // (A) DC-1 FACET-AWARE trailing-parenthetical handling. Precedence; default = PRESERVE
  // (invariant: a safe under-merge beats an unsafe over-merge). Only a SIZE paren or a
  // KNOWN pure-form noise paren (or an empty paren) collapses onto the head; a variety/
  // grade/provenance/prep/organic/fresh/unknown paren stays part of the identity key so
  // two genuinely different products (apple (gala) ≠ apple (fuji)) keep distinct bands.
  const pm = x.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
  if(pm){
    const inner = pm[2].trim();
    const head  = pm[1].trim();
    const hasSize = /\d/.test(inner) ||
      /\b(oz|ozs|ounce|ounces|lb|lbs|pound|pounds|g|gram|grams|kg|kgs|ml|l|liter|liters|litre|litres|ct|count|pk|pack|packs|pkg|dozen|dz|qt|quart|quarts|pt|pint|pints|gal|gallon|gallons)\b/.test(inner);
    // KEEP WHOLE a size paren (distinct sizes never pool — S12; also handles (2 lb gala)).
    // STRIP only an empty paren or a known pure-form noise word, and only if a non-empty
    // head remains (never manufacture an empty key). PRESERVE everything else as a facet.
    if(!hasSize && head && (inner === '' || PW_PAREN_NOISE.has(inner))) x = head;
  }
  // (B) singularize-lite — strip ONE trailing 's' from the LAST whitespace token, guarded;
  //     PW_IS_RECOVER (DC-3) overrides the blanket is$ block for proven regular -is plurals (kiwis→kiwi)
  const parts = x.split(/\s+/);
  const last = parts[parts.length-1];
  if(last.length>=4 && last.charAt(last.length-1)==='s'
     && (!/(ss|us|is)$/.test(last) || PW_IS_RECOVER.has(last))
     && !PW_PLURAL_STOP.has(last)){
    parts[parts.length-1] = last.slice(0,-1);
    x = parts.join(' ');
  }
  // (C) DC-2 leading-descriptor canon. Runs AFTER (B) so the key is already singular. EXACT
  // full-string match only — a size-paren-bearing string ("yellow onion (2 lb)") never matches
  // a bare key, so the collapse never pools across sizes; that residual is left to AC-L4's
  // display-dedup (never a band pool). Only the allowlisted redundant-prefix phrases collapse;
  // every variety/grade/prep/product leading modifier (red/green/sweet/baby/boneless/large/
  // whole) preserves — the invariant's under-merge-on-doubt side.
  if(PW_LEADING_CANON.has(x)) x = PW_LEADING_CANON.get(x);
  return x;
}

// Join-only derived key (E1-S4): strip a trailing SIZE paren from an
// already-pwNorm'd key and re-normalize the exposed head, so a recipe tier key that
// carries a size paren (canned tuna (5 oz)) can reconcile onto a bare shopping group
// key (canned tuna) WITHOUT ever loosening pwNorm (which would re-merge tuna 5oz/12oz
// in the GROUPING key — S12's size-distinct guard). Uses pwNorm's OWN size test so it
// removes ONLY what pwNorm chose to keep. Read-path only.
function pwBaseKey(k){
  const m = String(k==null?'':k).match(/^(.*?)\s*\(([^()]*)\)\s*$/);
  if(m){
    const inner = m[2];
    const hasSize = /\d/.test(inner) ||
      /\b(oz|ozs|ounce|ounces|lb|lbs|pound|pounds|g|gram|grams|kg|kgs|ml|l|liter|liters|litre|litres|ct|count|pk|pack|packs|pkg|dozen|dz|qt|quart|quarts|pt|pint|pints|gal|gallon|gallons)\b/.test(inner);
    const head = m[1].trim();
    if(hasSize && head) return pwNorm(head);   // strip size paren; RE-NORMALIZE the exposed head
  }
  return k;                                      // no trailing size paren → base == k
}

// Shelf-stable AFFIRMATION for the DC-4 / S4-N1 category-agreement guard. Answers ONE
// question: does the bare shopping item's OWN NAME affirm it is shelf-stable ("keeps"), so a
// recipe-derived tier-3 may be inherited across the base-fallback? TRUE only on an UNAMBIGUOUS
// signal in the name itself — a shelf-stable FORM word (canned/dried/…) OR a certified pantry
// STAPLE noun (rice/flour/…). Everything else → FALSE → the tier-3 inheritance is suppressed to
// inert (the arc invariant's under-merge-on-ambiguity side). Operates on an already-pwNorm'd key.
// Read-path only, pure string→bool.
function pwKeeps(k){
  const s = String(k==null?'':k).trim();
  if(!s) return false;
  for(const w of s.split(/\s+/)){ if(PW_KEEPS_FORM.has(w)) return true; }  // any shelf-stable FORM word
  return PW_KEEPS_STAPLE.has(s);                                          // OR whole-name inherently-shelf-stable staple
}

// AC-L4 near-twin projection (DC-2).
// The SAME PW_LEADING_CANON collapse, reaching THROUGH a trailing paren so two ranked cards
// that are the same good at the same size but escaped step (C)'s exact-bare match
// ("yellow onion (2 lb)" vs "onion (2 lb)") map to ONE near-twin key. Keys off POST-CANON
// IDENTITY, never surface similarity: heads NOT in the map (apple, red onion, sweet potato,
// boneless chicken breast) return unchanged → their leadKey == their key → they stay DISTINCT
// → AC-L4 LEAVES them. Bounded by the SAME tiny allowlist as the merge → cannot over-suppress
// a good the domain has not certified identical. Display-dedup only; NEVER pools bands.
function pwLeadKey(k){
  const s = String(k==null?'':k);
  const m = s.match(/^(.*?)\s*(\([^()]*\))\s*$/);   // split off a trailing paren, if any
  const head = m ? m[1].trim() : s.trim();
  const suf  = m ? (' ' + m[2]) : '';               // re-attach the paren verbatim (size stays distinct)
  return (PW_LEADING_CANON.has(head) ? PW_LEADING_CANON.get(head) : head) + suf;
}

// Lower-of-two median (1b: a real observed price, deterministic, safe delta
// direction). Odd count → the single central value.
function pwMedian(nums){
  const a=nums.slice().sort((x,y)=>x-y);const n=a.length;
  if(n===0)return null;
  return (n%2===1)?a[(n-1)/2]:a[n/2-1];
}

// Latest-vs-typical delta → {color,caret,phrase,mag} (§4c dead-band, first-match
// order). Direction is carried by the caret AND the phrase, never colour alone. Green
// is rationed to the exact recorded floor; the ±2% dead-band only softens neutral/amber.
function pwDelta(latest,min,max,median,band){
  const b=(Number.isFinite(band)&&band>0)?band:0.02;   // default = today's ±2%
  const pctBelow=Math.round(100*(median-latest)/median);
  const pctAbove=Math.round(100*(latest-median)/median);
  if(max-min<=0.005) return {color:'var(--fg)',caret:'–',phrase:'steady — no change yet',mag:''};
  if(latest<=min+0.005) return {color:'var(--green)',caret:'▾',phrase:'your lowest recorded price',mag:(pctBelow>=1?`(${pctBelow}% below typical)`:'')};
  if(latest>median*(1+b)) return {color:'var(--amber)',caret:'▴',phrase:'above your typical',mag:`(${pctAbove}% above typical)`};
  if(latest<median*(1-b)) return {color:'var(--fg)',caret:'▾',phrase:'below your typical',mag:`(${pctBelow}% below typical)`};
  return {color:'var(--fg)',caret:'–',phrase:'right around your typical',mag:''};
}

// Stock-up gate (Ruling 3, verbatim): fire iff at the recorded floor AND
// provably shelf-stable (tier===3). meals_spanned/category NEVER enter the gate;
// unknown/absent tier → suppress (the Number.isInteger guard).
function pwStockUp(latest,min,tier){return (latest<=min+0.005)&&Number.isInteger(tier)&&tier===3;}

// Store-aware typical classifier (E1-S5 / F4): given a group's points, the LATEST
// observation's store, and the pooled non-sale median, decide whether the stores are
// STRUCTURALLY different (a persistent gap, not noise) and, if so, return the latest store's
// OWN cut-line + floor operands. Pure; no writes. Returns one of:
//   {mode:'pooled'}                                             → caller keeps byte-identical behavior
//   {mode:'suppress', medians, sLatest}                         → gap, but latest store too thin → non-verdict
//   {mode:'perstore', sLatest, medians, typical, sWeeks, sMin, sMax, sDisp}
// typical = latest store's NON-SALE median (composes with F1); sMin/sMax over that store's ALL
// points (incl sale — a real sale IS a trough, mirrors the pooled floor); sDisp/sWeeks feed the
// per-store F6b dead-band. Min/max stay POOLED at the call site (green/steady unchanged).
function pwStoreAware(points, sLatest, pooledMedian){
  const byNon={}, byAll={};
  for(const p of points){
    const s=p.store||'';
    (byAll[s]||(byAll[s]=[])).push(p.price);
    if(p.category!=='sale')(byNon[s]||(byNon[s]=[])).push(p.price);
  }
  const qual=Object.keys(byNon).filter(s=>byNon[s].length>=PW_STORE_MIN_N);
  const medians={};
  for(const s of qual) medians[s]=pwMedian(byNon[s]);
  let gap=false;
  if(qual.length>=2 && pooledMedian>0){
    const ms=qual.map(s=>medians[s]);
    if((Math.max(...ms)-Math.min(...ms))/pooledMedian >= PW_STORE_GAP_PCT) gap=true;
  }
  if(!gap) return {mode:'pooled'};
  const nonL=byNon[sLatest]||[], allL=byAll[sLatest]||[];
  if(nonL.length<PW_STORE_MIN_N) return {mode:'suppress', medians, sLatest};
  const t=pwMedian(nonL);
  return {mode:'perstore', sLatest, medians, typical:t, sWeeks:nonL.length,
          sMin:Math.min(...allL), sMax:Math.max(...allL),
          sDisp:(Math.max(...nonL)-Math.min(...nonL))/t};
}

// Nth-newest distinct-week best (min) price on an optional store substrate.
// n=1 → the 2nd-newest wi after smWi (the "prior confirmed point"); n=2 → 3rd-newest.
// storeFilter: a non-empty string restricts to that store's own points (F4 store-
// consistency); '' / null → pooled. Returns null when that rank is absent → caller
// treats it as "trend unknowable" (not-declining). Pure; never throws.
function pwPriorLow(points, smWi, storeFilter, n){
  const wis=[];
  for(const p of points){
    if(storeFilter && (p.store||'')!==storeFilter) continue;
    if(p.wi>smWi && wis.indexOf(p.wi)===-1) wis.push(p.wi);
  }
  wis.sort((a,b)=>a-b);
  const targetWi=wis[n-1];
  if(targetWi===undefined) return null;
  let lo=Infinity;
  for(const p of points){
    if(storeFilter && (p.store||'')!==storeFilter) continue;
    if(p.wi===targetWi && p.price<lo) lo=p.price;
  }
  return Number.isFinite(lo)?lo:null;
}

// Build the read-only model from S.planHistory (newest-first; index 0 = most recent).
// Returns {weeksRecorded, ranked:[…≥3 confirmed weeks, sorted best-deal-first],
// building:[…1-2 confirmed weeks]}. Every field read is guarded — old vintages lack
// meals_spanned / shelf_life_tier / metadata, and pasted history may be malformed.
function pwBuildModel(){
  const hist=Array.isArray(S.planHistory)?S.planHistory:[];
  // Shelf-life-tier join: MOST-RECENT non-null wins (newest-first iteration → first
  // seen is freshest; captures a later tier correction, ignores stale/null vintages).
  const tierMap={}, freezableMap={};
  for(let wi=0;wi<hist.length;wi++){
    const e=hist[wi];
    const mp=(e&&e.plan&&Array.isArray(e.plan.meal_plan))?e.plan.meal_plan:[];
    for(const day of mp){
      const ings=(day&&day.dinner&&Array.isArray(day.dinner.ingredients))?day.dinner.ingredients:[];
      for(const ing of ings){
        if(!ing||typeof ing!=='object')continue;
        const t=ing.shelf_life_tier;
        if(Number.isInteger(t)&&t>=0&&t<=3){const k=pwNorm(ing.item);if(k&&!(k in tierMap))tierMap[k]=t;}
        const fz=ing.freezable;                                                    // NEW (E1-S7): strict-boolean, most-recent-non-null wins, exact-key only
        if(typeof fz==='boolean'){const k=pwNorm(ing.item);if(k&&!(k in freezableMap))freezableMap[k]=fz;}
      }
    }
  }
  // Base-fallback (E1-S4): reconcile a size-paren-only difference on the SAME base item.
  // Built DOWNSTREAM of tierMap, so Ruling-3 most-recent-non-null-wins is already applied
  // per exact key (composes; never re-opens tier-drift). Two sizes → DIFFERENT tiers → suppress.
  const tierMapBase={}, baseConflict={};
  for(const ek of Object.keys(tierMap)){
    const b=pwBaseKey(ek);
    if(b===ek) continue;                                   // recipe key already bare — exact map covers it
    if(baseConflict[b]) continue;
    if(!(b in tierMapBase)) tierMapBase[b]=tierMap[ek];
    else if(tierMapBase[b]!==tierMap[ek]){ baseConflict[b]=true; delete tierMapBase[b]; }
  }
  // Flatten confirmed observations (drop estimated/null-price entirely), group by norm name.
  const groups={};
  for(let wi=0;wi<hist.length;wi++){
    const e=hist[wi];
    const sl=(e&&e.plan&&Array.isArray(e.plan.shopping_list))?e.plan.shopping_list:[];
    for(const it of sl){
      if(!it||typeof it!=='object')continue;
      const price=toNum(it.price);
      // F6: drop non-positive prices — a stray -/0 in a hand-edited or corrupted
      // backup is a data error, not a real trough; it must never render a negative-dollar
      // band or a false "your lowest recorded price."
      if(price==null||!Number.isFinite(price)||price<=0||it.price_type!=='confirmed')continue;
      const key=pwNorm(it.item);if(!key)continue;
      let g=groups[key];
      if(!g){g=groups[key]={key,points:[],weeks:new Set(),display:String(it.item==null?'':it.item),displayWi:wi};}
      g.points.push({price,wi,store:(it.store!=null?String(it.store):''),category:(it.category!=null?String(it.category):'staple')});
      g.weeks.add(wi);
      if(wi<g.displayWi){g.displayWi=wi;g.display=String(it.item==null?'':it.item);} // freshest label wins
    }
  }
  const ranked=[],building=[];
  for(const key of Object.keys(groups)){
    const g=groups[key];
    // E1-S8 (F2 8a): domain-plausibility clamp — drop confirmed-but-IMPLAUSIBLE
    // prices (fat-finger $299 / missing-decimal $0.29) BEFORE any stat, so they can neither
    // set the floor, saturate the F6b band, nor false-rank. Robust center = median over ALL
    // raw points (survives one outlier at ≥3 weeks). Sale-tagged points are EXEMPT from the
    // LOW bound (a declared sale is an EXPECTED low — trust it, per F1). SILENT: the point is
    // dropped exactly as the L1344 ≤0 guard drops it. Only evaluated at ≥3 raw weeks.
    let pts=g.points;
    if(g.weeks.size>=3){
      const med0=pwMedian(g.points.map(p=>p.price));   // real array element (n≥3) ⇒ its own point (ratio 1.0) always admitted ⇒ pts never empty
      if(med0!=null&&med0>0){                           // degenerate guard: no robust center → no exclusion; med0 is a multiplier (never a divisor) so no ÷0
        pts=g.points.filter(p=>
          !((p.price>med0*PW_OUTLIER_HI) ||
            (p.category!=='sale' && p.price<med0*PW_OUTLIER_LO)));
      }
    }
    const prices=pts.map(p=>p.price);
    const weeks=new Set(pts.map(p=>p.wi)).size;   // clean-week count over the ADMITTED set (may drop below 3 → building)
    if(weeks>=3){
      const min=Math.min(...prices),max=Math.max(...prices);
      const nonSalePrices=pts.filter(p=>p.category!=='sale').map(p=>p.price);   // ← pts (admitted), was g.points
      const anchorArr=nonSalePrices.length?nonSalePrices:prices; // the F1 non-sale anchor array
      const median=pwMedian(anchorArr);
      // F6b: dispersion-aware small-n dead-band. disp = relative spread of the non-sale
      // anchor; band widens the ±2% neutral zone on noisy 3-4-week items, tapering to 2% by 5 weeks.
      const disp=(Math.max(...anchorArr)-Math.min(...anchorArr))/median;
      const taper=Math.max(0,Math.min(1,(5-weeks)/2));
      const band=Math.min(0.35,0.02+taper*0.6*disp);
      const smWi=Math.min(...pts.map(p=>p.wi)); // smallest (newest) ADMITTED week index — recomputed over admitted (outlier-latest safety; E1-S8)
      const latestPts=pts.filter(p=>p.wi===smWi);   // ← pts (admitted), was g.points
      const latest=Math.min(...latestPts.map(p=>p.price)); // best price that week
      let sLatest=''; for(const p of latestPts){if(p.price===latest){sLatest=p.store||'';break;}} // store of the latest point (E1-S5)
      let lowStore='',lowWi=Infinity;
      for(const p of pts){if(p.price===min&&p.wi<lowWi){lowWi=p.wi;lowStore=p.store;}} // most-recent low's store  ← pts (admitted), was g.points
      let tier=tierMap[key];                                    // EXACT match wins — unchanged
      if(tier===undefined && pwBaseKey(key)===key){             // exact miss AND shopping key is SIZE-FREE (the gate)
        const bt=tierMapBase[key];                              // key === its own base here
        // DC-4 / S4-N1 category-agreement guard (Option B): a tier-3 "keeps" may be inherited
        // across the base-fallback ONLY when the bare shopping item's OWN NAME affirms shelf-stable
        // (pwKeeps) — else the inheritance is SUPPRESSED to inert (under-merge on ambiguity closes the
        // false "it keeps" on a possibly-fresh item). Non-tier-3 inheritance is the conservative/
        // perishable direction (drives at most freshNote) and is UNGUARDED. The EXACT path above is the
        // recipe's own ground-truth tier (F5) and is never guarded — S4-N1 is a cross-item
        // base-inheritance defect only.
        if(bt!==undefined && (bt!==3 || pwKeeps(key))) tier=bt;  // reconcile; undefined/ambiguous-keeps → stays inert
      }
      // E1-S5 store-aware typical (F4): when stores are STRUCTURALLY different (a persistent
      // gap, not week-to-week noise), de-pool the typical CUT-LINE + its dead-band onto the latest
      // observation's OWN store, and judge the stock-up/freshNote trough against that store's OWN floor —
      // never the pooled floor, which IS the cheap store's baseline. The pooled min/max (GREEN/steady +
      // record) stay POOLED (pooling boundary). Single store / same-price / thin per-store ⇒ 'pooled' ⇒
      // every value below is byte-identical to pre-S5 (see spec §4).
      const st=pwStoreAware(pts,sLatest,median);   // ← pts (admitted), was g.points
      let dTypical=median, dBand=band, troughMin=min, troughMax=max;
      if(st.mode==='perstore'){
        dTypical=st.typical;
        const t2=Math.max(0,Math.min(1,(5-st.sWeeks)/2));
        dBand=Math.min(0.35,0.02+t2*0.6*st.sDisp);   // dead-band tracks the per-store substrate
        troughMin=st.sMin; troughMax=st.sMax;        // own-store trough, not the pooled floor
      }
      let delta=(st.mode==='suppress')
        ? {color:'var(--fg)',caret:'–',phrase:'prices vary by store',mag:''}  // NON-VERDICT; phrase = AC-L1-S5 (§9)
        : pwDelta(latest,min,max,dTypical,dBand);    // min/max POOLED (green/steady unchanged); typical/band per-store when perstore
      // AC-L2-S5 (green-neutralize on the flat cheap-store baseline — §9): at the pooled floor
      // BUT the latest store's OWN baseline is flat (troughMax/troughMin are the own-store floor in
      // perstore) ⇒ a PLACE signal, not a TIME deal ⇒ neutralize the pooled-floor green to the honest
      // per-store neutral. Complement of the stock-up gate (which needs spread>0.005); a genuine sale
      // (own spread>0) is NOT overridden. Floor VALUES untouched; lowStore still discloses the place-low.
      if(st.mode==='perstore' && latest<=min+0.005 && (troughMax-troughMin<=0.005))
        delta={color:'var(--fg)',caret:'–',phrase:'right around your typical',mag:''};
      const trendStore = (st.mode==='perstore') ? sLatest : null;
      const priorLo  = pwPriorLow(pts, smWi, trendStore, 1);   // ← pts (admitted), was g.points
      const prior2Lo = pwPriorLow(pts, smWi, trendStore, 2);   // ← pts (admitted), was g.points
      // sustained descent: prior2 > prior > latest, each by more than the house 0.005 epsilon.
      const stillFalling = (priorLo!=null && prior2Lo!=null)
        && (latest < priorLo - 0.005) && (priorLo < prior2Lo - 0.005);
      const depthOK = latest <= dTypical*(1-PW_STOCKUP_DEPTH) + 0.005;   // ≥18% below typical (F3a); dTypical>0 guaranteed by L1276 filter
      const stockupCandidate = (st.mode!=='suppress')
        && pwStockUp(latest, troughMin, tier)      // at own-store/pooled floor AND tier===3 (UNCHANGED gate)
        && (troughMax - troughMin > 0.005)           // real spread (UNCHANGED guard)
        && depthOK;                                  // NEW depth floor
      const fireStockUp = stockupCandidate && !stillFalling;   // deep, at-floor, NOT a ramp → imperative
      const trendHold   = stockupCandidate &&  stillFalling;   // deep, at-floor, still-ramping → "no rush"
      // Freeze-buy gate (F3c, verbatim §3.1): DISJOINT from pwStockUp by the tier
      // predicate (freeze needs tier<3, stockup needs tier===3 → never both). freezableMap[key]
      // is strictly-true only (absent/null/non-bool → inert); own constant PW_FREEZE_DEPTH=0.30
      // (deeper hurdle than the 0.18 shelf-stable floor — freezer space is scarce/rivalrous).
      const depthFreezeOK = latest <= dTypical*(1-PW_FREEZE_DEPTH) + 0.005;   // ≥30% below store-aware typical (§2)
      const fireFreeze =
           (st.mode!=='suppress')
        && (latest<=troughMin+0.005)                    // at own-store/pooled floor (mirrors freshNote)
        && (troughMax-troughMin>0.005)                  // real spread — never fire on a flat series
        && (freezableMap[key]===true)                   // the NEW signal, STRICTLY true (§2.1)
        && Number.isInteger(tier) && tier<3             // FRESH — DISJOINT from pwStockUp's tier===3
        && depthFreezeOK
        && !stillFalling;                               // not a live descent (mirrors trendHold/F2)
      ranked.push({key,display:g.display,weeks,min,max,median,latest,lowStore,tier,delta,
        signal:(dTypical-latest)/dTypical,
        fireStockUp,
        trendHold,
        fireFreeze,
        freshNote:(st.mode!=='suppress') && (latest<=troughMin+0.005)&&Number.isInteger(tier)&&tier<3&&(troughMax-troughMin>0.005),
        storeMode:st.mode,
        storeTypical:(st.mode==='perstore'?st.typical:null),
        storeWeeks:(st.mode==='perstore'?st.sWeeks:null),   // AC-L4-S5: own-store n backing the typical (closes S5-N1)
        storeLatest:(st.mode!=='pooled'?sLatest:''),
        storeMedians:(st.mode!=='pooled'?st.medians:null)});
    }else{ // 1-2 confirmed weeks — building history: NEVER a band/colour/trend
      building.push({key,display:g.display,weeks,min:Math.min(...prices),max:Math.max(...prices)});
    }
  }
  ranked.sort((a,b)=>(b.signal-a.signal)||(b.weeks-a.weeks)||(a.display<b.display?-1:a.display>b.display?1:0));
  // AC-L4 near-twin double-rank gate (DC-2). After the ranked sort, collapse
  // any RESIDUAL near-twin — two ranked cards that are the SAME good at the SAME size but escaped
  // step (C)'s exact-bare match (yellow onion (2 lb) ~ onion (2 lb)) — down to ONE card, so the
  // household never sees one product twice with two independently-computed, possibly-contradictory
  // verdicts (the F5 double-card). Keys off pwLeadKey POST-CANON IDENTITY ONLY (§2.2) —
  // apple (gala)/(fuji) and red onion/onion have DISTINCT leadKeys → both survive → DC-1 and the
  // variety split stay intact. SUPPRESS, not demote / not merge-band: the survivor keeps its OWN
  // already-computed band/delta (no pooling, no verdict-math move); the redundant twin does not
  // render at all (it is NOT pushed to building — that would print a false "no trend yet"). The
  // survivor is the BEST-SUPPORTED fragment (most weeks; tie → higher signal → display), the honest
  // single view of one good. Under-delivery on the rare residual, never a false pooled band.
  const pwBestByLead={};
  for(const r of ranked){
    const lk=pwLeadKey(r.key), cur=pwBestByLead[lk];
    if(!cur
       || r.weeks>cur.weeks
       || (r.weeks===cur.weeks && r.signal>cur.signal)
       || (r.weeks===cur.weeks && r.signal===cur.signal && r.display<cur.display)) pwBestByLead[lk]=r;
  }
  const rankedOut = ranked.filter(r => pwBestByLead[pwLeadKey(r.key)] === r);
  building.sort((a,b)=>(b.weeks-a.weeks)||(a.display<b.display?-1:a.display>b.display?1:0));
  return {weeksRecorded:hist.length,ranked:rankedOut,building};
}

// One muted building-history row (1-2 weeks; never a band, colour, or stock-up note).
function pwBuildingRow(b){
  if(b.weeks===1) return `<div style="font-size:12px;color:var(--fg3);padding:4px 0"><span style="color:var(--fg2)">${esc(b.display)}</span> · first recorded price $${n2(b.min)}</div>`;
  return `<div style="font-size:12px;color:var(--fg3);padding:4px 0"><span style="color:var(--fg2)">${esc(b.display)}</span> · $${n2(b.min)}–$${n2(b.max)} over 2 weeks · not enough for a trend yet</div>`;
}

// One ranked watch card (§4b-4e). No coloured border, ever; colour appears only on the
// delta line and the band-bar dot (which reuses the same delta colour so they agree).
function pwCard(m){
  const d=m.delta;
  const bandBar=(m.max>m.min)
    ? `<div style="position:relative;height:4px;border-radius:2px;background:var(--border);max-width:220px;margin-top:8px"><div style="position:absolute;top:-2px;width:8px;height:8px;border-radius:50%;background:${d.color};left:${Math.round(((m.latest-m.min)/(m.max-m.min))*100)}%;transform:translateX(-50%)"></div></div>`
    : '';
  let note='';
  if(m.fireStockUp){
    note=`<div style="font-size:11px;line-height:1.5;color:var(--fg2);margin-top:8px"><span style="color:var(--green)">●</span> Cheapest you've recorded — stock up now if it keeps.</div>`;
  }else if(m.fireFreeze){
    note=`<div style="font-size:11px;line-height:1.5;color:var(--fg2);margin-top:8px"><span style="color:var(--green)">❄</span> Rare low on a freezable cut — buy extra and freeze the surplus.</div>`;
  }else if(m.trendHold){
    note=`<div style="font-size:11px;line-height:1.5;color:var(--fg3);margin-top:8px"><span style="color:var(--fg3)">●</span> At your low, but still falling — no rush.</div>`;
  }else if(m.freshNote){
    note=`<div style="font-size:11px;color:var(--fg3);margin-top:8px">Good week to buy it fresh.</div>`;
  }
  return `<div class="card" style="padding:14px;max-width:640px">
    <div class="flex justify-between items-center">
      <span style="font-weight:600;color:var(--fg);font-size:13px">${esc(m.display)}</span>
      <span style="font-size:11px;color:var(--fg3);white-space:nowrap">${m.weeks} weeks</span>
    </div>
    <div style="margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
      <span style="font-size:16px;font-weight:700;color:${d.color}">${d.caret} $${n2(m.latest)}</span>
      <span style="font-size:12px;color:${d.color}">${d.phrase}</span>
      ${d.mag&&(m.storeMode==='perstore'?m.storeWeeks>=5:m.weeks>=5)?`<span style="font-size:11px;color:var(--fg3)">${d.mag}</span>`:''}
    </div>
    <div style="font-size:11px;color:var(--fg3);margin-top:8px">low $${n2(m.min)}${m.lowStore?` <span style="color:var(--fg4)">(${esc(m.lowStore)})</span>`:''} · typ $${n2(m.storeMode==='perstore'?m.storeTypical:m.median)} · high $${n2(m.max)}</div>
    ${bandBar}
    ${note}
  </div>`;
}

// The Price Watch view (States A/B/D). Always renders the header first, then branches;
// wrapped by render()'s try/catch, but the sparse floor holds on its own (§6 AC-13).
function renderPriceWatch(){
  const weeks=Array.isArray(S.planHistory)?S.planHistory.length:0;
  const s=weeks===1?'':'s';
  // Re-openable "How this works" explainer (via reentryBtn's showOnboarding()) renders
  // in-context on the Prices tab, mirroring renderDashboard's placement (after the header,
  // before content). Pure static copy — no S/localStorage write from this render path.
  const exp=S.showOnboarding?renderOnboardingExplainer():'';
  // State A — 0 entries: full empty state mirroring the dashboard no-plan idiom.
  if(weeks===0){
    return `<div class="section-title flex justify-between items-center flex-wrap gap-8"><div><h2>Price Watch</h2><div class="sub">Your price record is empty.</div></div>${reentryBtn()}</div>${exp}
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46vh;text-align:center">
      <div style="font-size:48px;margin-bottom:16px;opacity:.3">⇅</div>
      <div class="section-title"><h2>No price history yet</h2>
        <div class="sub">Price trends appear once you've imported a few weeks — each item needs a confirmed price in at least 3 different weeks. Import this week's plan to start your price record.</div></div>
      <div class="flex gap-10" style="flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary" data-nav="review">Start Weekly Review</button>
        <button class="btn btn-default" onclick="loadMock();nav('import')">Load Sample Plan</button>
      </div>
    </div>`;
  }
  const model=pwBuildModel();
  const header=`<div class="section-title flex justify-between items-center flex-wrap gap-8"><div><h2>Price Watch</h2><div class="sub">Trends from your household's own confirmed prices · ${weeks} week${s} recorded</div></div>${reentryBtn()}</div>`;
  // State B — history exists but no item has ≥3 confirmed weeks yet.
  if(model.ranked.length===0){
    // F3: floor-framed (not the stale "3-4 weeks in" calendar promise), plus a live
    // accrual hint derived from the item closest to the 3-week floor (building is sorted
    // weeks-desc). Guard: no confirmed observations yet (building empty) → floor line only.
    const top=model.building[0];
    const hint=top?` You're closest on <b style="color:var(--fg)">${esc(top.display)}</b> — ${top.weeks}/3 weeks.`:'';
    const panel=`<div class="card"><div style="font-size:12px;color:var(--fg2);line-height:1.6">You've imported <b style="color:var(--fg)">${weeks}</b> week${s} so far. A price trend and any stock-up hint appear once an item has a confirmed price in <b style="color:var(--fg)">3 different weeks</b>.${hint}</div></div>`;
    const rows=model.building.length?`<div class="card">${model.building.map(pwBuildingRow).join('')}</div>`:'';
    return header+exp+panel+rows;
  }
  // State D — populated: quiet legend, ranked cards, then any building-history tail.
  const legend=`<div style="font-size:10px;color:var(--fg3);margin:-8px 0 16px;display:flex;gap:14px;flex-wrap:wrap"><span style="color:var(--green)">▾ at/below your low</span><span>▾ below typical</span><span style="color:var(--amber)">▴ above typical</span></div>`;
  const cards=model.ranked.map(pwCard).join('');
  const buildingBlock=model.building.length
    ? `<div class="section-title" style="margin-top:20px"><h2 style="font-size:14px">Building your record</h2><div class="sub">Items with fewer than 3 confirmed weeks — no trend yet.</div></div><div class="card">${model.building.map(pwBuildingRow).join('')}</div>`
    : '';
  return header+exp+legend+cards+buildingBlock;
}

// RENDERING
// S30 persistent safety banner — Notice B. Shown to any user whose EFFECTIVE template still lacks
// the corrected shelf-life rule, regardless of how it got there (hand-edited, carried forward from
// an old key by an earlier migration's one-hop write, or restored from a pre-S30 backup). Reuses the
// wasteDismissed UI-suppression idiom. Self-healing: fixing the template clears it with no dismissal.
// S33 — the bullets are now derived from missingSafetyRules(), so a user is told about EXACTLY the rules
// their template lacks and no others. A v10 hand-editor sees only the purchased-frozen bullet; a v9
// hand-editor sees both. Telling a v10 user their poultry rule is missing would be a false accusation.
const SAFETY_RULE_BULLETS={
  'v10-tier':`<li><strong>Fresh poultry and raw sausage are Tier 0</strong> — cook or freeze within <strong>2 days</strong>, at any size. A whole chicken is not a "large raw cut"; the old rule let it run 3–5 days.</li>
        <li><strong>Leftovers</strong> — cook by <strong>4 days</strong> after cooking, <strong>never day 5</strong>. The old rule filed them in a 3–5 day band.</li>
        <li>The produce and dairy windows are this planner's own estimates, <strong>not</strong> USDA FSIS figures — the old template claimed federal backing they never had.</li>`,
  'v11-frozen':`<li><strong>Food you buy already frozen</strong> — a raw protein bought frozen (fish fillets, shrimp, a frozen bird) stays Tier 3 and carries <strong>no cook-by and no freeze-by date at all</strong>. It has no clock while it is frozen — but the moment it thaws the clock starts and runs in full. Because it shows no date, its <strong>keep-it-frozen note</strong> and its <strong>thaw-in-the-refrigerator note</strong> are both required, and the old rule had neither.</li>`
};
function safetyNoticeBanner(){
  const missing=missingSafetyRules(S.promptTemplate);
  if(missing.length===0)return '';
  if(S.safetyNoticeDismissed)return '';
  return `<div class="card" style="border-left:3px solid var(--red);margin-bottom:12px">
    <div style="font-size:12px;font-weight:600;margin-bottom:6px">⚠ Your custom prompt template has out-of-date food-safety rules</div>
    <div style="font-size:11px;color:var(--fg2);line-height:1.5">
      You've customized your prompt template, so we left it exactly as you wrote it — we never overwrite your edits.
      But this update corrected shelf-life rules that were <strong>unsafe</strong>, and your copy still has the old ones:
      <ul style="margin:6px 0 6px 16px;padding:0">
        ${missing.map(k=>SAFETY_RULE_BULLETS[k]||'').join('\n        ')}
      </ul>
      Until you fix your template, plans it generates may give you a <strong>cook-by date that is too late</strong>, or leave a raw protein with <strong>no handling instructions at all</strong>.
      To take the corrections, open <strong>Prompt → Reset to Default</strong> (this replaces your customizations), or paste the rules above into your own template by hand.
    </div>
    <button class="btn btn-default" onclick="dismissSafetyNotice();render()" style="margin-top:8px;width:auto;font-size:10px;min-height:32px">I've handled this — dismiss</button>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// Error boundary: one malformed field in state/plan must not brick the whole app.
// On any exception in a screen renderer, show an in-UI recovery panel (never a white
// screen) that explains the data couldn't be rendered and offers the scoped reset.
function render(){
  try{
    renderNav();
    const main=document.getElementById('main');
    switch(S.screen){
      case 'dashboard':main.innerHTML=renderDashboard();break;
      case 'pantry':main.innerHTML=renderPantry();break;
      case 'review':main.innerHTML=renderReview();break;
      case 'generate':main.innerHTML=renderGenerate();break;
      case 'import':main.innerHTML=renderImport();break;
      case 'preferences':main.innerHTML=renderPreferences();break;
      case 'pricewatch':main.innerHTML=renderPriceWatch();break;
      case 'consumption':main.innerHTML=renderConsumption();break;
    }
    main.innerHTML=safetyNoticeBanner()+main.innerHTML;
    bindEvents();
  }catch(err){
    try{console.error('render failed',err);}catch(e){}
    renderRecoveryPanel(err);
  }
}

// In-UI recovery panel shown when a screen renderer throws. Reuses the app's amber ⚠
// idiom. Offers the scoped "Reset app data" as the escape hatch. Built with plain DOM
// writes (not the failing renderers) so it can't itself throw on the same bad state.
function renderRecoveryPanel(err){
  const main=document.getElementById('main');
  if(!main)return;
  const msg=(err&&err.message)?String(err.message):'unknown error';
  main.innerHTML=`<div class="card" style="border-color:#92400e;background:#1c1206;max-width:560px;margin:24px auto">
    <div class="flex gap-10" style="align-items:flex-start">
      <span style="font-size:20px;flex-shrink:0">⚠</span>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:700;color:var(--amber);margin-bottom:6px">This screen couldn't be displayed</div>
        <div style="font-size:12px;color:#fde68a;line-height:1.6;margin-bottom:10px">Some of your saved data looks malformed, so this view failed to render. Your other data is untouched. Try switching to another screen, or reset this app's data to clear the bad state (this only clears weekly-feast's own storage).</div>
        <div style="font-size:10px;color:var(--fg3);margin-bottom:14px;word-break:break-word">Details: ${esc(msg)}</div>
        <div class="flex gap-8 flex-wrap">
          <button class="btn btn-default" onclick="S.screen='dashboard';render()" style="width:auto">Go to Dashboard</button>
          <button class="btn btn-danger" onclick="resetAppData()" style="width:auto">Reset app data</button>
        </div>
      </div>
    </div></div>`;
  try{renderNav();}catch(e){}
}

// Scoped hard reset: clear ONLY this app's mp:* localStorage keys and reload. Behind a
// confirm(). Keeps unrelated localStorage (other apps on file://) intact.
function resetAppData(){
  if(!confirm('Reset weekly-feast? This permanently clears ALL of this app\'s data (pantry, preferences, plans, history, template) from this browser. Other sites are unaffected. This cannot be undone — export a backup first if you want to keep your data.'))return;
  try{
    const kill=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('mp:')===0)kill.push(k);}
    kill.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  }catch(e){}
  try{location.reload();}catch(e){}
}

function renderNav(){
  // Sidebar
  document.getElementById('sidebar').innerHTML=`
    <div class="logo"><h1>weekly-feast</h1><div class="sub">${todayStr()}</div></div>
    ${NAV_ITEMS.map(n=>`<button class="nav-btn ${S.screen===n.id?'active':''} ${n.disabled?'disabled':''}" data-nav="${n.id}" ${n.disabled?'disabled':''}><span class="icon">${n.icon}</span><span>${n.label}</span>${n.disabled?'<span class="soon">soon</span>':''}</button>`).join('')}`;
  // Bottom nav
  document.getElementById('bottom-nav').innerHTML=
    NAV_ITEMS.map(n=>`<button class="bnav-btn ${S.screen===n.id?'active':''} ${n.disabled?'disabled':''}" data-nav="${n.id}" ${n.disabled?'disabled':''}><span class="icon">${n.icon}</span>${n.label}</button>`).join('');
}

// ─── Onboarding / next-step shared components (P0-2 · loop discoverability) ──
// Step-number badge shared by the Generate next-step panel (Surface 1) and the
// dashboard explainer (Surface 2), so the two surfaces read as one system. Mirrors
// the .progress .bar active/inactive logic: pending = blue number, done = green ✓.
// aria-hidden — the step state is also carried in the adjacent copy, so the badge
// stays decorative and never doubles up the screen-reader announcement.
function stepBadge(label,done){
  const base='display:inline-flex;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;align-items:center;justify-content:center;flex-shrink:0';
  return done
    ? `<span aria-hidden="true" style="${base};background:#16653433;color:var(--green)">✓</span>`
    : `<span aria-hidden="true" style="${base};background:#1e293b;color:var(--blue)">${label}</span>`;
}

// SURFACE 2 — dismissable first-run explainer. Auto-shows on the empty dashboard
// until dismissed (persistent mp:onboarded-v1), and re-openable anywhere via
// "How this works". Same blue info-border + step badges as Surface 1 (one family).
function renderOnboardingExplainer(){
  const step=(n,title,body)=>`<div class="flex gap-10" style="align-items:flex-start;margin-bottom:12px">${stepBadge(n,false)}<div style="flex:1;font-size:12px;color:var(--fg2);line-height:1.5"><span style="color:var(--fg);font-weight:600">${title}</span> — ${body}</div></div>`;
  return `<div class="card" style="border-color:#0369a133">
    <h2 style="font-size:18px;font-weight:700;color:#f1f5f9;margin:0 0 10px">How weekly-feast works</h2>
    <p style="color:var(--fg2);line-height:1.6;max-width:640px;font-size:12px;margin-bottom:14px">This app doesn't have an AI inside it. It writes a detailed prompt for <strong style="color:#f1f5f9">Claude</strong> — you run that prompt at claude.ai, then paste Claude's answer back here. You're the courier between two apps: <strong style="color:#f1f5f9">weekly-feast</strong> handles the planning, <strong style="color:#f1f5f9">Claude</strong> does the live grocery-price research.</p>
    ${step('1','Prep &amp; generate',"Update your pantry, then generate a prompt tuned to what you have and what's on sale.")}
    ${step('2','Run it in Claude',"Paste the prompt into Claude with web search on. It researches this week's deals and builds your plan. Takes a few minutes.")}
    ${step('3','Import your plan',"Copy Claude's reply back here. You get a store-by-store shopping list and a week of meals.")}
    <div style="color:var(--fg3);font-size:11px;line-height:1.6;margin-top:6px;margin-bottom:14px">That's the whole loop — about two minutes of your attention on each end, and Claude does the slow part.</div>
    <button class="btn btn-default" onclick="dismissOnboarding()" style="width:auto">Got it</button>
  </div>`;
}

// Quiet re-entry control — always reachable from the dashboard on desktop AND mobile

  return `<button class="btn btn-default" onclick="showOnboarding()" style="width:auto;min-height:32px;font-size:10px">? How this works</button>`;
}

// ─── Dashboard ──────────────────────────────────────────────────────────────
function renderDashboard(){
  const plan=S.currentPlan;
  if(!plan){
    // Explainer auto-shows on first run (mp:onboarded-v1 unset); "How this works" forces it via S.showOnboarding.
    const showExp=S.showOnboarding||!load(KEYS.onboarded,false);
    let h=`<div class="section-title flex justify-between items-center flex-wrap gap-8" style="margin-bottom:12px"><div style="font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px">Dashboard</div>${reentryBtn()}</div>`;
    if(showExp)h+=renderOnboardingExplainer();
    h+=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46vh;text-align:center">
      <div style="font-size:48px;margin-bottom:16px;opacity:.3">◉</div>
      <div class="section-title"><h2>No Meal Plan Yet</h2><div class="sub">Start by reviewing your pantry and generating a prompt for Claude.</div></div>
      <div class="flex gap-10" style="flex-wrap:wrap;justify-content:center"><button class="btn btn-primary" data-nav="review">Start Weekly Review</button><button class="btn btn-default" onclick="loadMock();nav('import')">Load Sample Plan</button></div></div>`;
    return h;
  }
  const{meal_plan:mp=[],shopping_list:sl=[],cost_summary:cs={},metadata:md={},pantry_alerts:pa=[],nutrition_summary:ns=null}=plan;
  const byStore={};sl.forEach((item,i)=>{const s=item.store||'Other';if(!byStore[s])byStore[s]=[];byStore[s].push({...item,_gi:i})});
  const cc=Object.values(S.checkedItems).filter(Boolean).length;
  const conf=md.stores_confirmed||[],est=md.stores_estimated||[];

  let h=`<div class="section-title flex justify-between items-center flex-wrap gap-8"><div><h2>This Week's Meal Plan</h2><div class="sub">Plan for ${esc(md.plan_date||'this week')} · ${md.household_size||'?'} people · ${md.plan_days||7} days</div></div>${reentryBtn()}</div>`;
  // Re-openable explainer (via "How this works") also surfaces on the populated dashboard.
  if(S.showOnboarding)h+=renderOnboardingExplainer();

  // Low confidence
  if(md.confidence==='low') h+=`<div class="card" style="border-color:#92400e;background:#1c1206"><div class="flex gap-10" style="align-items:flex-start"><span style="font-size:18px">⚠</span><div><div style="font-size:12px;font-weight:700;color:var(--amber);margin-bottom:4px">LOW CONFIDENCE PLAN</div><div style="font-size:11px;color:#fde68a;line-height:1.5">This plan relies heavily on estimated pricing because current ad data was limited. Verify prices before shopping.</div></div></div></div>`;

  // Pantry alerts
  if(pa.length) h+=`<div class="card" style="border-color:#854d0e;background:#1a1506"><div style="font-size:11px;font-weight:600;color:var(--amber);margin-bottom:8px">⚠ PANTRY ALERTS</div>${pa.map(a=>`<div class="flex gap-8" style="font-size:12px;margin-bottom:6px;line-height:1.5"><span style="color:#f59e0b;font-weight:700;white-space:nowrap;flex-shrink:0">${esc(a.item)}:</span><span style="color:#fde68a">${esc(a.concern)}</span></div>`).join('')}</div>`;

  // Cost summary
  h+=`<div class="card flex gap-24 items-center flex-wrap">
    <div><div style="font-size:10px;color:var(--fg3);text-transform:uppercase">Total Estimated</div><div style="font-size:22px;font-weight:700;color:var(--blue)">$${n2(cs.total_estimated)}</div></div>
    <div><div style="font-size:10px;color:var(--fg3);text-transform:uppercase">Per Person / Day</div><div style="font-size:22px;font-weight:700;color:var(--green)">$${n2(cs.per_person_per_day)}</div></div>
    ${cs.by_store?Object.entries(cs.by_store).map(([s,a])=>`<div><div style="font-size:10px;color:var(--fg3)">${esc(s)}</div><div style="font-size:14px;font-weight:600;color:var(--fg2)">$${n2(a)}</div></div>`).join(''):''}
    ${(conf.length||est.length)?`<div style="width:100%;padding-top:6px;border-top:1px solid var(--border);font-size:10px;color:var(--fg3)">${conf.length?'Confirmed: '+esc(conf.join(', ')):''}${conf.length&&est.length?' · ':''}${est.length?'<span style="color:var(--amber)">Estimated: '+esc(est.join(', '))+'</span>':''}</div>`:''}
  </div>`;

  // Weekly nutrition — plain informational line (MyPlate weekly frame). Minimal by
  // design: a designed affect-bearing quality strip is a deferred, Marshaling-gated item.
  if(ns){
    const bits=[];
    if(Array.isArray(ns.protein_sources)&&ns.protein_sources.length)bits.push('Proteins: '+esc(ns.protein_sources.join(', ')));
    if(Array.isArray(ns.veg_subgroups)&&ns.veg_subgroups.length)bits.push('Veg groups: '+esc(ns.veg_subgroups.join(', ')));
    if(ns.seafood_servings!=null)bits.push('Seafood: '+esc(String(ns.seafood_servings))+'/wk');
    bits.push('Produce ~half the plate: '+(ns.produce_half_plate?'yes':'no'));
    const sf=Array.isArray(ns.shortfalls)?ns.shortfalls.filter(x=>x!=null&&String(x).trim()):[];
    const sfHtml=sf.length?`<div style="color:var(--amber);font-weight:600;margin-top:6px">⚠ Nutrition shortfalls this week:</div>${sf.map(x=>`<div style="color:#fde68a;margin-top:2px">• ${esc(String(x))}</div>`).join('')}`:'';
    h+=`<div class="card" style="padding:12px 16px"><div style="font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Weekly nutrition (MyPlate frame — general guidance)</div><div style="font-size:11px;color:var(--fg2);line-height:1.6">${bits.join(' · ')}${sfHtml}${ns.notes?`<div style="color:var(--fg3);margin-top:3px">${esc(ns.notes)}</div>`:''}</div></div>`;
  }

  // Shopping list first on both mobile and desktop — it's the active working area
  h+=renderShoppingSection(sl,byStore,cc);
  h+=renderMealCards(mp);
  // Reflective epilogue — the loop you close after the week (E2-1 waste capture) + the
  // "why" you read after the "what". Both below the plan; plan renders first, on top.
  h+=renderWasteCard();
  h+=renderWhyPlanCard(plan);
  return h;
}

// "Why this plan" — a quiet, neutral, collapsed-by-default disclosure card carrying Claude's
// post-sentinel narrative (S.whyPlanOpen, ephemeral). Neutral border (no state color); reads
// plan.why_plan directly (NOT the 1136 destructure). Absent narrative → no card at all.
// XSS: the narrative is pasted, untrusted text — esc() every segment BEFORE any <br>/paragraph
// HTML conversion; no Markdown, no raw HTML injection (same as every other free-text field).
function renderWhyPlanCard(plan){
  if(!plan.why_plan)return '';
  const text=String(plan.why_plan);
  const open=!!S.whyPlanOpen;
  const chev=open?'▾':'▸';
  // Teaser: first non-empty line (or first ~90 chars) — a taste, not the whole thing.
  const firstLine=(text.split(/\r?\n/).find(l=>l.trim())||'').trim();
  const teaser=firstLine.length>90?firstLine.slice(0,90).replace(/\s+$/,'')+'…':firstLine;
  const teaserHtml=open?'':`<span style="color:var(--fg3);font-size:11px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(teaser)}</span>`;
  let body='';
  if(open){
    const paras=text.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
    const inner=paras.map((p,idx)=>`<p style="color:var(--fg2);font-size:12px;line-height:1.6;margin-bottom:${idx===paras.length-1?'0':'8px'}">${esc(p).replace(/\r?\n/g,'<br>')}</p>`).join('');
    body=`<div style="max-width:640px;margin-top:10px">${inner}</div>`;
  }
  return `<div class="card" style="border-color:var(--border)">
    <div id="whyplan-header" role="button" tabindex="0" aria-expanded="${open?'true':'false'}" onclick="S.whyPlanOpen=!S.whyPlanOpen;render()" style="display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer">
      <span style="color:var(--fg3);font-size:12px;flex-shrink:0">${chev}</span>
      <span style="color:var(--fg2);font-size:12px;font-weight:600;flex-shrink:0">Why this plan</span>
      ${teaserHtml}
    </div>
    ${body}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// WASTE CAPTURE (E2-1) — the first new write-path since S1. Reflective-epilogue
// dashboard card keyed to the just-closed week (planHistory[1]). Classifier +
// UI-visibility predicate + write contracts + surface.
// ═══════════════════════════════════════════════════════════════════════════

// Domain tri-state classifier (N3). Reads S.wasteLog ONLY — NEVER the
// dismiss map. The sole classifier E2-2/E2-3 use. Only an affirmative
// zeroWaste===true is ever 'zero'; absence (incl. a dismissed week) is 'absent'.
function wasteStateFor(d){
  const rec=S.wasteLog[d];
  if(!rec)                 return 'absent';   // (c) no wasteLog key → ABSENT
  if(rec.zeroWaste===true) return 'zero';     // (b) affirmative-zero — the ONLY zero
  return 'waste';                             // (a) has ≥1 valid item (normalizer-guaranteed)
}
// UI-only card-visibility predicate (N3-DISMISS) — the SOLE reader of the
// dismiss map. Dismiss flips the 2nd conjunct (hides the ask) without touching the
// 1st (domain stays absent). Proven: dismissed ⟹ absent, never zero.
function showCardFor(d){ return wasteStateFor(d)==='absent' && !S.wasteDismissed[d]; }

// Write contracts (N6) — pure data writes: each is EXACTLY one keyed write
// + one save() (Q3 anti-nudge symmetry: dismiss is never cheaper than the safe zero).
function commitWaste(weekDate,rawItems){
  const items=(Array.isArray(rawItems)?rawItems:[]).map(normalizeWasteItem).filter(Boolean);
  if(items.length===0) return false;          // add-mode NEVER persists an empty non-affirmative record
  S.wasteLog[weekDate]={_v:1,capturedAt:new Date().toISOString(),items};
  saveWasteLog();
  return true;
}
function markZeroWaste(weekDate){             // the one-tap "nothing wasted" → affirmative-zero (b)
  S.wasteLog[weekDate]={_v:1,capturedAt:new Date().toISOString(),items:[],zeroWaste:true};
  saveWasteLog();
}
function dismissWaste(weekDate){              // "not now" → UI-suppression ONLY; writes NO domain data (stays absent c)
  S.wasteDismissed[weekDate]=new Date().toISOString();
  saveWasteDismissed();
}
function dismissSafetyNotice(){              // S30 Notice B → UI-suppression ONLY; writes NO domain data (mirrors dismissWaste)
  S.safetyNoticeDismissed=true;
  save(KEYS.safetyNoticeV11,true);   // S33 — new key; an old dismissal must never silence a new hazard
}

// D3 $ realization: waste_$ = SNAPSHOTTED line price × fraction (default
// 1.0 = "most/all"), quantity NEVER parsed, price NEVER re-derived. fraction ≤ 1 ⇒
// per-item $ ≤ price (the safe-under-report floor, D6-7). A null/absent price is an
// UNPRICED item ($ UNKNOWN) — counted separately, NEVER as $0 (absent-never-0 on the
// dollar axis). `estimated` propagates if any contributing item is estimated (D6-4).
function wasteDollars(rec){
  let sum=0,priced=0,unpriced=0,estimated=false;
  const items=(rec&&Array.isArray(rec.items))?rec.items:[];
  for(const it of items){
    const f=(typeof it.fraction==='number'&&it.fraction>0&&it.fraction<=1)?it.fraction:1;
    if(typeof it.price==='number'){sum+=it.price*f;priced++;if(it.price_type==='estimated')estimated=true;}
    else unpriced++;
  }
  return {sum,priced,unpriced,estimated};
}

// Perishability ordering (D2): shopping_list items carry no shelf_life_tier
// (it lives on meal_plan ingredients), so join the closing week's OWN meal_plan by
// normalized name (pwNorm — the S13 fold) to fetch the tier; 0/1 (fresh) sort FIRST.
// Unknown-tier items sort LAST. Ordering, NEVER exclusion (D2.2); no price-floor (D2.3).
function wasteTierMap(plan){
  const map={};
  const mp=(plan&&Array.isArray(plan.meal_plan))?plan.meal_plan:[];
  for(const day of mp){
    const ings=(day&&day.dinner&&Array.isArray(day.dinner.ingredients))?day.dinner.ingredients:[];
    for(const ing of ings){
      if(!ing||typeof ing!=='object')continue;
      const t=ing.shelf_life_tier;
      if(Number.isInteger(t)&&t>=0&&t<=3){const k=pwNorm(ing.item);if(k&&!(k in map))map[k]=t;}
    }
  }
  return map;
}
function wasteChips(plan){
  const sl=(plan&&Array.isArray(plan.shopping_list))?plan.shopping_list:[];
  const tm=wasteTierMap(plan);
  const arr=sl.map((it,i)=>({it,gi:i,tier:(()=>{const k=pwNorm(it&&it.item);return (k&&k in tm)?tm[k]:9;})()}));
  arr.sort((a,b)=>(a.tier-b.tier)||(a.gi-b.gi));   // fresh first, then original order (stable)
  return arr;
}

// ── Surface (L1–L8). Neutral border (trust, not alarm); reflective-epilogue
// zone below the plan; concerns ONLY planHistory[1] (the just-closed week). ────
function renderWasteCard(){
  const hist=Array.isArray(S.planHistory)?S.planHistory:[];
  if(hist.length<2) return '';                     // no closed week yet → NO card (L6 never-a-brick)
  const entry=hist[1];                             // the just-closed (pre-import, superseded) week
  if(!entry||typeof entry!=='object'||typeof entry.date!=='string'||!entry.date) return '';
  const d=entry.date;
  const state=wasteStateFor(d);
  const editing=(S.wasteEditing===d);
  if(state!=='absent' && !editing) return renderWasteRecorded(d,state);   // (a/b) recorded → quiet muted line
  if(state==='absent' && S.wasteDismissed[d] && !editing) return '';      // dismissed (showCardFor false) → nothing
  return renderWasteAsk(d,entry);                                          // ASK / add-mode
}
function renderWasteRecorded(d,state){
  let inner;
  if(state==='zero'){ inner='nothing wasted'; }
  else{
    const dl=wasteDollars(S.wasteLog[d]);
    const dollar=dl.priced>0?('$'+dl.sum.toFixed(2)):'$—';   // 0 priced items → $— (never a fabricated $0.00)
    const estTag=dl.estimated?'<span style="font-size:9px;opacity:.8"> (est.)</span>':'';
    const unp=dl.unpriced>0?` · + ${dl.unpriced} unpriced`:'';
    inner=`${dollar}${estTag} tossed${unp}`;
  }
  // Dashboard on-ramp: a quiet text-weight PULL link to the
  // History retrospective, rendered ONLY at N≥2 logged weeks (matching D1's floor, so it
  // never points to a hollow room). Carries NO cross-week figure — a zero-data navigation
  // OFFER on a line that already renders, not a content-push (does not collide with
  // Constraint #12). Never labeled "Log" (points to History, via the data-nav router idiom).
  const onramp=wasteLoggedCount()>=2
    ?`<button data-nav="consumption" style="background:none;border:none;color:var(--fg3);cursor:pointer;font-size:11px;font-family:var(--font);padding:2px 4px;min-height:32px">· see your waste history →</button>`
    :'';
  return `<div class="card" style="border-color:var(--border)"><div style="display:flex;align-items:center;gap:6px;min-height:36px;font-size:11px;color:var(--fg3);flex-wrap:wrap"><span>Last week · ${inner} · </span><button onclick="editWaste('${d}')" style="background:none;border:none;color:var(--fg3);text-decoration:underline;cursor:pointer;font-size:11px;font-family:var(--font);padding:2px 4px;min-height:32px">edit</button>${onramp}</div></div>`;
}
function renderWasteAsk(d,entry){
  const open=S.wasteAddOpen||S.wasteEditing===d;
  if(!open){
    // Collapsed card — three PEER one-tap choices (T4): "Nothing wasted" is a quiet
    // ghost/outline affordance (NOT magnetic filled-green), and "not now" reads as a coequal
    // choice (peer weight, no corner-escape framing) so a tired user's reflex-tap-to-clear
    // routes to safe ABSENT, never a fabricated affirmative-zero. Reward = the toast, not fill.
    return `<div class="card" style="border-color:var(--border)">
      <div style="font-size:12px;color:var(--fg2);font-weight:600">Last week</div>
      <div style="font-size:11px;color:var(--fg3);margin-top:2px">Toss anything you meant to eat?</div>
      <div class="flex gap-10 items-center flex-wrap" style="margin-top:12px">
        <button onclick="wasteMarkZero('${d}')" style="background:transparent;border:1px solid var(--fg3);border-radius:5px;color:var(--fg2);cursor:pointer;font-size:11px;font-family:var(--font);padding:7px 14px;min-height:40px">Nothing wasted</button>
        <button onclick="wasteOpenAdd('${d}')" style="background:none;border:none;color:var(--blue);cursor:pointer;font-size:11px;font-family:var(--font);padding:4px;min-height:40px">Log what we tossed →</button>
        <button onclick="wasteDismiss('${d}')" style="background:none;border:none;color:var(--fg3);cursor:pointer;font-size:11px;font-family:var(--font);padding:4px;min-height:40px">not now</button>
      </div></div>`;
  }
  // Add-mode (expanded) — type-ahead + perishability-ordered tap-chips; NO full-list checklist.
  const plan=entry.plan||{};
  const chips=wasteChips(plan).filter(c=>!S.wasteDraft.some(x=>x._gi===c.gi));  // hide already-added on-list items
  const chipHtml=chips.slice(0,8).map(c=>`<button onclick="wasteAddChip('${d}',${c.gi})" style="background:#1e293b;border:1px solid var(--border);border-radius:14px;color:var(--fg2);cursor:pointer;font-size:11px;font-family:var(--font);padding:5px 12px;min-height:32px;margin:0 6px 6px 0">${esc(c.it.item)}</button>`).join('');
  const chipBlock=chips.length?`<div style="font-size:9px;color:var(--fg4);margin:8px 0 4px">from last week:</div><div style="display:flex;flex-wrap:wrap">${chipHtml}</div>`:'';
  const draftHtml=S.wasteDraft.map((ln,idx)=>renderWasteDraftLine(ln,idx)).join('');
  return `<div class="card" style="border-color:var(--border)">
    <div style="font-size:12px;color:var(--fg2);font-weight:600">What did you throw out?</div>
    <div style="font-size:11px;color:var(--fg3);margin-top:2px;margin-bottom:10px">Just the things you meant to eat but tossed.</div>
    <input class="inp" id="waste-add-input" placeholder="type an item…" onkeydown="if(event.key==='Enter'){event.preventDefault();wasteAddTyped('${d}')}">
    ${chipBlock}
    ${draftHtml?`<div style="margin-top:10px">${draftHtml}</div>`:''}
    <div class="flex gap-8" style="margin-top:12px"><button class="btn btn-primary" onclick="wasteCommit('${d}')" style="width:auto;min-height:40px;font-size:11px">Done</button></div>
  </div>`;
}
// Per-item draft line: name · the 3-pill segmented ordinal (default most/all) · $ · ×.
// The ordinal is ITEM-level, inside add-mode only — never sharing a row/moment with the
// WEEK-level "Nothing wasted" tap (conflation guard, structural).
function renderWasteDraftLine(ln,idx){
  const f=(typeof ln.fraction==='number'&&ln.fraction>0&&ln.fraction<=1)?ln.fraction:1;
  const sel=v=>Math.abs(f-v)<1e-9;
  const pill=(v,label)=>`<button onclick="wasteSetFraction(${idx},${v})" style="background:${sel(v)?'#0369a1':'#1e293b'};border:none;color:${sel(v)?'#fff':'var(--fg2)'};cursor:pointer;font-size:10px;font-family:var(--font);padding:4px 8px;min-height:32px">${label}</button>`;
  const seg=`<span style="display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;flex-shrink:0">${pill(0.25,'a little')}${pill(0.5,'about half')}${pill(1,'most/all')}</span>`;
  const priced=(typeof ln.price==='number');
  const dollar=priced?('$'+(ln.price*f).toFixed(2)):'$—';                       // null price → $— (never $0.00)
  const estTag=(priced&&ln.price_type==='estimated')?'<span style="font-size:9px;opacity:.8"> (est.)</span>':'';
  const col=priced?(ln.price_type==='confirmed'?'var(--green)':'var(--amber)'):'var(--fg4)';
  const offNote=ln._offList?` <span style="font-size:9px;color:var(--fg4)">(not on last week's list)</span>`:'';
  return `<div class="flex items-center gap-8" style="padding:6px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;min-height:40px">
    <span style="flex:1;min-width:110px;font-size:12px;color:var(--fg)">${esc(ln.name)}${offNote}</span>
    ${seg}
    <span style="font-size:11px;color:${col};min-width:56px;text-align:right">${dollar}${estTag}</span>
    <button class="rm-btn" onclick="wasteRemoveDraft(${idx})" title="Remove">×</button>
  </div>`;
}

// ── Waste UI handlers (glue). The pure write contracts stay minimal (above); these
// wrappers add toast/render/ephemeral-reset. esc() protects every rendered name.
function wasteOpenAdd(d){ S.wasteAddOpen=true; S.wasteEditing=null; S.wasteDraft=[]; render(); }
function _wasteClosingSL(){ const e=(Array.isArray(S.planHistory)?S.planHistory:[])[1]; return (e&&e.plan&&Array.isArray(e.plan.shopping_list))?e.plan.shopping_list:[]; }
function _wasteSnap(it,gi){ // SNAPSHOT the shopping line into a draft item (N2 binding: $ is OWNED by the record)
  return {name:str(it.item),price:num0(it.price),price_type:(typeof it.price_type==='string'?it.price_type:undefined),store:str(it.store)||undefined,fraction:1,_gi:gi};
}
function wasteAddChip(d,gi){ const it=_wasteClosingSL()[gi]; if(!it)return; S.wasteDraft.push(_wasteSnap(it,gi)); render(); }
function wasteAddTyped(d){
  const el=document.getElementById('waste-add-input'); if(!el)return;
  const raw=String(el.value||'').trim(); if(!raw)return;
  const sl=_wasteClosingSL(); const key=pwNorm(raw); let mi=-1;
  if(key){ for(let i=0;i<sl.length;i++){ if(sl[i]&&pwNorm(sl[i].item)===key){mi=i;break;} } }   // bind by identity when the typed name resolves to a list item
  if(mi>=0 && !S.wasteDraft.some(x=>x._gi===mi)){ S.wasteDraft.push(_wasteSnap(sl[mi],mi)); }
  else{ S.wasteDraft.push({name:raw,fraction:1,_offList:true}); }                                // off-list escape hatch: no price/store → $ UNKNOWN, non-buy-linked
  render();
}
function wasteSetFraction(idx,f){ if(S.wasteDraft[idx])S.wasteDraft[idx].fraction=f; render(); }
function wasteRemoveDraft(idx){ S.wasteDraft.splice(idx,1); render(); }
function wasteCommit(d){
  const wrote=commitWaste(d,S.wasteDraft);          // no-op if the draft normalizes empty (N6)
  S.wasteAddOpen=false; S.wasteEditing=null; S.wasteDraft=[];
  if(wrote)showToast('Logged.');

}
function wasteMarkZero(d){ markZeroWaste(d); S.wasteAddOpen=false; S.wasteEditing=null; S.wasteDraft=[]; showToast('Logged — nothing wasted.'); render(); }
function wasteDismiss(d){ dismissWaste(d); S.wasteAddOpen=false; S.wasteEditing=null; S.wasteDraft=[]; render(); }
function editWaste(d){    // reopen capture over an already-recorded week (user control/freedom)
  const rec=S.wasteLog[d];
  S.wasteEditing=d; S.wasteAddOpen=true;
  S.wasteDraft=(rec&&Array.isArray(rec.items))?rec.items.map(it=>({name:it.name,price:(typeof it.price==='number'?it.price:undefined),price_type:it.price_type,store:it.store,fraction:(typeof it.fraction==='number'?it.fraction:1)})):[];
